K("Survival","m","Read the land: game trails that bend around one slope, a spring with no source, wind funnelling through the valley. Steer the party toward the ridge the animals avoid.",{ok:["adv:Investigation"],bad:["dis:Survival","text:The trail dead-ends and the party loses an hour backtracking"]}),
K("Investigation","m","Compare the map fragment, a rubbing or the stories against the real ridgelines, matching the notched peak on the sketch to the one on the horizon.",{ok:["adv:Survival,Athletics"],bad:["dis:Investigation","text:Matches the wrong peak with total confidence and the party heads the wrong way"]}),
K("Perception","e","Spot an old waymarker: a cairn of three stacked stones, a rusted iron peg, a faded carving shaped like a closed eye. One success only.",{cap:1,ok:["adv:Arcana,Religion","text:The party now has a symbol to look for"]}),
K("History","h","Remember who sealed the cave. The order that built it sited its vaults where three ridges meet and marked them with a closed-eye sigil, and left a rite for opening them. One success only.",{cap:1,ok:["adv:Religion","text:The party learns the sigil and a fragment of the rite"]}),
K("Athletics","m","Scramble up a scree slope or rocky spur to see the whole valley at once and spot where three ridges meet at a hidden cleft.",{ok:["adv:Perception"],bad:["hd:1"]})]},
{n:"Stage 2: Signs in the Stone",adv:{s:2},intro:"The party is in the right place but can’t see the cave. Learn what the Veil is doing and where the entrance really is. Hazard save: Wisdom, Moderate DC.",skills:[
K("Arcana","m","Feel the faint prickle of an illusion woven over an abjuration. This is a ward, a deliberate push on the mind.",{ok:["adv:Perception,Investigation"],bad:["dis:Hazard","text:The ward pushes back and the character’s thoughts slide"]}),
K("Perception","h","Notice a draft blowing the wrong way, a faint whistle from solid rock, or a line where bats and swallows veer off in mid-flight.",{ok:["adv:Arcana","text:The party can pinpoint the entrance to within a few paces"],bad:["dis:Perception","text:Certain they have found it, points confidently at the wrong spot"]}),
K("Nature","m","Thick ferns and damp-loving lichen in a ring on a dry slope. Guano under a bare patch. Something below is breathing cool, wet air.",{ok:["adv:Perception"]}),
K("Investigation","h","Watch how shadows fall: a boulder’s shadow bends around a corner that isn’t there, and the line of sunlight breaks where an opening should be. Fresh chisel marks along an edge that should be weathered smooth.",{bad:["dis:Investigation","text:Mist swirls in and smears the clues"]}),
K("Insight","m","Notice a companion’s gaze sliding off the same patch of rock again and again. The Veil works on attention itself, so watch each other’s eyes and call out when someone looks away.",{ok:["adv:Hazard"]})]},
{n:"Stage 3: Opening the Veil",intro:"The ward is plain now: a pattern of pale lines rippling through the stone like light on water. Goal: open it. Hazard save: Wisdom, Hard DC.",skills:[
K("Arcana","h","Pull at the ward’s threads and unpick the pattern a strand at a time. For dispel magic, the Veil is a 5th-level spell.",{bad:["text:Arcane backlash: Moderate force damage to the character"]}),
K("Religion","m","Recognize the closed-eye sigil at the base of the entrance and recite the old blessing the keepers used to pass their own wards.",{ok:["adv:Arcana"]}),
K("Investigation","m","Three carved rings with eyes are set into the rock around the opening. Work out that they must be turned until all three eyes face the light.",{ok:["adv:Sleight of Hand,Arcana"]}),
K("Sleight of Hand","m","Thieves’ tools. Ease the stone rings around with careful hands without setting off the wards.",{bad:["dis:Arcana","text:The rings snap back and the Veil flares"]}),
K("Performance","m","The Veil hums at a low note. Match it with a hum, a tap on the stone or a chant, so the ward hears a friend instead of a thief.",{bad:["text:Wrong pitch, the ward shrieks: each character immediately makes a Wisdom save at the current hazard DC (doesn’t count toward the challenge)"]})]}],
out:{total:"The Veil parts like a curtain drawn by a patient hand. The party enters unseen with every resource intact, and has advantage on initiative in the first encounter. The entrance can be reopened the same way for 24 hours.",
ok:"The Veil opens, but it knows it was forced. A deep note rolls across the mountainside and whatever lives inside is awake and listening. The first encounter begins with its occupants alert and prepared. The entrance seals itself 10 minutes after it opens, so the party must find another way out or the inner mechanism that reopens it.",
fail:"The mist closes in and the mountain turns the party around until they can’t tell which way is down. The ground gives way and they tumble through a hidden sinkhole into the cave’s lower gallery, taking Moderate bludgeoning damage. Each character gains a level of exhaustion. The inhabitants are awake, the walls are too slick to climb without a Very Hard Athletics check, and the main entrance has sealed from within.",
failFx:["exhAll:1"],
alt:{n:"Alternate failure: The Last Keeper",t:"As the party gives up, a weathered hermit steps out of the mist, leaning on a staff. She has watched the cave for forty years and is tired of watching. She will open the way, but wants something in return: a favor, a promise to seal it again, or an object recovered from inside. The party enters on her terms, and each character gains a level of exhaustion."}}});

C({id:"moon-gate",b:"Custom",name:"The Moon Gate",tags:["social","magic"],cx:2,scale:"Each round is one check per character. The circle is active only while the full moon is directly overhead, about one hour.",
fl:"The full moon hangs silver over the clearing. A ring of tiny lights swirls among the mushrooms: the fey. Their song is almost music, almost language. At the center of the circle hovers an aura like heat that refuses to fade. It is the veil between worlds, thin enough to cross if you know how to ask.",
setup:"For a party of 4–5 characters around 5th level. The characters must win the fey’s blessing and attune to the thinning veil to open a portal to the Feywild. The fey are capricious: they are impressed by beauty, cleverness and respect, and dislike aggression, boredom and iron. A character holding iron or steel weapons without hiding them or setting them aside at the edge of the clearing has disadvantage on all Charisma checks until they do. Primary skills are DC 15; secondary skills are DC 18 and stand out in the fey’s eyes.",
notes:["Each character makes one check per round. If someone has no fitting skill, call a group check: if at least half succeed, it counts as one success.","Fey Touched feat or Feywild origin: advantage on Persuasion, at your discretion.","Light and illusion spells (dancing lights, minor illusion, prestidigitation) impress the fey automatically and can stand in for a Performance check.","Failure doesn’t stop the story. Even with no portal tonight, the fey know what the characters seek and can become the start of the next adventure.","Players may propose other skills or spells. A stretch gets a higher DC and a single success."],
haz:{n:"The Wandering Light",stat:"Wisdom",dcNum:13,t:"At initiative 20 each round a dancing light-spirit draws the attention of one random character, who makes the save.",pass:"They resist with a smile.",fail:["text:The character is charmed until the end of their next turn and spends their action following the light away from the circle."]},
quick:[{l:"Light or illusion spell (replaces a Performance check)",s:1,e:["adv:Persuasion,Nature"],t:"Dancing lights, minor illusion or prestidigitation impress the fey automatically"}],
stages:[{n:"Primary skills (DC 15) and secondary skills (DC 18)",skills:[
K("Performance","m","Join the fey’s dance or offer a song, poem or melody that moves them.",{ok:["adv:Persuasion,Nature","text:The circle glows brighter"],bad:["text:The nearest fey turns her back and a cold wind snuffs three lights of the circle"]}),
K("Arcana","m","Read the weave of magic within the circle and set your hands at the right flow points, tuning the veil’s resonance.",{ok:["text:The aura deepens and a frame of pale light becomes visible as a gate"],bad:["text:The energy disperses wrongly: 1d6 psychic damage from a discordant harmonic in the mind"]}),
K("Nature","m","Recognize the right herbs, the moon’s dew or the offerings left at the edge of the circle, things the fey hold sacred.",{ok:["text:The fey stop dancing and bow"],bad:["text:The offering is wrong or clumsy: the fey scatter and the circle darkens briefly"]}),
K("Persuasion","m","Speak to the queen of the fey at the edge of the circle with flattery, a bargain or an honest plea. The fey love a good story.",{ok:["text:The queen applauds and the circle lights up"],bad:["text:The approach seems clumsy and a fey flicks a spark at the character (1 fire damage, no save)"]}),
K("Insight","m","Read the fey’s moods: who is delighted, who is bored, who is suspicious, and adjust the party’s approach.",{ok:["adv:Persuasion,Performance"],bad:["text:Misreads the signs and the party unwittingly insults a fey"]}),
K("History / Religion","h","Recall specific fey customs, ancient names for Feywild gates, or ritual words older than Elvish.",{dcN:18,base:"History",ok:["adv:Arcana","text:The circle blazes white-gold"],bad:["text:The invocation is nearly right but the fey grimace as if hearing an out-of-tune lute. No extra penalty"]}),
K("Acrobatics / Athletics","h","A striking physical display: leaping the circle’s stones, whirling, or mimicking the fey’s aerial turns. The fey get bored of the same trick, so once per challenge.",{dcN:18,base:"Acrobatics",once:1,ok:["text:The fey applaud the character’s grace"],bad:["text:Stumbles or overshoots and the fey burst into (not unkind) laughter, their attention scattering"]})]}],
out:{total:"The fey crown the characters with flowers and the portal opens wide, golden light pouring out. Each character chooses a gift: advantage on the first ability check in the Feywild, or one free use of faerie fire before the next long rest.",
ok:"The portal opens, but narrowly, and the fey are only partly satisfied. The veil tears rather than opens smoothly and each character loses one Hit Die. The portal stays open long enough to pass, but closes quickly.",
fail:"The fey scatter, laughing or angry. The veil thickens and the moon begins to sink. The portal won’t open tonight and the party must wait for the next full moon. If the journey is urgent, the fey may offer a bargain: a memory, a name, a service. The DM sets the price.",okFx:["hdAll:1"]}});

C({id:"burning-building",b:"Custom",name:"Burning Building",tags:["chase","survival","combat"],cx:2,scale:"1 round is about 30 seconds. Works at any tier, scaled by DC.",
fl:"Flames lick the roof beams and black smoke rolls down the corridors. Behind the shutters, voices are still screaming. The building will not stand much longer, and everyone inside is counting on you.",
setup:"The party arrives at a building fully alight with civilians trapped inside. Fire spreads, smoke thickens and the structure weakens every round. The characters must find the trapped people, get them out and escape before it comes down. As a rule of thumb, each success is one victim located, freed or carried clear. The final escape is handled separately: when the party reaches 6 successes, use the Escape stage. Where the table allows, call a group check so everyone takes part.",
notes:["Tier 1 (levels 1–4): house or tavern, 2–4 victims, Moderate 5 (1d10), Dangerous 11 (2d10).","Tier 2 (5–10): manor or warehouse, 4–8 victims, Moderate 11 (2d10), Dangerous 22 (4d10).","Tier 3 (11–16): cathedral or fortress, 8–12 victims, Moderate 22 (4d10), Dangerous 55 (10d10).","Tier 4 (17–20): palace or city block, 12–20 victims, Moderate 55 (10d10), Dangerous 99 (18d10).","To raise or lower difficulty, shift every DC by one level (use the tier shift at the top), or change the failures allowed from three.","No darkvision and no light source: disadvantage on Perception in the smoke. Flying or climbing speeds: advantage on Acrobatics. No short or long rests inside the building.","Hard choices: two cries for help in opposite directions (does the party split?). A ledger, relic or heirloom could be saved at the cost of a round. A weakened wall opens a faster exit but may trap someone below.","Aftermath: survivors can return as NPCs tied to the party. The party’s reputation shifts with the result. Whoever started the fire is the next hook."],
phases:[{from:1,n:"Rounds 1–2: Smoke",t:"The ground floor is choked with smoke but passable. Screams come from above and behind jammed doors. Hazard saves begin on round 2."},
{from:3,n:"Rounds 3–4: Spread",t:"Fire climbs the stairwell and eats the floors. Beams groan, and the heat makes steel too hot to hold."},
{from:5,n:"Round 5 onward: Flashover",t:"Everything flammable ignites at once. Ceilings sag and every route out is closing. After round 6, roll on the Collapse table each round."}],
haz:{n:"Smoke and heat",stat:"Constitution",dc:"m",esc:2,from:2,t:"On initiative 20 each round after the first, every character in the building makes the save. The DC rises one level every two rounds: 15 on rounds 2–3, 20 on rounds 4–5, 25 on rounds 6–7, 30 from round 8.",fail:["text:The character takes Moderate fire damage from smoke and heat.","hd:1"]},
rtable:{n:"Collapse table",from:7,note:"Once the challenge runs past round 6, roll a d6 at the start of each round (the tracker rolls it for you). 1–2 Minor collapse. 3–4 Smoke surge. 5 Flash fire. 6 Major collapse.",rows:[
"Minor collapse. Each character makes a Dexterity save (Moderate DC) or takes Moderate bludgeoning damage.",
"Minor collapse. Each character makes a Dexterity save (Moderate DC) or takes Moderate bludgeoning damage.",
"Smoke surge. Disadvantage on every character’s next Hazard save.",
"Smoke surge. Disadvantage on every character’s next Hazard save.",
"Flash fire. Everyone in one area takes Dangerous fire damage (Dexterity save, Moderate DC, for half).",
"Major collapse. The roof is coming down. Go straight to the Escape."]},
quick:[
{l:"Create/Destroy Water, Control Flames or Gust of Wind (advantage on all checks this round)",e:["adv:*"]},
{l:"Wall of Stone or Wall of Ice (+1 success)",s:1,once:1,t:"Seals off the flames"},
{l:"Misty Step or Dimension Door (+1 success)",s:1,once:1,t:"Moves a victim out of reach of the fire"},
{l:"Lesser or Greater Restoration",t:"Remove one level of exhaustion from a victim, or restore a lost Hit Die to them"},
{l:"Fire resistance or immunity",e:["advAll:Hazard"],t:"Advantage on Constitution saves against the Hazard"}],
stages:[{n:"Find and free the victims",skills:[
K("Acrobatics","h","Leap over fallen beams, slide under a falling lintel, cross a burning joist to reach a window ledge.",{bad:["hd:1","text:Moderate fire damage, knocked prone"]}),
K("Athletics","m","Force a jammed door, hold up a beam while others pass, shoulder through a weakened wall or carry an unconscious victim.",{ok:["text:If carrying a victim, you and the victim have advantage on the next Constitution save"],bad:["hd:1"]}),
K("Constitution","h","Breathe in slow controlled draws and push on through heat and smoke to keep searching or to shield a companion.",{ok:["adv:Athletics,Acrobatics","text:Ignore the next Hazard save"],bad:["dis:*","text:Moderate fire damage"]}),
K("Investigation","m","Read the building: where the stairs and load-bearing walls are, where a nursery or sickroom would sit, which beams are still sound. At most 2 successes in total.",{cap:2,ok:["adv:Perception"],bad:["hazNext:1","text:The group is led into a worse area"]}),
K("Medicine","e","Treat burns and smoke inhalation, stabilize a victim for the carry, revive a companion who has been overcome.",{ok:["dc","text:One creature may spend a Hit Die at once to recover hit points"],bad:["dis:*","text:Precious seconds lost"]}),
K("Perception","m","Find a survivor through the smoke, hear a faint cry behind a wall, notice the creak that means a floor is about to go.",{ok:["adv:Acrobatics,Athletics","text:A victim or safe route is found"],bad:["dis:*","text:A false lead"]}),
K("Survival","h","Read how the fire is moving, find the pocket of clean air near the floor, wet a cloth and tie it over faces.",{ok:["adv:Hazard"],bad:["dis:Hazard"]}),
K("Nature","vh","Recall how fire runs through different timbers and thatch, and where a firebreak will hold. Automatic success on a pass, usable once only.",{cap:1,ok:["text:Automatic success. Usable once only"],bad:["text:The attempt costs time and gains nothing"]})]},
{n:"The Escape",side:1,intro:"When the party reaches 6 successes, they have found and freed everyone. Now they have to get out. Each character makes one Acrobatics or Athletics check (Hard DC) as the exit burns around them. Pass: the character and everyone they carry reach the street. Fail: the character gets out but takes Dangerous fire and bludgeoning damage as the building falls. Any victim they carry is dropped in the chaos, and a nearby hero can catch them with a reaction.",skills:[
K("Acrobatics","h","Get out along the burning route."),
K("Athletics","h","Force a way out, carrying anyone you can.")]}],
out:{total:"Everyone is located and carried out before the fire takes the upper floors. The street erupts in cheers, and the survivors will remember this.",
ok:"All victims are saved, but the party pays for it. Each character loses 1d4 Hit Dice, and one victim is scarred or disabled for life, as the DM chooses.",
fail:"The party is driven out with some of the victims. Each character gains a level of exhaustion, and 1d4 victims are lost. The town is grateful for those saved and grieves for those who were not. Failure doesn’t end the story: the fire’s cause is still out there, and the survivors, or the families of the lost, will want to talk.",failFx:["exhAll:1"]}});

C({id:"volcanic-passage",b:"Custom",name:"Volcanic Passage",tags:["survival"],cx:2,scale:"Each round is about an hour of travel, so six rounds cover the crossing (3 miles). Stretch a round to a day for a bigger plateau or shrink it to ten minutes for a dash.",
fl:"Steam hisses from cracks in the black rock. The air shimmers above a plain of cooled lava, and somewhere ahead a geyser coughs, goes quiet, and coughs again. The far ridge is three miles away. Every step you take, the ground is deciding whether to hold.",
setup:"The characters must cross a volcanic plateau: a caldera floor of hardened lava, geyser fields, sulfur vents and half-cooled flows. Ground temperature near the vents reaches 200°F and the crust over old lava tubes is thinner than it looks. There is no way around: the slopes are sheer and the only other route costs days the party doesn’t have. No character gains the benefit of a short or long rest on the plateau.",
notes:["A creature with fire resistance has advantage on the hazard save. A creature immune to fire ignores the heat, though not the fumes.","Wet cloth over the mouth and nose, or a spell like gust of wind or create or destroy water, can earn advantage at your discretion.","Midpoint Tremor: when the party earns its 3rd success, every character makes a Dexterity save (Moderate, DC 15). On a failure, knocked prone and Moderate fire damage from scalding steam. Doesn’t count toward the challenge. A vent that was safe is now spewing and a new crack splits the path.","Harder: start the hazard DC at Moderate for a brutal crossing. Easier: add a fourth failure. Shift skill DCs one level to match the party.","Reward clever ideas: wetting a cloak, wrapping boots in wet hides, or freezing a vent with ray of frost deserves a success or advantage.","A failed challenge never ends the story. The party always reaches the other side, only more battered, with new enemies, or on a longer road."],
onS:{3:"Midpoint Tremor! Every character makes a Dexterity save (Moderate, DC 15). Failure: knocked prone and Moderate fire damage from scalding steam. Doesn’t count toward the challenge. A safe vent is now spewing and a new crack splits the path."},
haz:{n:"Heat and fumes",stat:"Constitution",dc:"e",esc:1,cap:"h",t:"At the start of each round every character makes the save. The DC begins at Easy (10) and rises one level each round to a maximum of Hard (20).",fail:["hd:1"]},
table:{n:"Vent events",rows:[
"Geyser burst. Each character makes a Dexterity save (Moderate, DC 15), taking Dangerous fire damage on a failure, or half on a success.",
"Sulfur fumes. Each character makes a Constitution save (Moderate, DC 15) or is poisoned until the end of the next round.",
"Crust collapse. The character with the lowest passive Perception falls 10 feet and must make an Athletics or Acrobatics check (Hard, DC 20) to climb out, or loses 1 Hit Die and takes Moderate fire damage.",
"Ash cloud. Checks that rely on sight have disadvantage until the end of the next round.",
"Cinder slope. The next stretch counts as difficult terrain, and the next Athletics check has disadvantage.",
"Fire dwellers. 1d4 magma mephits, fire snakes or a salamander rise from a vent and attack. Use level-appropriate creatures and keep the hazard running during the fight."],note:"Rolled automatically on each failure, in addition to any listed failure effect."},
stages:[{skills:[
K("Acrobatics","h","Hop between slabs of cooled basalt, vault steaming fissures, and pick the one safe line across a crust that flexes underfoot.",{bad:["hd:1","text:A boot punches through the crust: Moderate fire damage"]}),
K("Athletics","m","Haul an ally out of a sinking patch, shove aside a fallen boulder, climb a ridge to find a better path, or rope the party across a gap.",{ok:["adv:Acrobatics"],bad:["hd:1"]}),
K("Nature","h","Read the land: the yellow bloom of sulfur around a vent, the color of the rock, the way steam bends. Know which ground is old and solid and which is a thin skin over a lava tube.",{ok:["adv:Hazard"]}),
K("Survival (Step 1)","m","Pick a route, following the cooled flows, wind direction and the tracks of the few animals bold enough to cross here. Opens Step 2.",{base:"Survival",bad:["disAll:Athletics","text:A poor route: all Athletics checks have disadvantage"]}),
K("Survival (Step 2)","m","Time the party’s passage between geyser eruptions, counting the long pauses and shouting when to run.",{base:"Survival",req:"Survival (Step 1)",ok:["adv:Acrobatics"],bad:["dis:Acrobatics"]}),
K("Investigation","m","Study the geysers’ rhythm, sorting real patterns from false pauses, and spot the telltale ridges that mark a hollow lava tube below.",{ok:["adv:Survival,Acrobatics"]}),
K("Perception","e","Notice heat shimmer over a hidden vent, a faint rumble through the soles of your boots, or a gap in the haze that shows a clear line forward. Only a single success.",{cap:1}),
K("Medicine","e","Treat scalds, cool blistered skin with water, and tell the party how to breathe through the fumes.",{ok:["dc","text:The targeted character has advantage on their next Constitution save"]}),
K("Arcana","h","Sense the elemental energy bleeding from the rock and turn it aside, bending the heat away or briefly calming a nearby vent. Absorb elements, protection from energy or gust of wind can stand in for or boost this check.",{ok:["text:Each character gains resistance to fire damage until the end of the next round"],bad:["text:The vent flares: Moderate fire damage to the character"]}),
K("History","vh","Remember an old survey, a dwarven mining road, or a pilgrim’s tale of a safe line across the plateau marked by stone cairns. Only a single success.",{cap:1,ok:["hazdc:-1"]})]}],
out:{total:"The party crosses without a single failure, reading the ground so well that the plateau feels almost gentle. They arrive rested enough to continue and spend no resources. Along the way they find a pocket of obsidian shards, fire opals or another small treasure.",
ok:"The party makes it across, but the crossing leaves its mark. Each character loses a number of Hit Dice equal to the number of failures the party earned, and none benefit from rest while on the plateau. Their boots and gear smell of smoke for days.",
fail:"The party staggers to the far edge scorched and exhausted. Each character suffers one level of exhaustion and one nonmagical item (a waterskin, a bedroll, a pair of boots) is ruined. A group of fire creatures or a lava elemental waits at the exit, or the final stretch collapses, forcing the party to run the challenge again by a longer route.",
okFx:["hdAll:fails"],failFx:["exhAll:1"]}});

C({id:"snowstorm",b:"Custom",name:"Snowstorm",tags:["survival"],cx:2,scale:"One hour per round (a day for a long crossing). The DM may change the scale. Everyone acts once per round, then the hazard resolves at initiative 20.",
fl:"The wind drops to a whisper for a single breath. Then the sky closes like a fist, the horizon vanishes, and the snow comes sideways. Your own footprints fill in behind you before you can turn to look at them.",
setup:"The characters are caught in the open when a blizzard rolls in and must find shelter or reach their destination before the cold takes them apart. No character gains the benefit of a short or long rest in the storm without shelter. Characters with cold resistance have advantage on the hazard save, and those immune to cold skip it.",
notes:["No back-to-back: a character can’t use the same skill on two of their own turns in a row.","Share freely: different characters can use the same skill in the same round, up to the limits listed on each skill.","Fresh approach: a character who wants to repeat a skill they used earlier must describe a different method, and the DC rises one level for that check.","Group check: if too few characters can contribute, call a group check. If at least half succeed, it counts as one success.","Dig In (emergency shelter), once per challenge: one character makes a Survival check (Hard) while others assist with Athletics (Moderate), using their action this round. Success counts as 2 successes and the party skips the next hazard. Failure counts as 1 failure: the roof caves in and everyone makes their next hazard save with disadvantage. Use the buttons above the skills.","Tie it to the campaign: if your winter has a ruler, the storm can be hers. A Nature success might reveal that the snow falls upward in a spiral, or that the wind carries a voice."],
haz:{n:"Biting cold",stat:"Constitution",dc:"m",t:"At initiative 20 each round every character makes the save (Moderate DC).",fail:["hd:1"]},
table:{n:"Storm surprises",rows:[
"A half-frozen traveler stumbles out of the white and begs for help. Aiding them costs a round but earns an ally or a clue.",
"A pack of winter wolves circles at the edge of sight. Combat, or a Survival check (Hard) to slip away.",
"A pack strap snaps. One piece of gear is lost in the drifts.",
"The slope above lets go. Each character makes a Dexterity save (Moderate DC) or takes Dangerous damage, half on a success.",
"The ground is an ice-skinned lake. Athletics or Acrobatics (Moderate) to cross, or someone goes through.",
"Shapes move in the whiteout. Something unnatural is hunting in the storm, such as a ghost, a wraith or an ice mephit."],note:"Rolled automatically on each failed check. Swap the creatures for level-appropriate ones."},
quick:[
{l:"Dig In succeeded (+2 successes, skip next hazard)",s:2,once:1,t:"Skip the next hazard. This is the once-per-challenge shelter."},
{l:"Dig In failed (+1 failure)",f:1,once:1,e:["dis:Hazard"],t:"The roof caves in: everyone has disadvantage on the next hazard save."},
{l:"Resist Energy (cold)",e:["adv:Hazard"],t:"Target has advantage on hazard saves while the spell lasts"},
{l:"Gust of Wind",e:["adv:Perception"],t:"Clears a lane through the snow"},
{l:"Produce Flame or Light",e:["adv:Survival"],t:"A visible beacon"},
{l:"Leomund’s Tiny Hut (+2 successes)",s:2,once:1,t:"The party skips the next hazard and can take a short rest inside"},
{l:"Control Weather (ends as Total Success)",done:"total",once:1}],
stages:[{skills:[
K("Athletics","m","Break trail through waist-deep drifts, haul a sled over a ridge, or carry a flagging ally across an ice-glazed slope. If the check fails by 5 or more, lose 2 Hit Dice.",{ok:["text:Choose one ally: they have advantage on their next hazard save"],bad:["hd:1"]}),
K("Constitution","h","Set a punishing pace, breathe through the scarf, and refuse to stop moving. Your stubbornness steadies the group.",{ok:["text:The character automatically succeeds on their next hazard save"],bad:["hd:1"]}),
K("Medicine","e","Thaw numb fingers, wrap frostnipped toes, and force warm broth past chattering teeth. Each use raises this skill’s DC one level. Usable a maximum of three times.",{max:3,ok:["dc","text:The treated ally has advantage on their next Constitution saving throw"],bad:["dc"]}),
K("Nature","h","Read the layered grey of the clouds, the way the snow bunches on the north side of trunks, and the silence of the birds. Call the next lull before it arrives.",{ok:["adv:Hazard"]}),
K("Perception","m","Spot a wind-scoured cairn, the dark line of a tree wall, a thread of chimney smoke, or the amber blink of a distant window. At most 2 successes during the challenge.",{cap:2,ok:["adv:Survival"],bad:["dis:Survival","text:The party follows a false landmark"]}),
K("Survival","m","Keep the wind on your left cheek, follow the slope of the ground, and steer the party around ice-skinned ponds, hidden crevasses and wind tunnels.",{bad:["text:The party drifts off line and loses time"]})]}],
out:{total:"The party finds shelter, such as a waystation, a hamlet or a dry cave, and arrives ahead of the worst of the storm. A fire is already half-laid. The party can take a short rest at once.",
ok:"The party reaches shelter, but the storm has cost them. Every character loses 1 Hit Die and can’t short rest until the storm clears.",
fail:"The party staggers into shelter by luck, not skill. Every character gains a level of exhaustion, and the shelter is already occupied: winter wolves, a yeti, a frost giant hunting party or a white dragon wyrmling. The story keeps moving, but the cost is real.",
okFx:["hdAll:1"],failFx:["exhAll:1"]}});

/* ---------- Full flavor text restored for your own challenges ---------- */
function setFl(id,list){
  const c=CH.find(x=>x.id===id);if(!c)throw new Error("no challenge "+id);
  list.forEach(([si,name,t])=>{const k=c.stages[si].skills.find(x=>x.n===name);if(!k)throw new Error("no skill "+id+" "+name);k.d=t;});
}
function setStage(id,si,fl,intro){const s=CH.find(x=>x.id===id).stages[si];if(fl)s.fl=fl;if(intro!==undefined)s.intro=intro;}

setFl("veiled-cave",[
[0,"Survival","The character reads the land: game trails that bend around one slope, a spring seeping from a place with no source, the way wind funnels through the valley. They steer the party toward the ridge the animals avoid."],
[0,"Investigation","The character compares the map fragment, a rubbing, or the stories they were told against the real ridgelines, matching the notched peak on the sketch to the one on the horizon."],
[0,"Perception","The character spots an old waymarker: a cairn of three stacked stones, a rusted iron peg driven into the rock, or a faded carving shaped like a closed eye."],
[0,"History","The character remembers who sealed the cave. The order that built it (the Ashen Wardens, or whoever suits your campaign) sited its vaults where three ridges meet and marked them with a closed-eye sigil. They also left a rite for opening such places."],
[0,"Athletics","The character scrambles up a scree slope or rocky spur to see the whole valley at once, and spots where three ridges meet at a hidden cleft."],
[1,"Arcana","The character feels the faint prickle of an illusion woven over an abjuration. This is a ward, and a deliberate one. It is not a wall but a push on the mind."],
[1,"Perception","The character notices a draft blowing the wrong way, a faint whistle from solid rock, or a line where bats and swallows veer off in mid-flight."],
[1,"Nature","Thick ferns and damp-loving lichen grow in a ring on a dry, sun-baked slope. Guano streaks the rock beneath a bare patch. Something below the surface is breathing cool, wet air."],
[1,"Investigation","The character watches how shadows fall. A boulder’s shadow bends around a corner that is not there, and the line of sunlight on the rock face breaks where an opening should be. Along one edge that should be weathered smooth, they find fresh chisel marks."],
[1,"Insight","The character notices a companion’s gaze sliding off the same patch of rock again and again. The Veil works on attention itself. They tell the party to watch each other’s eyes and call out when someone looks away."],
[2,"Arcana","The character pulls at the ward’s threads and unpicks the pattern a strand at a time."],
[2,"Religion","The character recognizes the closed-eye sigil carved at the base of the entrance and recites the old blessing the keepers used to pass their own wards."],
[2,"Investigation","Three carved rings are set into the rock around the opening, each with an eye. The character works out that they must be turned until all three eyes face the same way, toward the light."],
[2,"Sleight of Hand","The character eases the stone rings around with careful hands, coaxing the old mechanism without setting off the wards. Requires thieves’ tools."],
[2,"Performance","The Veil hums at a low note. The character matches it with a hum, a tap on the stone or a chant, so the ward hears a friend instead of a thief."]]);
setStage("veiled-cave",0,"The old directions run out in a valley where every ridge looks like the last. Grey slopes, dark pines, a cold wind that never settles. If the cave is here, it is hiding well.","Goal: work out which ridge the cave sits behind. Hazard save: Wisdom, Easy DC.");
setStage("veiled-cave",1,"Everything agrees: the map, the cairn, the three ridges. And still the rock in front of you is only rock. A cold breath brushes the back of your neck, and for a heartbeat you swear the stone shifted.","Goal: the party is in the right place but cannot see the cave. Learn what the Veil is doing and where the entrance really is. Hazard save: Wisdom, Moderate DC.");
setStage("veiled-cave",2,"The ward is plain to you now: a pattern of pale lines rippling through the stone like light on water. Behind it is an opening tall enough to walk through, and the sense of something very old that does not want to be disturbed.","Goal: the entrance is found but sealed behind the ward. Open it. Hazard save: Wisdom, Hard DC.");

C({id:"last-rites",b:"Custom",name:"Last Rites",tags:["magic","survival"],cx:2,scale:"Each round is about 20 minutes. The whole disposal takes hours.",
fl:"The beast has stopped moving, but the air around it hasn’t. A faint glow seeps from its hide and beads on the stone like sweat. Whatever you do, you have to do it here, and before the glow wins.",
setup:"A magical creature is dying or has just died, and the party deals with its remains right where it lies. Nothing is moved. The body holds a charge of raw magic, and if it is left as it is, that charge pools into a zone of concentrated magic. The party must contain the leak, unravel the stored energy and remove the remains, so nothing is left behind. Stage 1 begins as the creature dies or right after.",
notes:["Advance to the next stage after 2 successes in the current one, or when the party chooses to move on.","Let failures show up in the fiction: a ward flaring, the body slumping, a spade striking something that hums.","Harder: raise every DC one tier, or raise the Complexity to 3 (8 successes). Easier: allow 4 failures.","The strip’s Failures stepper lets you change the number of failures allowed."],
haz:{n:"Seeping magic",stat:"Constitution",dc:"m",t:"Raw magic seeps from the remains every round and tugs at everyone nearby.",pass:"No effect.",fail:["hd:1"]},

(function(){
'use strict';
/* =====================================================================
   SKILL CHALLENGE TRACKER: shared shell
   Same shell as the Complex Trap Tracker. A challenge is a module passed to
   core.register({...}) with:
     id, name, eyebrow, tagline, pal      header text and colour palette
     tierLabel, tiers:[{id,label}]       the DC shift selector
     refLabel                            label of the text tab
     roster:'chars'                      the party array that is shared between challenges
     fresh()                             returns a new state object (it must hold .tier)
     bind(state)                         called before every render/action with this challenge's state
     actions{name:(id,m,el)=>}           handlers for data-act="name" (use core.commit / core.quick)
     fields{name:(id,value,el)=>}        handlers for data-field="name" change events
     addChar(name,init,hd)               used by the #addForm party form
     strip()  run()  ref()               sticky strip html, Run tab, Text tab
   The shell handles: picker, tier, tabs, undo, saving and the shared party.
   ===================================================================== */
const KEY='skill-challenges-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=[];
let root={v:1,sel:null,tab:'run',data:{}};
const hist=[];
let headFor=null;
const cur=()=>items.find(t=>t.id===root.sel)||items[0];
function layout(o){
  const g=k=>o[k]||'';
  return '<div class="run"><div class="run-main">'+g('pend')+g('now')+g('order')+g('cm')+g('out')+'</div><aside class="run-aside">'+g('party')+g('mods')+g('glance')+g('log')+g('reset')+'</aside></div>';
}
const getRoster=(t,S)=>Array.isArray(S.chars)?S.chars.map(c=>({name:c.name,init:c.init===undefined||c.init===null?'':c.init,hd:c.hd,hdMax:c.hdMax,exh:c.exh})):null;
function setRoster(t,S,list){
  const arr=S.chars;if(!Array.isArray(arr))return;
  const pool=arr.slice(),out=[];
  t.bind(S);
  list.forEach(r=>{
    const i=pool.findIndex(c=>c.name===r.name);
    let c;
    if(i>=0){c=pool.splice(i,1)[0];c.init=r.init;}
    else{t.addChar(r.name,r.init,r.hdMax);c=arr.pop();}
    c.hd=r.hd;c.hdMax=r.hdMax;c.exh=r.exh;out.push(c);
  });

function save(){try{localStorage.setItem(KEY,JSON.stringify(root));}catch(e){}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const r=JSON.parse(raw);if(r&&r.v===1&&r.data)root=Object.assign(root,r);}}catch(e){}}
function state(t){
  if(!root.data[t.id])root.data[t.id]=t.fresh();
  const S=root.data[t.id];S.tab=root.tab;return S;
}
function commit(fn){hist.push(JSON.stringify(root));if(hist.length>60)hist.shift();fn();save();render();}
function quick(fn){fn();save();render();}
const core={register:t=>{items.push(t);},commit,quick,save,canUndo:()=>hist.length>0,start};

function switchTo(t){
  commit(()=>{
    if(Array.isArray(root.roster)){const S=state(t);setRoster(t,S,root.roster);}
    root.sel=t.id;
  });
}
const own={
  trap:id=>{const t=items.find(x=>x.id===id);if(t)switchTo(t);},
  tier:id=>quick(()=>{state(cur()).tier=+id;}),
  tab:id=>quick(()=>{root.tab=id;}),
  undo:()=>{const h=hist.pop();if(!h)return;root=JSON.parse(h);save();render();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(own[a]){own[a](b.dataset.id);return;}
  const t=cur(),f=t.actions[a];if(f){t.bind(state(t));f(b.dataset.id,b.dataset.m,b);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el&&el.id==='trapSel'){own.trap(el.value);return;}
  const t=cur(),f=el.dataset&&el.dataset.field;
  if(f&&t.fields&&t.fields[f]){t.bind(state(t));t.fields[f](el.dataset.id,el.value,el);}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm')return;
  e.preventDefault();
  const t=cur();if(!t.addChar)return;
  const n=$('#newName').value.trim(),ie=$('#newInit'),i=ie?ie.value:'',he=$('#newHd'),hd=he?he.value:'';if(!n)return;
  t.bind(state(t));
  commit(()=>{t.addChar(n,i,hd);});
  const nn=$('#newName');if(nn)nn.focus();
});

function renderPicker(){
  const key=t=>t.name.replace(/^The /,'');
  const list=items.slice().sort((a,b)=>key(a).localeCompare(key(b)));
  $('#picker').innerHTML='<label class="lbl" for="trapSel">Challenge</label><select id="trapSel" class="trapsel" aria-label="Choose a skill challenge">'+
    list.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===cur().id?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>';
}
function renderHead(t){
  if(headFor===t.id)return;headFor=t.id;
  $('#head').innerHTML='<p class="eyebrow">'+esc(t.eyebrow)+'</p><h1>'+esc(t.name)+'</h1><p class="muted" style="margin-top:4px;max-width:78ch">'+esc(t.tagline)+'</p>';
}
function renderControls(t,S){
  const tiers=t.tiers&&t.tiers.length?'<div class="ctl"><span class="lbl">'+esc(t.tierLabel||'Tier')+'</span><div class="seg" role="group" aria-label="'+esc(t.tierLabel||'Tier')+'">'+
    t.tiers.map(x=>'<button data-act="tier" data-id="'+x.id+'" aria-pressed="'+(S.tier===x.id)+'">'+esc(x.label)+'</button>').join('')+'</div></div>':'';
  $('#controls').innerHTML='<div class="controls">'+tiers+
    '<div class="tabs" role="group" aria-label="View"><button data-act="tab" data-id="run" aria-pressed="'+(root.tab==='run')+'">Run</button><button data-act="tab" data-id="ref" aria-pressed="'+(root.tab==='ref')+'">'+esc(t.refLabel||'Text')+'</button></div></div>';
}
function render(){
  const t=cur();root.sel=t.id;
  const S=state(t);t.bind(S);
  dmApply(t,S);
  document.body.dataset.trap=t.pal||'';
  const ae=document.activeElement;let sel=null;
  if(ae&&ae.dataset&&(ae.dataset.act||ae.dataset.field)){
    const d=ae.dataset;
    sel=(d.field?'[data-field="'+d.field+'"]':'[data-act="'+d.act+'"]')+(d.id!==undefined?'[data-id="'+d.id+'"]':'');
  }
  const y=window.scrollY;
  renderPicker();renderHead(t);renderControls(t,S);
  $('#strip').innerHTML=root.tab==='run'?t.strip():'';
  root.roster=getRoster(t,S);
  let rv=root.tab==='ref'?t.ref():t.run();if(rv&&typeof rv==='object')rv=layout(rv);
  $('#view').innerHTML=rv;
  window.scrollTo(0,y);
  if(sel){const n=document.querySelector(sel);if(n&&n.focus)n.focus({preventScroll:true});}
  if(t.after)t.after();
  dmAgenda();
  dmBadge();
}
/* ---------- DM SCREEN BRIDGE: the party (name + initiative) comes from the Combat tab ---------- */
let dmPcs=null;
window.addEventListener('message',e=>{
  const m=e.data;if(!m||m.dm!=='party'||!Array.isArray(m.pcs))return;
  dmPcs=m.pcs;render();
});
function dmApply(t,S){
  if(!dmPcs||window.parent===window)return;
  const arr=()=>S.chars||S.party;
  if(!Array.isArray(arr())||!t.addChar)return;
  let ch=false;
  if(S.example&&dmPcs.length){arr().length=0;S.example=false;ch=true;}
  dmPcs.forEach(h=>{
    const iv=(h.init===null||h.init===undefined)?'':h.init;
    let c=arr().find(x=>x.hid===h.id)||arr().find(x=>!x.hid&&x.name===h.name);
    if(!c){const n0=arr().length;t.addChar(h.name,iv,'');if(arr().length>n0){arr()[arr().length-1].hid=h.id;ch=true;}}
    else{if(!c.hid){c.hid=h.id;ch=true;}if(c.name!==h.name){c.name=h.name;ch=true;}if(c.init!==iv){c.init=iv;ch=true;}}
  });
  const ids=new Set(dmPcs.map(h=>h.id)),a=arr(),keep=a.filter(x=>!x.hid||ids.has(x.hid));
  if(keep.length!==a.length){a.length=0;keep.forEach(x=>a.push(x));ch=true;}
  if(ch)save();
}
function dmBadge(){
  try{
    if(window.parent===window||!dmPcs)return;
    document.querySelectorAll('.dm-badge').forEach(n=>n.remove());
    const h=document.querySelector('#view .party-head h2, #view .party-head h3');
    if(h){const s=document.createElement('span');s.className='dm-badge muted';s.style.cssText='font:500 12px var(--font-body);margin-left:8px';s.textContent='synced from Combat';h.appendChild(s);}
  }catch(e){}
}
function dmAgenda(){}
function start(){load();if(!root.sel||!items.some(x=>x.id===root.sel))root.sel=(items.find(x=>x.id==='blizzard')||items[0]).id;render();}
window.core=core;
if(window.parent!==window){try{window.parent.postMessage({dm:'hello'},'*');}catch(e){}}
})();

(function(){
'use strict';
/* =====================================================================
   SKILL CHALLENGE MODULES: one generic module per challenge, all on the shared shell
   ===================================================================== */
const commit=core.commit,quick=core.quick;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const rnd=n=>1+Math.floor(Math.random()*n);
const REQ=[4,6,8];

const PALX={blizzard:'fw',snowstorm:'fw','frost-raiders':'fw',rapids:'fw',flood:'fw',storm:'fw'};
const PALT={social:'owz',survival:'gwg',magic:'cmz',chase:'scd',investigation:'mfg',combat:'pob',trap:'pob',stealth:'ptp'};
const palOf=c=>PALX[c.id]||PALT[c.tags[0]]||'';
const CUSTOM_SRC={"veiled-cave":"NvcGys4YmzGJKj3CmC8ofm","moon-gate":"BpwkcigLT8HmNCj3mxcGJg","burning-building":"6Sc3cuYqsHmfBt1jNqGQMF","volcanic-passage":"K5LUntFNV3K8W6SVu7HeDB","snowstorm":"3dHGSwZQDJwo5pDdSP5eg6"};
let S,Cc; /* the bound state and challenge */

/* ---------- Rules engine ---------- */
const tierIdx=(code,extra)=>Math.max(0,Math.min(5,TK[code]+extra));
function skillDC(r,key,sk){
  if(sk.af)return null;
  const off=(r.dcUp[key]||0)+r.dcAll+(r.tier||0);
  if(sk.dcN)return{i:-1,name:"DC",n:sk.dcN+5*off,mod:off};
  const i=tierIdx(sk.dc,off);
  return{i,name:TIERS[i][0],n:TIERS[i][1],mod:off};
}
function hazDC(r,h){
  if(h.dcNum)return{i:-1,name:"DC",n:h.dcNum};
  const adj=(r.tier||0)+(r.hazAdj||0)+(r.hazNext||0);
  let base;
  if(h.stageDc)base=TK[h.stageDc[Math.min(r.stage,h.stageDc.length-1)]];
  else{let off=0;if(h.esc){const ev=h.esc===true?1:h.esc;off=Math.max(0,Math.floor((r.round-(h.from||1))/ev));}
    base=TK[h.dc]+off;if(h.cap)base=Math.min(base,TK[h.cap]);}
  const i=Math.max(0,Math.min(5,base+adj));return{i,name:TIERS[i][0],n:TIERS[i][1]};
}
const dcLabel=d=>d.name==="DC"?"DC "+d.n:d.name+" · "+d.n;
const baseOf=sk=>sk.base||sk.n;
function modsFor(r,sk){
  const b=baseOf(sk);let adv=false,dis=false;

const sent=x=>/[.!?)]$/.test(x)?x:x+".";

function list(v){return v==="*"?"*":v.split(",");}

  const[t,v]=parse(e);

  const chk=v==="Hazard"?"hazard saving throw":nm+" check";
  const NOHD="(1 level of exhaustion instead if they have none left)";
  switch(t){
    case"adv":return v==="*"?"Advantage on the next check, any skill.":"Advantage on the next "+chk+".";
    case"dis":return v==="*"?"Disadvantage on the next check, any skill.":"Disadvantage on the next "+chk+".";
    case"advAll":return v==="Hazard"?"Advantage on every hazard saving throw for the rest of the challenge.":"Advantage on every "+nm+" check for the rest of the challenge.";
    case"disAll":return v==="Hazard"?"Disadvantage on every hazard saving throw for the rest of the challenge.":"Disadvantage on every "+nm+" check for the rest of the challenge.";
    case"hd":return"That character loses "+v+" Hit Die "+NOHD+".";

    case"exh":return"That character gains "+v+" level"+(+v>1?"s":"")+" of exhaustion.";

function effLabel(e){

  switch(t){
    case"adv":return v==="Hazard"?"Advantage on the next hazard saving throw":"Advantage on next "+nm+" check";
    case"dis":return v==="Hazard"?"Disadvantage on the next hazard saving throw":"Disadvantage on next "+nm+" check";
    case"advAll":return v==="Hazard"?"Advantage on all hazard saving throws from now":"Advantage on all "+nm+" checks from now";
    case"disAll":return v==="Hazard"?"Disadvantage on all hazard saving throws from now":"Disadvantage on all "+nm+" checks from now";
    case"hd":return"Lose "+v+" Hit Die";
    case"hdAll":return v==="all"?"Each character loses all Hit Dice":v==="fails"?"Each character loses Hit Dice equal to failures":"Each character loses "+v+" Hit Die";
    case"exh":return"Gain "+v+" exhaustion";
    case"exhAll":return"Each character gains "+v+" exhaustion";

function outLines(c,r,si,sk){

  let sb,fb;

    fb="Counts as 1 failure (of "+r.lim+" allowed).";}

  const ok=sk.af?"":'<p class="o ok"><b>Success</b> '+esc([sb].concat(eo.length?eo:["No other effect."],lim).join(" "))+"</p>";
  const bad='<p class="o bad"><b>Failure</b> '+esc([sk.af?"Automatic failure.":"",fb].concat(eb.length?eb:(sk.af?[]:["No other effect."])).filter(Boolean).join(" "))+"</p>";

  if(q.f)p.push("Counts as "+q.f+" failure"+(q.f>1?"s":"")+".");

  if(q.st!=null)p.push("Use in Stage "+(q.st+1)+".");

}
function hazFailText(h){

}
function hazDcInfo(h){

function newRef(c){return{need:reqOf(c),lim:3,dcUp:{},dcAll:0,tier:0,stage:0,round:1,hazAdj:0,hazNext:0};}

/* ---------- Party and effects ---------- */
const get=id=>S.chars.find(c=>c.id===id);

  if(over>0)p.exh=Math.min(6,p.exh+over);

    case"advAll":case"disAll":r.mods.push({kind:t==="advAll"?"adv":"dis",skills:list(v),persist:true,src:ctx.src});out.push(effLabel(e));break;
    case"hd":{const ts=targets(who);if(!ts.length)out.push(effLabel(e)+" (nobody selected)");else ts.forEach(p=>out.push(hdLose(p,+v)));break;}
    case"hdAll":{S.chars.forEach(p=>{if(v==="all"){p.hd=0}else{const n=v==="fails"?r.f:+v;if(n>0)hdLose(p,n);}});out.push(effLabel(e));break;}
    case"exh":{const ts=targets(who);ts.forEach(p=>p.exh=Math.min(6,p.exh+ +v));out.push(effLabel(e)+(ts.length===1?" ("+ts[0].name+")":""));break;}
    case"exhAll":S.chars.forEach(p=>p.exh=Math.min(6,p.exh+ +v));out.push(effLabel(e));break;
    case"lock":if(key)r.lock[key]=1;out.push(effLabel(e));break;
    case"dc":if(key)r.dcUp[key]=(r.dcUp[key]||0)+1;out.push(effLabel(e));break;
    case"dcAll":r.dcAll++;out.push(effLabel(e));break;
    case"time":r.timeAdd+=+v;out.push(effLabel(e));break;
    case"succ":break;
    case"hazdc":r.hazAdj=(r.hazAdj||0)+ +v;out.push(effLabel(e));break;
    case"hazNext":r.hazNext=(r.hazNext||0)+ +v;out.push(effLabel(e));break;
    default:out.push(v);
  }
}
const whoName=who=>{if(who==="party")return"Group";const p=get(who);return p?p.name:"Group";};
function L(text,ok,subs){S.log.unshift({rd:S.round,t:text,ok:ok===undefined?null:ok,subs:subs||[]});if(S.log.length>200)S.log.pop();}

function rollEnc(t){
  t=t||Cc.table;if(!t)return;const d=rnd(6);
  const tx=t.rows[d-1];S.enc.unshift({n:t.n,d,t:tx,rd:S.round});L(t.n+" rolled (d6 "+d+")",null,[tx]);
}
function advStage(){
  const si=S.stage,stg=Cc.stages[si];
  if(stg.adv&&si<Cc.stages.length-1){const ss=S.st[si];
    if((stg.adv.s&&ss.s>=stg.adv.s)||(stg.adv.f&&ss.f>=stg.adv.f)){S.stage++;L("Advanced to "+(Cc.stages[S.stage].n||"next stage"),null);}}
}
function triggers(os,of){
  const c=Cc;
  Object.keys(c.onS||{}).forEach(k=>{if(os<+k&&S.s>=+k)L("Success "+k+" reached",null,[c.onS[k]]);});
  Object.keys(c.onF||{}).forEach(k=>{if(of<+k&&S.f>=+k){const o=c.onF[k];const subs=[o.t];
    (o.e||[]).forEach(e=>applyEff(e,{who:"party",out:subs,src:"Failure "+k}));L("Failure "+k+" reached",false,subs);}});
}
function finish(){
  if(S.done)return;
  if(S.s>=S.need){S.done=S.f===0?"total":"ok";L(S.f===0?"Total success":"Success",true);}
  else if(S.f>=S.lim){S.done="fail";L("Failure",false);}
}

  const w=S.who||"turn";

  if(w==="party")return"party";

}
function record(key,ok){
  const c=Cc,r=S;
  const[si,ki]=key.split(":").map(Number);const stg=c.stages[si];const sk=stg.skills[ki];
  if(r.done&&!stg.side)return;
  const os=r.s,of=r.f;
  const who=whoId();const subs=[];
  const consumed=r.mods.filter(m=>!m.persist&&(m.skills==="*"||m.skills.includes(baseOf(sk))));
  r.mods=r.mods.filter(m=>m.persist||!(m.skills==="*"||m.skills.includes(baseOf(sk))));
  if(consumed.length)subs.push("Used "+consumed.map(m=>(m.kind==="adv"?"advantage":"disadvantage")+(m.src?" from "+m.src:"")).join(", "));
  const effs=(ok?sk.ok:sk.bad)||[];
  const stat=r.stats[key]=r.stats[key]||{s:0,f:0};
  let gain=1;
  const sc=effs.find(e=>e.startsWith("succ:"));if(sc&&ok)gain=+sc.slice(5);
  const counts=!(ok&&sk.ns);
  if(ok){stat.s++;if(counts){if(!stg.side)r.s+=gain;r.st[si].s+=gain;}else subs.push("No success counted");}
  else{stat.f++;if(!stg.side)r.f++;r.st[si].f++;}
  if(ok&&sk.cap&&stat.s>=sk.cap){r.lock[key]=1;subs.push("Used up: this skill can’t gain more successes");}
  const maxU=sk.max||(sk.once?1:0);
  if(maxU&&stat.s+stat.f>=maxU){r.lock[key]=1;subs.push("Used up: "+(maxU===1?"one attempt only":maxU+" attempts maximum"));}
  effs.forEach(e=>applyEff(e,{key,who,out:subs,src:sk.n}));
  L(whoName(who)+": "+sk.n+" "+(ok?"success":"failure")+(gain>1?" (×"+gain+")":""),ok,subs);
  if(!ok&&c.table&&!stg.side)rollEnc();
  if(!stg.side){if(si===r.stage)advStage();triggers(os,of);finish();}
}
function doQuick(i){
  const c=Cc,r=S,q=c.quick[i];if(r.done)return;
  if(q.once&&r.qUsed[i])return;
  const os=r.s,of=r.f;const subs=[];
  const si=q.st!=null?q.st:r.stage;
  if(q.s){r.s+=q.s;r.st[si].s+=q.s;}
  if(q.f){r.f+=q.f;r.st[si].f+=q.f;}
  if(q.stage!=null&&r.stage<q.stage)r.stage=q.stage;
  (q.e||[]).forEach(e=>applyEff(e,{who:"party",out:subs,src:q.l}));
  if(q.t)subs.push(q.t);
  if(q.once)r.qUsed[i]=1;
  L(q.l,q.s?true:q.f?false:null,subs);
  if(q.f&&c.table)rollEnc();
  if(q.done){r.done=q.done;L(q.done==="total"?"Total success":"Success",true);}
  else{if(si===r.stage)advStage();triggers(os,of);finish();}
}
function applyOutcome(){

  r.applied=true;

}

  h.fail.forEach(e=>applyEff(e,{who:id,out:subs,src:h.n}));

function newRound(){

  const c=Cc;
  L("Round "+S.round+" begins"+(c.haz&&!c.haz.limit&&!c.haz.nosave?". "+c.haz.n+" at initiative 20":""),null);

/* ---------- Turn order ---------- */
const hazStep=()=>{const h=Cc.haz;return h&&!h.limit&&!h.nosave;};
function buildOrder(){
  const cs=S.chars.map((c,i)=>({c,i})).sort((a,b)=>(num(b.c.init)-num(a.c.init))||(a.i-b.i));
  const out=[];let placed=!hazStep();
  for(const{c}of cs){
    if(!placed&&num(c.init)<20){out.push({k:"haz",haz:true});placed=true;}
    out.push({k:"c:"+c.id,id:c.id});
  }
  if(!placed)out.push({k:"haz",haz:true});
  return out;
}
const skipStep=s=>s.haz&&(S.done||(Cc.haz.from&&S.round<Cc.haz.from));
function stepLabel(s){if(s.haz)return Cc.haz.n;const c=get(s.id);return c?c.name:"?";}
function nextStep(){
  commit(()=>{
    const order=buildOrder();
    if(S.round===0){S.round=1;newRound();}
    else if(!order.length){S.round++;S.key=null;newRound();return;}
    let idx=S.round>0&&S.key?order.findIndex(s=>s.k===S.key):-1;
    for(let g=0;g<order.length+2;g++){
      idx++;
      if(idx>=order.length){idx=0;S.round++;newRound();}
      if(order[idx]&&!skipStep(order[idx])){S.key=order[idx].k;return;}
    }
    S.key=null;
  });
}

  const c=Cc,r=S;
  let h='<section class="card"><h3 style="margin-bottom:6px">Clock &amp; hazard</h3><p class="muted small">'+esc(c.scale)+"</p>"+(r.round?'<p style="margin-top:6px"><b class="mono">Round '+r.round+"</b></p>":"");
  if(c.phases){const p=c.phases.filter(x=>x.from<=Math.max(1,r.round)).pop();if(p)h+='<div class="haz"><b>Now: '+esc(p.n)+"</b><p>"+esc(p.t)+"</p></div>";}
  if(c.haz){
    const hz=c.haz;
    if(hz.limit){const lim=hz.limit+r.timeAdd;const left=lim-r.round;
      h+='<div class="haz"><b>'+esc(hz.n)+"</b><p>"+esc(hz.t)+'</p><div class="meter" style="grid-template-columns:repeat('+Math.max(lim,1)+',1fr)">'+Array.from({length:Math.max(lim,1)},(_,i)=>'<span class="cell'+(i<r.round?" on":"")+'"></span>').join("")+"</div>"+
        '<p class="'+(left<0?"crit-t":"")+'"><b class="mono">'+Math.max(0,left)+"</b> rounds until full"+(left<0?" · the room is full":"")+"</p></div>";}
    else if(hz.nosave)h+='<div class="haz"><b>'+esc(hz.n)+"</b><p>"+esc(hz.t)+"</p></div>";
    else{const d=hazDC(r,hz);
      h+='<div class="haz"><b>Hazard: '+esc(hz.n)+'</b><p><span class="dc">'+esc(hz.stat)+" save · "+esc(dcLabel(d))+"</span> at initiative 20 each round."+(hz.from&&r.round<hz.from?" <b>No save yet: saves begin round "+hz.from+".</b>":"")+"</p><p>"+esc(hz.t)+"</p>"+
        (hz.fail&&hz.fail.length?'<p class="o ok"><b>Save succeeds</b> '+esc(hz.pass||"No effect.")+'</p><p class="o bad"><b>Save fails</b> '+esc(hazFailText(hz))+"</p>":"")+"</div>";}
  }
  return h+"</section>";
}
function logCard(){
  const r=S;
  return'<section class="card"><div class="party-head"><h3>Rolls &amp; log</h3>'+(r.log.length?'<button class="btn sm" data-act="clearLog">Clear</button>':"")+"</div>"+
    (r.log.length?'<ul class="log">'+r.log.slice(0,60).map(l=>'<li><span class="r">R'+l.rd+'</span><span class="'+(l.ok===true?"ok-t":l.ok===false?"crit-t":"")+'">'+esc(l.t)+(l.subs.length?'<span class="subs">'+l.subs.map(s=>"<i>"+esc(s)+"</i>").join("")+"</span>":"")+"</span></li>").join("")+"</ul>":'<p class="muted" style="margin-top:6px">Checks, effects and rounds appear here as you play.</p>')+
    '<label class="lbl" for="notes" style="display:block;margin-top:10px">DM notes</label><textarea id="notes" class="ta" rows="3" data-field="notes" placeholder="Rewards, NPC moods, what happens on failure…">'+esc(r.notes||"")+"</textarea></section>";
}
let sure=false,sureT=0;
function doReset(){
  if(!sure){sure=true;clearTimeout(sureT);sureT=setTimeout(()=>{sure=false;quick(()=>{});},4000);quick(()=>{});return;}
  sure=false;clearTimeout(sureT);
  commit(()=>{
    const keep=S.chars,tier=S.tier,nid=S.nid,f=freshFor(Cc);
    Object.keys(S).forEach(k=>{if(k!=="tab")delete S[k];});
    Object.assign(S,f,{tier,chars:keep,nid});
  });
}
const resetBtn=()=>'<p><button type="button" class="btn sm" data-act="reset">'+(sure?"Tap again to reset":"Reset challenge")+"</button></p>";
function viewRun(){
  return{pend:pendCard(),now:nowCard(),order:orderCard(buildOrder()),cm:cmCard(),out:outCard(),party:partyCard(),mods:modsCard(),glance:clockCard(),log:logCard(),reset:resetBtn()};
}
function strip(){
  const r=S,c=Cc,start=r.round===0;
  const stat=(lbl,v,cnt,max,cls,kind)=>'<div class="stat"><span class="lbl">'+lbl+'</span><div class="row"><button class="step" data-act="'+kind+'" data-m="-1" aria-label="Fewer '+lbl.toLowerCase()+'">−</button><b>'+v+'</b><button class="step" data-act="'+kind+'" data-m="1" aria-label="More '+lbl.toLowerCase()+'">+</button></div><div class="pips">'+pips(max,cnt,cls)+"</div></div>";
  return'<div class="strip"><div class="strip-in">'+
   '<div class="stat"><span class="lbl">Round</span><b>'+(r.round||"–")+"</b></div>"+
   stat("Successes",r.s+"/"+r.need,r.s,r.need,"ok","need")+
   stat("Failures",r.f+"/"+r.lim,r.f,r.lim,"bad","lim")+
   (c.stages.length>1?'<div class="stat"><span class="lbl">Stage</span><b>'+(stageNow()+1)+"/"+c.stages.length+"</b></div>":"")+
   (r.done?'<div class="stat"><span class="lbl">Result</span><b>'+(r.done==="total"?"Total success":r.done==="ok"?"Success":"Failure")+"</b></div>":"")+
   '<div class="acts"><button class="btn" data-act="undo"'+(core.canUndo()?"":" disabled")+'>Undo</button><button class="btn primary" data-act="next">'+(start?"Start":"Next")+"</button></div></div></div>";
}

/* ---------- Text tab ---------- */
function srcHtml(c){
  if(c.id==="last-rites")return"Created for your campaign in this chat.";
  if(CUSTOM_SRC[c.id])return"Your original artifact, <a href=\"https://claude.ai/artifact/"+CUSTOM_SRC[c.id]+"\" target=\"_blank\" rel=\"noopener\">open it</a>. This page keeps all the rules and trims some of the surrounding prose.";
  const p={"1":"Challenge Accepted - Skill Challenges.pdf","2":"Challenge Accepted 2.pdf"};
  const l=c.b.split(" + ").map(x=>p[x]).filter(Boolean).map(x=>"<b>"+esc(x)+"</b>");
  return l.join(" and ")+" in your D&amp;D Challenges project. This page condenses the book’s flavor text and sidebars but keeps every rule.";
}
function viewRef(){
  const c=Cc,r0=newRef(c);
  let h='<article class="ref">';
  h+="<section>"+(c.fl?'<p class="flavor">'+esc(c.fl)+"</p>":"")+"<p>"+esc(c.setup)+"</p></section>";
  h+='<section><h3>At a glance</h3><dl class="glance"><div><dt>Complexity</dt><dd>'+c.cx+": "+reqOf(c)+" successes before 3 failures.</dd></div><div><dt>Pace</dt><dd>"+esc(c.scale)+"</dd></div><div><dt>Stages</dt><dd>"+c.stages.length+" · "+c.stages.reduce((a,s)=>a+s.skills.length,0)+" skills</dd></div></dl></section>";
  c.stages.forEach((stg,si)=>{
    h+="<section><h3>"+(stg.n?esc(stg.n):"Skills")+(stg.side?" · side stage":"")+"</h3>"+
      (stg.fl?'<p class="flavor">'+esc(stg.fl)+"</p>":"")+(stg.intro?"<p>"+esc(stg.intro)+"</p>":"")+
      (stg.side?'<p class="muted">Tracked on its own: its successes and failures don’t count toward the main challenge.</p>':"")+
      (stg.adv?'<p class="muted">Advances after '+(stg.adv.s?stg.adv.s+" successes":"")+(stg.adv.s&&stg.adv.f?" or ":"")+(stg.adv.f?stg.adv.f+" failures":"")+" in this stage.</p>":"")+
      '<ul class="sks">'+stg.skills.map((sk,ki)=>{
        const key=si+":"+ki,dc=skillDC(r0,key,sk);
        return'<li class="sk"><div class="sk-h"><h3>'+esc(sk.n)+"</h3>"+(sk.af?'<span class="dc">auto-fail</span>':'<span class="dc">'+dcLabel(dc)+"</span>")+
          (sk.req?chip("Needs "+sk.req,"warn"):"")+(sk.cap===1&&!sk.af?chip("1 success max"):sk.cap>1?chip(sk.cap+" successes max"):"")+((sk.max||sk.once)?chip((sk.max||1)===1?"one attempt":(sk.max+" attempts max")):"")+"</div>"+
          (sk.d?"<p>"+esc(sk.d)+"</p>":"")+outLines(c,r0,si,sk)+"</li>";}).join("")+"</ul></section>";
  });
  if(c.phases)h+="<section><h3>Phases</h3><dl>"+c.phases.map(p=>"<div><dt>"+esc(p.n)+"</dt><dd>"+esc(p.t)+"</dd></div>").join("")+"</dl></section>";
  if(c.haz){
    const hz=c.haz;
    h+="<section><h3>Hazard: "+esc(hz.n)+"</h3><p>"+esc(hz.t)+"</p>";
    if(hz.limit)h+="<p>The room is full after <b>"+hz.limit+" rounds</b>.</p>";
    else if(!hz.nosave){
      h+="<p><b>"+esc(hz.stat)+" save</b> at initiative 20 each round. "+esc(hazDcInfo(hz))+".</p>"+(hz.from?"<p>Saves begin on round "+hz.from+".</p>":"")+
        (hz.fail&&hz.fail.length?'<p class="o ok"><b>Save succeeds</b> '+esc(hz.pass||"No effect.")+'</p><p class="o bad"><b>Save fails</b> '+esc(hazFailText(hz))+"</p>":"")+
        "<p class=\"muted\">Hazard saves never count toward the challenge’s successes or failures.</p>";
    }
    h+="</section>";
  }
  if(c.quick&&c.quick.length)h+="<section><h3>Shortcuts</h3><dl>"+c.quick.map(q=>"<div><dt>"+esc(q.l)+"</dt><dd>"+esc(qDesc(q))+"</dd></div>").join("")+"</dl></section>";
  [c.table,c.rtable].filter(Boolean).forEach(t=>{
    h+="<section><h3>"+esc(t.n)+"</h3>"+(t.note?'<p class="muted">'+esc(t.note)+"</p>":"")+'<div class="tw"><table><tr><th>d6</th><th>Result</th></tr>'+t.rows.map((x,i)=>'<tr><td class="mono">'+(i+1)+"</td><td>"+esc(x)+"</td></tr>").join("")+"</table></div></section>";
  });
  h+="<section><h3>Outcomes</h3><dl>"+[["total","Total success"],["ok","Success"],["fail","Failure"]].map(x=>"<div><dt>"+x[1]+"</dt><dd>"+esc(c.out[x[0]])+"</dd></div>").join("")+(c.out.alt?"<div><dt>"+esc(c.out.alt.n)+"</dt><dd>"+esc(c.out.alt.t)+"</dd></div>":"")+"</dl></section>";
  if(c.notes&&c.notes.length)h+="<section><h3>DM notes</h3><ul>"+c.notes.map(n=>"<li>"+esc(n)+"</li>").join("")+"</ul></section>";
  h+='<section><h3>Source</h3><p class="muted">'+srcHtml(c)+"</p></section></article>";
  return h;
}

/* ---------- Actions ---------- */
const actions={
  next:()=>nextStep(),
  ok:id=>commit(()=>record(id,true)),
  fail:id=>commit(()=>record(id,false)),
  quick:id=>commit(()=>doQuick(+id)),
  applyout:()=>commit(()=>applyOutcome()),
  hf:id=>commit(()=>hazFail(id)),
  stage:id=>commit(()=>{S.stage=+id;}),
  need:(id,m)=>commit(()=>{S.need=Math.max(1,S.need+ +m);finish();}),
  lim:(id,m)=>commit(()=>{S.lim=Math.max(1,S.lim+ +m);finish();}),
  rmmod:id=>commit(()=>{S.mods.splice(+id,1);}),
  addmod:id=>commit(()=>{S.mods.push({kind:id,skills:"*",persist:false,src:"DM"});}),
  enc:id=>commit(()=>rollEnc(id==="r"?Cc.rtable:Cc.table)),
  hd:(id,m)=>commit(()=>{const p=get(id);if(p)p.hd=Math.max(0,Math.min(p.hdMax,p.hd+ +m));}),
  ex:(id,m)=>commit(()=>{const p=get(id);if(p)p.exh=Math.max(0,Math.min(6,p.exh+ +m));}),
  remove:id=>commit(()=>{S.chars=S.chars.filter(p=>p.id!==id);if(S.key==="c:"+id)S.key=null;if(S.who===id)S.who="turn";}),
  clearParty:()=>commit(()=>{S.chars=[];S.key=S.key==="haz"?"haz":null;S.who="turn";}),
  clearLog:()=>commit(()=>{S.log=[];S.enc=[];}),
  reset:()=>doReset()
};
const fields={
  name:(id,v)=>commit(()=>{const p=get(id);if(p&&v.trim())p.name=v.trim();}),
  init:(id,v)=>commit(()=>{const p=get(id);if(p)p.init=v===""?"":num(v);}),
  who:(id,v)=>quick(()=>{S.who=v;}),
  notes:(id,v)=>quick(()=>{S.notes=v;})
};
function mkChar(n,i,hd){
  const h=Math.max(1,parseInt(hd,10)||5);
  return{id:"c"+(S.nid++),name:n,init:i===""||i===undefined||i===null?"":num(i),hd:h,hdMax:h,exh:0};
}
function addChar(n,i,hd){S.chars.push(mkChar(n,i,hd));}
function freshFor(c){
  return{tier:0,chars:[],nid:1,round:0,key:null,who:"turn",s:0,f:0,stage:0,st:c.stages.map(()=>({s:0,f:0})),mods:[],lock:{},dcUp:{},dcAll:0,stats:{},
    timeAdd:0,hazAdj:0,hazNext:0,qUsed:{},log:[],enc:[],done:null,applied:false,lim:3,need:reqOf(c),notes:""};
}

CH.forEach(c=>{
  core.register({id:c.id,name:c.name,eyebrow:"Skill challenge · Complexity "+c.cx+" · "+reqOf(c)+" successes before 3 failures",
    tagline:c.fl||c.setup,pal:palOf(c),tierLabel:"DC shift",tiers:[-2,-1,0,1,2].map(n=>({id:n,label:n===0?"Book":n>0?"+"+n:"−"+(-n)})),refLabel:"Text",roster:"chars",
    fresh:()=>freshFor(c),bind:s=>{S=s;Cc=c;},actions,fields,addChar,strip,run:viewRun,ref:viewRef});
});
core.start();
})();

</script></body></html>
