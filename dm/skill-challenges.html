<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Challenge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#f1ece9; --surface:#faf7f5; --surface-2:#e8dfda; --line:#cfc2bb;
  --fg:#241a17; --muted:#65534d;
  --accent:#a8342a; --accent-ink:#ffffff; --accent-soft:#f1d6d1;
  --calm:#17695d; --calm-soft:#d2e8e3;
  --warn:#8f5a0e; --warn-soft:#f3e2c0;
  --crit:#a1302a; --crit-soft:#f3d5d1;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161110; --surface:#1f1816; --surface-2:#2b211f; --line:#43332f;
  --fg:#f0e6e2; --muted:#b5a29b;
  --accent:#ef7a6c; --accent-ink:#2a0c08; --accent-soft:#40201b;
  --calm:#4cc5b2; --calm-soft:#183a34;
  --warn:#e8b155; --warn-soft:#3b2e13; --crit:#f08a7f; --crit-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161110; --surface:#1f1816; --surface-2:#2b211f; --line:#43332f;
  --fg:#f0e6e2; --muted:#b5a29b;
  --accent:#ef7a6c; --accent-ink:#2a0c08; --accent-soft:#40201b;
  --calm:#4cc5b2; --calm-soft:#183a34;
  --warn:#e8b155; --warn-soft:#3b2e13; --crit:#f08a7f; --crit-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
.head{padding-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding-block:12px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-weight:600;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:650;border-bottom:2px solid transparent;min-height:38px}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.calm{background:var(--calm);color:var(--bg);border-color:var(--calm)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.strip-in{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.stat{display:grid;gap:2px}
.stat b{font:700 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span.sub{font-size:12px;color:var(--muted)}
.stat .row{display:flex;align-items:center;gap:6px}
.strip .acts{display:flex;gap:8px;margin-left:auto}
.pips{display:flex;gap:6px;margin-top:3px}.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--calm)}.pip.f{background:var(--calm)}
.step{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:17px;font-weight:700;line-height:1}
.step:hover{border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.trap{background:var(--accent-soft);border-color:var(--accent)}
.card.calmc{background:var(--calm-soft);border-color:var(--calm)}
.card h2{margin-block:4px 8px}
.run{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1080px){.run{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.run-main,.run-aside{display:grid;gap:16px;min-width:0;grid-template-columns:minmax(0,1fr)}
.order{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0;list-style:none}
.oc{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;white-space:nowrap}
.oc .i{font:600 12px var(--font-mono);color:var(--muted)}
.oc.trap{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600}
.oc.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.oc.cur .i{color:inherit}
.oc.out{opacity:.5}
.party-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.party-head h2,.party-head h3{margin-right:auto}
.addf{display:flex;gap:8px;flex-wrap:wrap}
.addf input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
.addf #newHd{width:72px}
.addf #newName{flex:1 1 150px}.addf #newInit{width:80px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr))}
.char{grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.char.is-active{box-shadow:0 0 0 2px var(--accent)}
.char.is-out{opacity:.78}
.ch-head{display:flex;gap:8px;align-items:center}
.ch-head .name{flex:1;min-width:0;border:1px solid transparent;background:transparent;font:650 17px var(--font-display);padding:3px 6px;border-radius:6px}
.ch-head .name:hover,.ch-head .name:focus{border-color:var(--line);background:var(--bg)}
.ch-head .init{width:56px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;text-align:center;font-family:var(--font-mono)}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font:600 12px var(--font-body);background:var(--surface-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.ok{background:var(--calm-soft);color:var(--calm)}
.ch-acts{display:flex;flex-wrap:wrap;gap:6px}
.res{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:8px}
.res:first-of-type{border-top:0;margin-top:0}
.res-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res-top .who{flex:1;min-width:130px}
.res-out{font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}
.res-out input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-family:var(--font-mono);text-align:center}
.res-out .eff{flex-basis:100%}
.remind{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.glance{display:grid;gap:8px;margin:0}
.glance div{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px}
.glance dt{font:600 12px/1.6 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.glance dd{margin:0}
.banner{background:var(--calm-soft);border:1px solid var(--calm);color:var(--calm);border-radius:8px;padding:8px 12px;font-weight:600;margin-top:8px}
.banner.bad{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;max-height:300px;overflow-y:auto;font-size:13px}
.log li{display:flex;gap:8px}
.log .r{font:500 11px/1.9 var(--font-mono);color:var(--muted);min-width:30px}
.note{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:14px}
.ref{max-width:820px;display:grid;gap:22px}
.ref section{display:grid;gap:8px}
.ref h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.ref dl{margin:0;display:grid;gap:8px}
.ref dt{font-weight:650}
.ref dd{margin:0}
.ref ul{margin:0;padding-left:20px;display:grid;gap:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.hl td{background:var(--accent-soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* rules carried over from the Concentrated Magic Zone page */
#hum{display:block;width:100%;height:34px;margin-top:6px}
.btn.bad[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.strip .grow{flex:1;min-width:150px}
.party-head h2{margin-right:auto}
.sat-row{display:flex;align-items:center;gap:10px}
.sat-num{font:700 40px/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.meter{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:16px}
.cell{border-radius:3px;background:color-mix(in srgb,var(--zone) 22%,var(--surface-2))}
.cell.on{background:var(--zone)}
.z0{--zone:var(--accent)}.z1{--zone:var(--warn)}.z2{--zone:var(--crit)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 10px var(--font-mono);color:var(--muted);margin-top:-4px}
.mlab span{white-space:nowrap;overflow:hidden}
.muts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mut{display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.mut p+p{margin-top:2px}
.mut-x{color:var(--warn);font-weight:600}
.sup{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.sup li{display:flex;gap:8px;align-items:flex-start}
body[data-trap="cmz"]{--bg:#edf1ef;--surface:#f8faf9;--surface-2:#e0e8e5;--line:#c3cfca;--fg:#13201c;--muted:#4b5e58;--accent:#17695d;--accent-ink:#ffffff;--accent-soft:#d2e8e3;--calm:#17695d;--calm-soft:#d2e8e3;--warn:#8f5a0e;--warn-soft:#f3e2c0;--crit:#a1302a;--crit-soft:#f3d5d1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-trap="cmz"]{--bg:#0d1412;--surface:#141e1b;--surface-2:#1c2a26;--line:#2a3b36;--fg:#e4eeea;--muted:#9bb0a9;--accent:#4cc5b2;--accent-ink:#04201b;--accent-soft:#183a34;--calm:#4cc5b2;--calm-soft:#183a34;--warn:#e8b155;--warn-soft:#3b2e13;--crit:#f08a7f;--crit-soft:#3d1c19}}
:root[data-theme="dark"] body[data-trap="cmz"]{--bg:#0d1412;--surface:#141e1b;--surface-2:#1c2a26;--line:#2a3b36;--fg:#e4eeea;--muted:#9bb0a9;--accent:#4cc5b2;--accent-ink:#04201b;--accent-soft:#183a34;--calm:#4cc5b2;--calm-soft:#183a34;--warn:#e8b155;--warn-soft:#3b2e13;--crit:#f08a7f;--crit-soft:#3d1c19}
.picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{min-width:0}
body[data-trap="owz"]{--bg:#f2ede1;--surface:#faf6ec;--surface-2:#e8dfc9;--line:#d1c5a8;--fg:#241f12;--muted:#66593f;--accent:#9a5b0c;--accent-ink:#ffffff;--accent-soft:#f1dfba;--calm:#17695d;--calm-soft:#d2e8e3;--warn:#8f5a0e;--warn-soft:#f3e2c0;--crit:#a1302a;--crit-soft:#f3d5d1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-trap="owz"]{--bg:#17130b;--surface:#201a10;--surface-2:#2c2417;--line:#46391f;--fg:#f0e8d4;--muted:#b5a784;--accent:#e6a53c;--accent-ink:#2a1a04;--accent-soft:#43310f;--calm:#4cc5b2;--calm-soft:#183a34;--warn:#e8b155;--warn-soft:#3b2e13;--crit:#f08a7f;--crit-soft:#3d1c19}}
:root[data-theme="dark"] body[data-trap="owz"]{--bg:#17130b;--surface:#201a10;--surface-2:#2c2417;--line:#46391f;--fg:#f0e8d4;--muted:#b5a784;--accent:#e6a53c;--accent-ink:#2a1a04;--accent-soft:#43310f;--calm:#4cc5b2;--calm-soft:#183a34;--warn:#e8b155;--warn-soft:#3b2e13;--crit:#f08a7f;--crit-soft:#3d1c19}
body[data-trap="gwg"]{--bg:#E7EBDF;--surface:#F5F7F0;--surface-2:#DCE2D1;--line:#BAC4AB;--fg:#1D2517;--muted:#4B5740;--accent:#47652A;--accent-ink:#F5F7F0;--accent-soft:#DCE6C8;--calm:#3B7436;--calm-soft:#D6E8CF;--warn:#8A4F08;--warn-soft:#F1E0BE;--crit:#A3361A;--crit-soft:#F3D5CC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-trap="gwg"]{--bg:#12150E;--surface:#1A1E14;--surface-2:#242A1B;--line:#38412D;--fg:#E5E9D6;--muted:#A5AF92;--accent:#8FB85A;--accent-ink:#12150E;--accent-soft:#27321B;--calm:#8CC97E;--calm-soft:#1E3019;--warn:#EDAA3A;--warn-soft:#3A2D12;--crit:#EE8062;--crit-soft:#3d1c19}}
:root[data-theme="dark"] body[data-trap="gwg"]{--bg:#12150E;--surface:#1A1E14;--surface-2:#242A1B;--line:#38412D;--fg:#E5E9D6;--muted:#A5AF92;--accent:#8FB85A;--accent-ink:#12150E;--accent-soft:#27321B;--calm:#8CC97E;--calm-soft:#1E3019;--warn:#EDAA3A;--warn-soft:#3A2D12;--crit:#EE8062;--crit-soft:#3d1c19}
.dc{font:600 .88em var(--font-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .35em;white-space:nowrap}
.dice{font:600 .9em var(--font-mono);color:var(--crit);background:transparent;border:1px solid color-mix(in srgb,var(--crit) 50%,transparent);border-radius:4px;padding:0 .4em;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.dice:hover{background:color-mix(in srgb,var(--crit) 14%,transparent)}
.pill{display:inline-flex;align-items:baseline;gap:6px;font:600 12px var(--font-body);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.pill i{font-style:normal;font-weight:500;color:var(--muted)}
.pill.live{border-color:var(--warn);color:var(--warn)}
.pill.done{border-color:var(--calm);color:var(--calm)}
.pill.off{border-color:var(--muted);color:var(--muted);text-decoration:line-through}
.chk{display:flex;align-items:center;gap:8px;min-height:36px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk.lock{opacity:.55;cursor:default}
.nowl{display:grid;gap:10px;margin-top:12px}
.item{border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px}
.item h4{margin:0 0 6px;font:650 16px var(--font-display)}
.item p{margin:0 0 8px}
.tgt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.pcs{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr))}
.pc{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface);min-width:0;grid-template-columns:minmax(0,1fr)}
.pc-top{display:flex;align-items:center;gap:8px}
.pc-top strong{flex:1;min-width:0;overflow-wrap:anywhere;font:650 16px var(--font-display)}
.pp{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.pp input{width:56px;font:500 14px var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.zones{display:grid;grid-template-columns:repeat(4,1fr)}
.zones button{min-height:36px;padding:4px}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font:600 12px var(--font-body);padding:3px 10px;cursor:pointer;min-height:30px}
.cond[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cmlist{display:grid;gap:10px}
.cmr{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:4px}
.cmr:first-child{border-top:0;padding-top:0}
.stepper,.num{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.num input{width:76px;font:500 14px var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.last{display:flex;gap:12px;align-items:center}
.tot{font:600 34px/1 var(--font-mono);min-width:2ch;text-align:center}
.tot.crit{color:var(--calm)}.tot.fumble{color:var(--crit)}
.lf{font-size:13px;color:var(--muted)}
.rl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:13px}
.rl li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:3px 0;color:var(--muted)}
.rl b{font-family:var(--font-mono);color:var(--fg)}
.ids{display:grid;gap:10px}
.id{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.id:first-child{border-top:0;padding-top:0}
.id-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.id p{margin:0}

<script>
/* ---------- DATA: every skill challenge from Challenge Accepted 1 and 2 ---------- */
const TIERS=[["Very Easy",5],["Easy",10],["Moderate",15],["Hard",20],["Very Hard",25],["Nearly Impossible",30]];
const TK={ve:0,e:1,m:2,h:3,vh:4,ni:5};
const CH=[];
const K=(n,dc,d,o)=>Object.assign({n,dc,d},o||{});
const C=o=>CH.push(o);

C({id:"defenders",b:"1 + 2",name:"Defenders in Need",tags:["social"],cx:2,scale:"A short conversation, or several days of negotiation.",
fl:"The Priestess turns her head to the pews. Gesturing with her holy symbol, she bids you to sit. “Why is it you seek the aid of my templars?”",
setup:"The characters are trying to win the help of an NPC. They may be given tasks to earn favor. They need the NPC’s aid to overcome their larger challenge. (Appears in both books.)",
stages:[{skills:[
K("Deception","h","Encourage the NPC to help with false information, a promise of support on another issue, dirt on a rival, or a claim to know someone important."),
K("History","e","Remark on a significant event from the NPC’s past.",{cap:1}),
K("Insight","m","Empathize with the Priestess and use that to encourage her aid.",{ok:["text:Learn that any Intimidation check will fail"]}),
K("Intimidation","af","She refuses to be intimidated and says they will be removed if they keep it up.",{af:1}),
K("Persuasion","m","Entreat her for aid, describing how failure could hurt her interests and the locals.",{ok:["adv:History"]})]}],
out:{total:"The NPC agrees to provide aid that is within reason.",ok:"The NPC agrees to provide aid, but has a special request.",fail:"The characters act without the NPC’s aid. The next encounter is harder: more enemies, an extra trap or another complication."}});

C({id:"chase",b:"1",name:"Assassin Urban Chase",tags:["chase"],cx:3,scale:"A few minutes. Each round is a stretch of the chase.",
fl:"An assassin shoves through the town square, villagers and merchants scream. You don’t know who the young noble was or why she was killed, but if you don’t catch the assassin quickly, they may escape.",
setup:"The characters pursue an assassin who killed a young noble. This may be their only chance to learn who is behind it. They must cross the cityscape faster and smarter than the assassin.",
stages:[{skills:[
K("Acrobatics","m","Vault obstacles, dodge crowds or cross narrow passages. A failure means a slip, trip or spill.",{bad:["hd:1"]}),
K("Athletics","m","Move as fast as possible: jumping fences, climbing walls, leaping between rooftops."),
K("History","h","Know the area well enough to use its layout.",{ok:["adv:Acrobatics"]}),
K("Investigation","m","Read the assassin’s movements and hamper them: a fruit cart, a canvas canopy, a laundry line."),
K("Perception","e","Spot a less crowded route, an alley shortcut or a blocked path.",{ok:["dc"]})]}],
out:{total:"The characters catch the assassin. This can lead to combat or to diplomacy.",ok:"They catch the assassin, leading straight into combat with no room for diplomacy.",fail:"They lose sight of the assassin and must find them later. The assassin hides, waits to see if the trail is cold, sets traps and plans an ambush."}});

C({id:"blizzard",b:"1",name:"Blizzard",tags:["survival"],cx:2,scale:"A round is a minute, an hour or a day, at the DM’s discretion.",
fl:"After several hours on your journey, the temperature sharply drops. Snow falls in buckets. On the horizon is a stark white wall reaching up to the sky. Each moment brings the blizzard closer.",
setup:"The party is caught in a blizzard and must survive while seeking shelter or their destination. No character gains a Short or Long Rest while in the storm without shelter.",
haz:{n:"Freezing storm",stat:"Constitution",dc:"m",t:"Resist freezing temperatures, hailstones and vicious winds.",fail:["hd:1"]},
stages:[{skills:[
K("Athletics","m","Break a path through drifts, over fallen trees and rocky outcroppings.",{bad:["hd:1"]}),
K("Medicine","e","Help another character: bandage hail wounds, treat sprained ankles.",{ok:["text:Targeted character has advantage on their next Constitution save","dc"]}),
K("Nature","h","Study the terrain and use wilderness lore to lead the party to shelter.",{ok:["adv:Hazard"]}),
K("Survival","m","Navigate a path past ice patches, steep snow dunes and wind tunnels.")]}],
out:{total:"The party finds shelter: their destination, a hamlet, a cave or another natural formation.",ok:"The party finds shelter. All characters lose 1 Hit Die.",fail:"The party finds shelter at the cost of one level of exhaustion, having stumbled into a monster’s lair.",okFx:["hdAll:1"],failFx:["exhAll:1"]}});

C({id:"lore",b:"1",name:"Discovering Secret Lore",tags:["investigation","social"],cx:3,scale:"Minutes, hours, days or weeks, depending on the information.",
fl:"You can’t recall any lore on the topic you seek. It’s time to hit the books and do thorough investigative research.",
setup:"The characters gather clues from libraries, old sages and loremasters. They might seek a foe’s weakness, a secret path into a stronghold or a lost temple. (The book’s text says 7 successes while listing complexity 3; this tracker uses 8. Change the need with the success dial.)",
stages:[{skills:[
K("History","vh","A piece of information sparks a memory: past studies, a mentor’s words, something overheard."),
K("Investigation","m","Visit a library and sift through scrolls and tomes.",{bad:["text:That location has nothing useful and can’t be used again"]}),
K("Persuasion","e","Visit an old sage or scholar. Payment is required: enough to inconvenience, not bankrupt.",{bad:["text:That NPC has nothing and can’t be consulted again"]}),
K("Religion","m","Visit a temple or monastery for religious lore, omens and counsel.",{bad:["text:That location has nothing useful and can’t be used again"]})]}],
out:{total:"The characters gain the information in a timely manner.",ok:"They gain the information but lose a lot of time: days, weeks or even months.",fail:"They gain the information, but much of it is inaccurate. This increases the challenge or leads them into an unfavorable situation."}});

C({id:"surgery",b:"1",name:"Emergency Surgery",tags:["investigation","combat"],cx:1,scale:"Seconds. The victim is on the verge of death.",
fl:"A magical, poisoned arrow is lodged near vital organs and cannot simply be pulled out. Any time magic is used near it, the arrow reacts violently and harms the victim further.",
setup:"A character or important NPC is dying and normal magical healing is impossible or unavailable. The group has to act fast.",
stages:[{skills:[
K("Medicine","e","First aid to keep the victim stable. Observe the body’s reaction to the poison.",{ok:["adv:Nature"]}),
K("Sleight of Hand","m","Remove the arrow slowly without causing pain that makes the victim flinch.",{ok:["adv:Investigation,Perception"]}),
K("Investigation","m","Examine the arrow to learn its properties and how to remove it.",{ok:["adv:Medicine"]}),
K("Perception","m","Find a way to remove the arrow without more harm."),
K("Nature","h","Recall the substance the poison is derived from and think of an antidote.")]}],
out:{total:"The characters identify the poison, quickly give aid and gather a cure.",ok:"They identify the poison and give aid or find a cure, but the slow work leaves the victim disfigured for life.",fail:"Too slow, or the poison was misidentified and the wrong cure applied. The victim dies."}});

C({id:"flood",b:"1",name:"Flooding Chamber",tags:["combat","trap"],cx:1,scale:"Combat rounds. The room fills at initiative 20.",
fl:"An octagonal chamber with corpses on the floor and two stone doors carved with fish heads. A stone door slams behind you. Water gushes through the fish-heads and the corpses rise.",
setup:"A pressure plate seals the chamber and floods it. Three zombies attack, grappling and slowing the characters. The room fills at initiative 20 each round and is full in 5 rounds unless the party acts. The zombies hold the keys that stop the water. Once all keys are used, the doors open.",
haz:{n:"Rising water",limit:5,nosave:true,t:"The water rises at initiative 20 each round and the room is completely full after round 5. A success that pries a door open or props the jaws closed (Athletics or Sleight of Hand) adds 2 rounds. Once the room is full, characters who can’t breathe underwater are suffocating (DMG p183)."},
stages:[{skills:[
K("Athletics","vh","Pry open one of the doors.",{ok:["time:2"],bad:["dc"]}),
K("Investigation","m","The carved fish-face has a hinged jaw. A character fighting a zombie with passive Perception 14 spots a key in its mouth."),
K("Perception","m","A small keyhole is visible inside the carving’s gill."),
K("Sleight of Hand","m","Prop the hinged jaws closed with a dagger or similar.",{ok:["time:2"]})]}],
out:{total:"The characters stop the water and open the doors with little or no trouble.",ok:"They stop the water, wading through it, tired. Each character loses one Hit Die and one small item washed away.",fail:"The chamber fills completely. Those who can’t breathe underwater suffocate. They have a number of rounds to kill the remaining zombies, then find the keys and drain the water. All characters suffer a level of exhaustion.",okFx:["hdAll:1"],failFx:["exhAll:1"]}});

C({id:"interrogation",b:"1",name:"Interrogation",tags:["social"],cx:2,scale:"A few minutes, or longer if the captive is stubborn.",
fl:"The filthy captive snarls and spits at you, showing nothing but deep-seated anger in their murderous eyes.",
setup:"Information must be extracted from a captive by breaking their will, threats, bribes or a bargain. The characters may even adventure out with little information and return later with new threats and leverage.",
stages:[{skills:[
K("Deception","m","Claim to be in cahoots with their allies, or trick them into thinking you’re there to help.",{bad:["lock","dcAll"]}),
K("Intimidation","h","Threaten violence: fingers, bones, poison, harm to loved ones.",{bad:["lock","dcAll"]}),
K("Persuasion","m","Bargain in good faith: a bribe or other incentive. If the party doesn’t honor the deal, word spreads and they have disadvantage on good-faith Persuasion in the region.",{}),
K("Investigation","h","Spot a symbol, tattoo or jewelry that gives leverage over the captive.",{ok:["adv:Deception,Persuasion"]})]}],
out:{total:"The characters obtain valuable information. If bribed, the captive may even become a willing spy.",ok:"They obtain valuable information.",fail:"The captive refuses, and gives false information such as a password that leads into a trap or ambush."}});

C({id:"goblins",b:"1",name:"Into the Goblin Camp",tags:["social","stealth"],cx:2,scale:"A tense few minutes at the camp’s edge.",
fl:"You smell body odor and foul meat from the alcove in the rocks. Goblins guard the entrance and patrol the area. After a while they lose interest and start a game of dice.",
setup:"The way in is guarded. Paths: wade a river against the current, climb over the back, or use the main entrance.",
stages:[{skills:[
K("Athletics","h","Scale the rocks, rappel in from above or swim the harsh current."),
K("Deception","h","Say they were hired to help, that they won’t be harmed if let in, or claim friendship with the leader.",{bad:["lock","disAll:Persuasion"]}),
K("History","m","Goblins are greedy, selfish, easily flattered and cowardly.",{ok:["adv:Deception,Intimidation,Persuasion"]}),
K("Intimidation","e","Scare the goblins with presence and threats of violence."),
K("Persuasion","m","Flatter their physique and prowess, offer a bribe or an easy escape.")]}],
out:{total:"The goblins stand down and let the characters in freely.",ok:"The goblins let them in but secretly set a spy to watch and report any trouble.",fail:"The path stays closed. One goblin says “Go and warn the boss and crew, we have intruders.” Ranged goblins take the high ground and combat begins."}});

C({id:"legions",b:"1",name:"Legions Pass",tags:["social","survival"],cx:3,scale:"Best run over an extended period, with events in between.",
fl:"Hiking through rocky and desolate mountain trails, you come upon banners and a barricade of toppled carts. A contingent of goblinoids stare you down. You’ve arrived at Legions Pass.",
setup:"The most direct route is swarming with hobgoblins ruled by the warlord Hofmorge, a political leader and predatory creature who allows safe passage when it suits her. It suits timed events: choose a dangerous, quick path or a safe, long one. Spend a Stealth failure on an Interception (second stage).",
stages:[{skills:[
K("Constitution","m","Trek through rocky mountains with no worn path and poor footing (group check).",{bad:["exh:1"]}),
K("Medicine","m","Tend severely injured goblinoids hurt in a recent raid.",{ok:["adv:Persuasion"]}),
K("Persuasion (Step 1)","m","Speak with farmers and merchants to find locals connected to the warlord. Opens Step 2.",{base:"Persuasion"}),
K("Persuasion (Step 2)","m","Gain an audience with the warlord and convince her that your quest benefits the legion more than scavenging your corpses.",{base:"Persuasion",req:"Persuasion (Step 1)"}),
K("Stealth","m","Evade the warlord’s patrols through the rocky region.",{bad:["text:Interception! Switch to the Interception stage"]}),
K("Survival","m","Study tracks to find sparsely populated routes where patrols are least likely.")]},
{n:"Interception",side:1,intro:"Caught by patrols in vastly superior numbers. Bluff, cajole or threaten until the leader gives in. On a failure: if the party hasn’t met the warlord, they’re taken to her. If they have, there are too many to fight and they must escape.",skills:[
K("Deception","m","Bluff the patrol leader."),K("Intimidation","m","Threaten them into letting you pass."),K("Persuasion","m","Cajole them into letting you pass.")]}],
out:{total:"The party gains permission to travel unhindered.",ok:"The party gains permission, but the warlord demands a high bribe, toll or service.",fail:"Overwhelming odds. The party must flee to the starting point and take a lengthy detour, losing time and gaining a level of exhaustion.",failFx:["exhAll:1"]}});

C({id:"forest",b:"1",name:"Lost in the Forest",tags:["survival"],cx:2,scale:"Each round is hours or days, at the DM’s discretion.",
fl:"After hours of wandering through the wilderness, the foliage is thick and the terrain unfamiliar. It slowly occurs to you… you have no idea where you are.",
setup:"The party must survive the unfamiliar forest until they find a settlement. Every round at least one character must make a Nature check.",
haz:{n:"Elements and hunger",stat:"Constitution",dc:"e",esc:1,t:"High winds, rain, lack of food and water. The DC rises one level every round.",fail:["hd:1"]},
stages:[{skills:[
K("Nature","m","Avoid natural hazards: poisonous plants, dangerous terrain, weather patterns. Required each round.",{bad:["hd:1"]}),
K("Survival","m","Spot signs of dangerous creatures, follow safe tracks, forage and find water.",{ok:["adv:Hazard"],bad:["hdAll:1"]})]}],
out:{total:"The characters emerge to a familiar location and out of immediate danger.",ok:"They emerge to a familiar location. Every character suffers one level of exhaustion.",fail:"One level of exhaustion and the party stumbles into a monster’s lair. Afterward they must complete another Lost in the Forest challenge.",okFx:["exhAll:1"],failFx:["exhAll:1"]}});

C({id:"door",b:"1",name:"Magically Sealed Door",tags:["magic","trap"],cx:2,scale:"Minutes, with the glyph ready to detonate.",
fl:"Winding passages lead deep into the dungeon. The air smells of mildew. You arrive at a large pair of wooden doors with iron supports and a carving of a roaring lion.",
setup:"The door is sealed with arcane lock and a glyph of warding (explosive runes). Any attempt to open it triggers the glyph. For dispel magic, treat the effect as a 4th-level spell, and it removes only one spell at a time. Knock suppresses arcane lock for 10 minutes.",
stages:[{skills:[
K("Arcana","m","Study the wards and unpick the weave. A failure causes arcane backlash: 13 (2d8) thunder, lightning, fire or cold damage, your choice.",{bad:["text:Arcane backlash: 13 (2d8) damage to the caster"]}),
K("Investigation","h","Spot the nearly invisible glyphs. Grants advantage on the next Arcana check. Only a single success.",{cap:1,ok:["adv:Arcana"]}),
K("Perception","m","Spot the runes and sigils (arcane lock). Does not count as a success, but grants advantage on the next Arcana check.",{ns:1,ok:["adv:Arcana"]}),
K("Athletics","vh","Bull rush the door. It bursts in a fireball and triggers the glyph of warding. One attempt, automatic success.",{cap:1,once:1,ok:["text:Triggers the glyph of warding"]})]}],
out:{total:"The characters alter the weave and bring down the barriers.",ok:"The barriers come down. Any character who attempted Arcana loses hit points equal to the number of failures.",fail:"The glyph of warding is released on the characters. Arcana users lose hit points equal to the number of failures. They must find another path or an enemy who knows how to bypass the barrier (consider Interrogation)."}});

C({id:"misunderstanding",b:"1",name:"Misunderstanding",tags:["social","magic"],cx:2,scale:"A few tense minutes at the sacred ruins.",
fl:"A white stallion with a single glimmering spiral horn levels a menacing gaze at you. A thunderous, angry female voice booms in your head, in Elvish: “Leave this domain, you foul-hearted creatures! You are not welcome here!”",
setup:"Aerowen, a unicorn, has guarded the sacred ruins from bandits for centuries and assumes the party is another raiding gang. The party must retrieve an item. Convince her or face a difficult fight with a divine guardian.",
stages:[{skills:[
K("Arcana","m","Unicorns are placed on the material plane to ward off evil and protect sacred places or artifacts.",{ok:["adv:Persuasion"]}),
K("Deception","h","Trick the unicorn: the item is why bandits keep raiding, an innocent will die without it, or the group will be slain if they fail."),
K("Intimidation","h","Threaten the unicorn: if they don’t get the item, others will come who may not be willing to discuss it.",{cap:1}),
K("Insight","m","Sense her resentment of raiders and her desire to have them removed.",{ok:["adv:Persuasion"]}),
K("Persuasion","m","Strike an arrangement: show respect, give a small gift, or offer to deal with the bandits.")]}],
out:{total:"Aerowen is convinced and lets them continue, and grants a small magical boon.",ok:"Aerowen lets them continue, but they must first find the bandits and deal with them.",fail:"Aerowen tires of the lies and deceit and attacks, aided by fey creatures she summons."}});

C({id:"murder",b:"1",name:"Murder in the Streets",tags:["investigation","social"],cx:3,scale:"Hours. Run in two stages.",
fl:"Screams ring out from the town center. A crowd surrounds the crumpled frame of a young blue-skinned tiefling man with a single broken horn.",
setup:"The party must learn the cause of death, find the murderer and uncover the motive. House Livingstrong is being framed by the warring House Thornward, who found the tiefling was a spy for Livingstrong and want to put Livingstrong at odds with the law. Move to stage 2 when the body is examined.",
stages:[{n:"Stage 1: The body",skills:[
K("Investigation","m","Purple residue in and around the wound, maybe a poison.",{ok:["adv:Nature"]}),
K("Medicine","m","The wound is shallow and shouldn’t have been deadly.",{cap:1}),
K("Perception","e","A thin, deep stab wound near the right kidney.",{cap:1}),
K("Nature","h","The poison comes from a purple wurm, not native to the area.")]},
{n:"Stage 2: Witnesses",skills:[
K("Persuasion","m","Witnesses saw the tiefling arguing with a human in a black cloak over a blue and white tabard with a tree and gauntlet."),
K("History","h","The coat of arms is House Livingstrong’s. If the wurm poison was identified, also recall it’s a favorite of House Thornward."),
K("Intimidation","h","Aggressive demands. Witnesses recall the assailant’s ring bore House Thornward’s insignia, not matching the tabard."),
K("Survival","e","Track the assailant’s footprints, leading to House Livingstrong.")]}],
out:{total:"The murderer fled toward House Livingstrong, but subtle clues show House Thornward is framing them.",ok:"The murderer fled toward House Livingstrong and strong clues point to a Livingstrong noble.",fail:"Same strong clues, and the inquiry has caught House Thornward’s attention. They add false allegations and plant more evidence."}});

C({id:"rift",b:"1",name:"Rift to the Abyss",tags:["magic","combat"],cx:1,scale:"Combat rounds. Enemies pour through each round.",
fl:"A large ritual circle with a black and purple dimensional rift has been opened to the Abyss by a powerful demon. A few minor demons have clawed through and are trying to keep it open.",
setup:"Best combined with a combat encounter: some of the party fights the powerful demon and minions while others close the rift. For dispel magic, treat the rift as a 9th-level spell.",
stages:[{skills:[
K("Arcana","h","Close the rift by funneling chaotic energy into your body, or sending a torrent of arcane energy into it.",{bad:["hd:1"]}),
K("Constitution","m","Help distribute the energy funneled into an ally to lessen the trauma. The helper loses the Hit Die instead of the Arcana caster. On a failure both lose one.",{bad:["hd:1"]}),
K("History","vh","Recall a legendary wizard who closed a rift with the spell shatter.",{ok:["text:If shatter is cast on the rift, advantage on all Arcana checks for the rest of the challenge"]}),
K("Investigation","e","Identify the demonic glyphs and sigils that regulate its power and disrupt them.",{ok:["adv:Arcana"]}),
K("Religion","m","Purify the dark energy with a blessing, a holy symbol or holy water.")]}],
out:{total:"The rift implodes. Demons within 10 feet must succeed on a Moderate Strength save or be pulled in as it closes.",ok:"The rift explodes with necrotic energy. Use fireball centered on the rift, dealing necrotic damage, at a level matching the party.",fail:"The rift’s power is too great and demons keep flooding out. All characters suffer a level of exhaustion and must escape the horde.",failFx:["exhAll:1"]}});

C({id:"rapids",b:"1",name:"River Rapids",tags:["survival"],cx:3,scale:"Hours down the river. Saves time on a long journey.",
fl:"A raging stream merges into a larger river downstream. There’s timber nearby to build a raft, a swifter way than mount or foot, and a chance to rest.",
setup:"The party is on a time-sensitive journey and can build a raft and ride the river. Parts of the river are treacherous.",
haz:{n:"Thrashing raft",stat:"Dexterity",dc:"e",t:"The thrashing raft can throw a character into the water.",fail:["text:The character falls into the river and must spend their turn on a Moderate Athletics check to climb back aboard. A character who ends their turn in the water loses 1 Hit Die."]},
stages:[{skills:[
K("Athletics","m","Direct the raft or stabilize it against the waves. If a check fails by 5 or more, lose 2 Hit Dice instead.",{ok:["adv:Hazard"],bad:["hd:1"]}),
K("Constitution","h","Weather the dangerous rapids, waiting for a calm stretch to help others aboard.",{ok:["adv:Athletics"]}),
K("History","vh","Recall a map of this stretch, warning of a less hazardous route around waterfalls and jagged rocks.",{ok:["adv:Acrobatics"]}),
K("Sleight of Hand","m","Repair raft damage mid-rapids: retie knots and pull loose timber back into place."),
K("Survival (Step 1)","m","Guide the party as they gather timber, tie knots and build the raft. Opens Step 2. A failure gives a rickety raft: disadvantage on all Sleight of Hand checks.",{base:"Survival",bad:["disAll:Sleight of Hand"]}),
K("Survival (Step 2)","m","Navigate the branching and twisting sections of the river.",{base:"Survival",req:"Survival (Step 1)",ok:["adv:Acrobatics"],bad:["dis:Acrobatics"]}),
K("Acrobatics","m","Keep your footing on the raft. Added: the book’s effects reference Acrobatics but give it no entry.",{added:1})]}],
out:{total:"The characters navigate the rapids with little trouble. They gain the benefit of a Short or Long Rest at the DM’s discretion.",ok:"They navigate the rapids, but each character loses Hit Dice equal to the number of failures and doesn’t gain rest on the rapids.",fail:"The raft shatters. The party only makes it about halfway and finishes on foot. All suffer a level of exhaustion.",okFx:["hdAll:fails"],failFx:["exhAll:1"]}});

C({id:"storm",b:"1",name:"Weathering the Storm",tags:["survival","chase"],cx:3,scale:"Hours at sea. Each round is a stretch of the storm.",
fl:"The roaring tempest rages around the ship and thunderheads fill the sky. The captain’s orders are barely audible. Waves smash the bow, thunder cracks, the icy touch of the water is an ill omen.",
setup:"The party is sailing as passengers or owners when a storm nears. Man the sails, navigate with limited visibility, and stay on deck. Someone who fails a physical check can go overboard (second stage).",
stages:[{skills:[
K("Acrobatics","h","Keep your footing on the slick deck as swells slosh gallons of water across it.",{bad:["text:Goes overboard! Switch to the Overboard stage"]}),
K("Athletics","m","Pull the rigging tight and set the sails so the ship climbs the waves without straining masts.",{bad:["text:Goes overboard! Switch to the Overboard stage"]}),
K("Investigation","m","Read the map in the weather and shout corrections to the crew.",{bad:["dis:Acrobatics,Athletics"]}),
K("Perception","h","Spot an incoming swell and alert the crew.",{ok:["adv:Acrobatics,Athletics"]}),
K("Sleight of Hand","h","Rigging snaps in the wind. Pick the best knot to cobble the lines together."),
K("Survival","m","Sense a shift in the wind and call out adjustments to the crew.",{ok:["adv:Investigation"]})]},
{n:"Overboard",side:1,intro:"A character falls in. The crew’s reasonable rescue attempts grant advantage. The character must immediately make a DC 12 Constitution save, and again every minute overboard. On a failure the waves thrash them and they lose one minute of air. At no air they fall unconscious and make death saves each round (see Suffocating, PHB p183).",skills:[
K("Athletics","m","Fight the waves to swim."),K("Constitution","m","Hold on and keep breathing."),K("Perception","m","See where you’re going.")]}],
out:{total:"The characters navigate the storm, crew and vessel intact, and reach the destination with little problem.",ok:"Crew safe, but severe damage. The crew suffers a level of exhaustion and the ship needs repairs before sailing again.",fail:"The ship runs ashore on an undiscovered island with cannibal natives. Two levels of exhaustion, and days or weeks lost making the ship seaworthy.",okFx:["exhAll:1"],failFx:["exhAll:2"]}});

/* ---------- Challenge Accepted II ---------- */
C({id:"mephit",b:"2",name:"Bargaining with a Mephit",tags:["social","magic"],cx:1,scale:"A tense few minutes at the lair’s door.",
fl:"A small creature, like a miniature elemental devil, hisses angrily at your arrival. “Do you serve the master?”",
setup:"A magma mephit, a warlock’s familiar on watch duty, resents the job and its new master. It loves arcane knowledge. If a fight breaks out, it uses its readied action to touch a glyph that triggers a dangerous electric floor trap (passive Perception DC 16 to notice).",
stages:[{skills:[
K("Arcana","m","Impress the mephit with knowledge of its elemental nature, varieties and trickster personalities.",{bad:["dis:Persuasion,Deception"]}),
K("Deception","m","Claim to serve the same master, appealing to its superiority complex.",{ok:["adv:Persuasion"]}),
K("Insight","e","Read its mood: laid back, snarky, at ease. Only a single success.",{cap:1}),
K("Persuasion","h","Honeyed words about important work and a need to meet the warlord quickly.")]}],
out:{total:"The mephit lets the characters pass without trouble.",ok:"The mephit lets them pass, then alerts its master. The next encounter is an ambush or more dangerous.",fail:"Negotiations trigger a dangerous spiked pit trap (DMG), with the spikes coated in crawler poison (DMG)."}});

C({id:"betrayal",b:"2",name:"Betrayal of the Master",tags:["social","combat"],cx:1,scale:"Works as a negotiation during combat with the incubus.",
fl:"The handsome bare-chested man looks at you with a sly smile and a twinkle in his eyes. His wings extend and his tail dances seductively.",
setup:"The party prepares to fight a coven of night hags and tries to turn their lieutenant, an incubus enslaved by the witches’ magic. Works well as a negotiation during combat with the incubus and the hags’ other minions.",
stages:[{skills:[
K("Arcana","m","Offer legends and ancient text that can weaken the hags’ hold: items that drain magic, or an anti-magic field."),
K("Deception","h","Tell it what it wants to hear: a magic item to break the binding spell, or the chance to lead the hags’ minions."),
K("Insight","e","Notice that direct insults to the hags enrage him but indirect digs amuse him. Only a single success.",{cap:1}),
K("Intimidation","vh","Promise to destroy or re-enslave him if he doesn’t help."),
K("Persuasion","m","The hags are busy with other plots, creating extra work. Removing them frees him.")]}],
out:{total:"The incubus is tired of being enslaved and agrees to help, even finishing his former allies in combat. One less hag in the fight.",ok:"He agrees but requires insurance that they won’t betray him. One less hag in the fight.",fail:"A fight to the death, and the party now faces all three night hags instead of two."}});

C({id:"buried",b:"2",name:"Buried Alive",tags:["survival","combat"],cx:1,scale:"Each round is 1 minute without air.",
fl:"The air is thick, hot and sweaty. Every breath makes you feel you’ll pass out. If you don’t find a way out quickly, you will soon take your last breath.",
setup:"A cave-in or collapsed building traps the party. Debris is piled tight around them and the air is running out. See Suffocating (PHB).",
haz:{n:"No air",nosave:true,t:"Each round is 1 minute with no air to breathe. Every character is suffocating: track it for each character with the Suffocating rules (PHB)."},
stages:[{skills:[
K("Athletics","h","Lift, push and pull heavy rocks to make a path. A failure moves debris that collapses on the party: each character takes moderate damage.",{bad:["text:Debris falls: each character takes moderate damage"]}),
K("Constitution","h","Slow controlled breaths, or holding breath to buy the party extra time.",{ok:["adv:Athletics"]}),
K("Investigation","m","Find the most stable spot or leverage points to clear the rubble safely.",{ok:["adv:Athletics"]}),
K("Medicine","m","Tend unconscious or wounded characters. One character may spend Hit Dice as if on a short rest. A failure heals only as if they rolled a 1.",{bad:["text:Hit Dice heal only as if a 1 were rolled"]})]}],
out:{total:"The characters safely and quickly remove the rubble and can breathe.",ok:"With some trouble they clear the rubble. Each character loses 1d4 Hit Dice.",fail:"With great difficulty they clear the rubble. The job is taxing and each character suffers a level of exhaustion.",failFx:["exhAll:1"]}});

C({id:"thief",b:"2",name:"Catching a Thief",tags:["chase","investigation"],cx:2,scale:"Minutes. Three stages: the brawl, the street, the alley.",
fl:"You’re on a wooden bench at the edge of the tavern. A crash and a blustering insult. A large scarred man screams at a muscular older man. Fists, chairs and tables fly as the room breaks into an all-out bar fight.",
setup:"Thieves start a brawl as a distraction to rob the patrons, including the party. The characters must escape the brawl and capture the culprit. The thief is a spy with the minor illusion cantrip. Stage 1 ends after 2 successes or 2 failures. Stage 2 ends after 2 successes.",
stages:[{n:"Stage 1: The brawl",adv:{s:2,f:2},skills:[
K("Athletics","m","Vault obstacles and bowl through rowdy patrons to close the distance.",{bad:["text:Knocked prone"]}),
K("Acrobatics","m","Dodge and vault across tables to reach a door or window.",{bad:["text:Knocked prone"]}),
K("Intimidation","h","Threats or a show of force to clear a way to an exit.",{bad:["text:Grappled by patrons (Escape DC 17)"]})]},
{n:"Stage 2: The street",adv:{s:2},intro:"Bursting out into a busy street, you can’t see the thief. Scan for clues to find which way they went.",skills:[
K("Investigation","m","Find the path that avoids high-traffic areas."),
K("Insight","m","Read the crowd’s reactions to deduce which way the thief went."),
K("Perception","h","Spot a trail of fresh blood droplets, a hard trail to follow.",{ok:["adv:*"],bad:["dis:*"]})]},
{n:"Stage 3: The alley",intro:"The thief spots you and turns down an alley with a satchel of stolen goods. It’s a dead end. The only ways out are up or back.",skills:[
K("Investigation","h","Notice an out-of-place feature and realize an illusory cover has been placed by magic."),
K("Persuasion","m","Speak calmly and persuade the thief to surrender the goods."),
K("Intimidation","h","Forceful threats: surrender or suffer dire consequences."),
K("Deception","m","False promises of protection or reward instead of punishment.")]}],
out:{total:"The characters catch the thief, dashing through crowds and leaping obstacles with ease.",ok:"They catch the thief with a bit of trouble. The thief will bargain, giving a noble or evil reason for the theft. The DM decides the bargain.",fail:"The thief escapes with the satchel and any goods taken from the characters."}});

C({id:"hungry-dead",b:"2",name:"City of the Hungry Dead",tags:["survival","stealth"],cx:3,group:1,scale:"Each round is one hour. 10 hours until the moon rises.",
fl:"The ancient city winds up a barren mountain. Bone-white buildings glow faintly blue against the dusty slopes. White dust swirls in the air. Slow, hunched ghouls wander every street and alley.",
setup:"The party must defeat the ghouls’ monstrous leader before moonrise (10 hours), when a ritual will make the undead too strong. Each round, every character rolls a group check as directed: if more succeed than fail it’s 1 success, otherwise 1 failure. Each failure triggers a random encounter.",
table:{n:"Random encounter",rows:["2d6 ghasts","2d4 ghouls, vampire spawn (warrior variant)","3 wights","Hazard: brown mold (DMG)","Trap: collapsing roof (DMG)","1d6 ghouls, bone naga"]},
stages:[
{n:"Hours 1–2",skills:[K("Survival","m","Navigate a safe path through the wilderness.",{bad:["text:Each character loses 1d4 Hit Dice"]})]},
{n:"Hour 3",skills:[K("Nature","m","The plant life approaching the city is withered and thorny, and rats and bats circle it.")]},
{n:"Hour 4",skills:[K("Stealth","m","Use cover, illusions or tricks to cross the outer city unseen.",{bad:["dis:Deception"]})]},
{n:"Hour 5",skills:[K("Investigation","m","Use knowledge of city architecture to find the least clustered paths.")]},
{n:"Hour 6",skills:[K("Deception","m","Don ghoulish garments and move past the undead unnoticed.")]},
{n:"Hour 7",skills:[K("Perception","m","Watch for roaming patrols to avoid a battle.")]},
{n:"Hour 8",skills:[K("Intimidation","vh","Threaten the ghouls. They learn about the leader, but only after a fight. Roll on the encounter table.",{ok:["text:Fight first: roll on the encounter table"]})]},
{n:"Hour 9",skills:[K("Investigation","m","Overhear that the ritual is in the Great Hall, and learn where it is.",{ok:["text:Party gains the benefits of a short rest"]})]},
{n:"Hour 10",skills:[K("Stealth","h","Cross the inner city unseen.",{bad:["hd:1"]})]}],
out:{total:"The party avoids conflicts and finds the vampire leader mid-ritual, interrupting it.",ok:"After a few encounters and alerting the guards, they catch the leader mid-ritual and interrupt it. The leader has two vampire spawn, one warrior and one spellcaster.",fail:"The ritual finishes. The leader and two vampire spawn (warrior and spellcaster) all have the Moonlight Night boon: +2 to AC, attack rolls and saving throws for all undead in the city. Fight or flee and tell the patron."}});

C({id:"wards",b:"2",name:"Dismantling the Wards",tags:["magic"],cx:1,scale:"Minutes. An NPC prisoner is inside the circle.",
fl:"Intricate arcane glyphs surround a prisoner, forming a prismatic magical circle. The colors of the barrier ever change, humming with a low resonating power.",
setup:"An NPC of renown is imprisoned in a powerful magic circle. For dispel magic, treat the effect as a 6th-level spell, removing one spell effect at a time. A character with magic circle prepared has advantage on all checks.",
stages:[{skills:[
K("Arcana","m","Study the circle and pull and twist the weave’s threads. A failure surges chaotic magic: lose 1 Hit Die, or a level of exhaustion if none remain.",{bad:["hd:1"]}),
K("Constitution","m","Draw some of the ward’s energy into yourself by touch or with a melee weapon.",{ok:["adv:Arcana","hd:1"],bad:["hd:2"]}),
K("Investigation","m","Find additional glyphs hidden under dirt. Only a single success.",{cap:1,ok:["adv:Arcana"]})]}],
out:{total:"The characters disable the magic circle prison and its warding.",ok:"They disable the circle, but the arcane energy saps their strength. All characters lose 1 Hit Die.",fail:"The wards come down, but a torrent of prismatic energy is released. Each creature within 20 feet must succeed on a Hard Constitution save or suffer a level of exhaustion. The DM decides if the NPC at its center is unconscious, maimed or dead.",okFx:["hdAll:1"]}});

C({id:"dragon",b:"2",name:"Dragon Pass",tags:["social"],cx:3,scale:"Seconds, minutes or hours. Each success the dragon reveals more of its story.",
fl:"The massive and terrifying beast stands before you, its aura dreadful enough to unease you. Seeking passage will be less troublesome, and likely less deadly, if you can parley.",
setup:"The party wants passage through a dragon’s lair. A fight could be deadly, so they parley. Don’t be afraid to make a failure deadly, but ensure the characters can get away.",
stages:[{skills:[
K("Arcana","h","Share lore about items in the dragon’s hoard or its family based on scale color. Only a single success.",{cap:1}),
K("Deception","h","Appeal to its ego: pay respects to the greatest dragon, offer tribute, or spread misinformation on threats.",{bad:["disAll:Deception"]}),
K("History","h","Recall legends or songs about the dragon, playing into its vanity."),
K("Insight","m","Gauge its mood and demeanor from body movement, intonation and facial expression.",{bad:["dis:Persuasion"]}),
K("Intimidation","af","The dragon roars in fury. Automatic failure. Initiate combat if attempted again.",{af:1}),
K("Persuasion","m","Ingratiate with engaging conversation and honest compliments about the dragon, hoard or territory.")]}],
out:{total:"The dragon finds the conversation stimulating and grants passage.",ok:"The characters impress the dragon and get passage, but must first do a favor and return a piece of treasure stolen from its hoard.",fail:"The dragon finds the characters dull, becomes bored and attacks."}});

C({id:"scythes",b:"2",name:"Gauntlet of Pendulum Scythes",tags:["trap","combat"],cx:2,scale:"Combat rounds.",
fl:"Massive scythe-like blades sweep across the room in a seemingly random pattern. Their loud whooshing and cutting fill the chamber with the sound of death.",
setup:"Works well grouped with a combat encounter. A long hallway is full of swinging scythes. A character who disables the trap with thieves’ tools (Hard DC) grants advantage on all remaining checks by slowing the blades. Use the Add advantage button for that.",
stages:[{skills:[
K("Acrobatics","h","A series of tumbles, flips and somersaults to avoid the blades. A failure takes dangerous slashing damage and the character is knocked prone.",{bad:["text:Dangerous-tier slashing damage, knocked prone"]}),
K("Athletics","vh","Pass the blades with pure speed. Speed 80 feet or more has advantage. A failure takes 22 (4d10) slashing damage and is knocked prone.",{bad:["text:22 (4d10) slashing damage, knocked prone"]}),
K("Investigation","e","Identify a hidden panel at the end of the hallway. Thieves’ tools (Hard DC) there slow the blades. Only a single success.",{cap:1}),
K("Perception","m","Watch the blades’ rhythm and help allies down the hall.",{ok:["adv:Acrobatics,Athletics"],bad:["dis:Acrobatics,Athletics"]})]}],
out:{total:"The characters avoid the blades. If the pendulums weren’t disabled yet, the group disables them without a check.",ok:"They duck, dodge and dance around the blades. A few are injured.",fail:"Characters who took damage must succeed on a Hard Constitution save or suffer the effects of Oil of Taggit (DMG) poison."}});

C({id:"underground",b:"2",name:"Going Underground",tags:["chase","social","stealth"],cx:3,scale:"Each character makes one check per hour.",
fl:"Your pursuers fill the city. Escaping will be no easy task. Where do you go? Who do you trust? Is escape even possible? Exits are in lockdown and sentries fill every alley.",
setup:"The party ran afoul of a noble or merchant house that sent assassins or guards. The gates are in lockdown, so they must lie low until the threat passes. Prepare a couple of hard combat encounters beforehand, which represent the enemy closing in on failed checks.",
haz:{n:"Exhausting evasion",stat:"Constitution",dc:"m",t:"At the start of every round each character makes the save.",noExh:1,fail:["hd:1","text:A character who loses their last Hit Die falls behind and is captured."]},
stages:[{skills:[
K("Acrobatics","m","Leap, somersault or cross by clothes line or small beam to throw off pursuers.",{bad:["hd:1"]}),
K("Athletics","m","Climb walls, bull through crowds, leap rooftops or knock over carts."),
K("Deception","h","Steal clothing for a disguise or bluff a local into helping.",{bad:["dis:*","text:A local spots the thief or calls the bluff and shouts for guards"]}),
K("Intimidation","m","Coerce a passerby into helping and misdirecting followers.",{bad:["disAll:Intimidation","text:Passerby shouts to the guards"]}),
K("History","h","Recall a useful route or hiding place."),
K("Perception","e","Spot a patrol, an informant or a good hiding place. Only a single success.",{cap:1}),
K("Persuasion","m","Convince a local to hide the party or give directions. Folk Hero or similar backgrounds automatically succeed."),
K("Stealth","vh","Create a distraction or lead the party past patrols. Grants 2 successes.",{ok:["succ:2"],bad:["text:Spotted and surrounded: Hard combat encounter"]})]}],
out:{total:"The characters thoroughly elude their pursuers. The locals believe they have left the city.",ok:"They elude pursuers, but evidence shows they’re still in the city. The pursuers are on high alert and have advantage on Perception and Insight checks involving the characters.",fail:"Cornered by a powerful group. Surrender or fight."}});

C({id:"gate-of-souls",b:"2",name:"Into the Gate of Souls",tags:["magic","combat"],cx:1,scale:"Movement works as on the Astral Plane: walking speed equals 3 × Intelligence score.",
fl:"A swirling purple light and tearing wind fill the area. An unbearable noise shatters your focus and you can’t see a clear path. You float in this twisting ether, willing yourself to move.",
setup:"The soul gate is a bridge of necrotic magic between two locations for incorporeal creatures, and not meant for the living. Includes combat encounters with incorporeal beings such as specters, will-o’-wisps or wraiths.",
stages:[{skills:[
K("Arcana","m","Glimpse magical understanding in the void: lore of the Astral Plane, or patterns in the weave.",{bad:["text:Wrong path: wander 1 day, no short or long rest possible"]}),
K("Insight","m","Use intuition to navigate: a tug in the gut or a sense of “right”.",{bad:["text:Combat encounter appropriate to party level"]}),
K("Perception","h","Find a path through the turmoil: disruptions in the lights, or where the wind is weakest.",{bad:["text:Combat encounter appropriate to party level"]})]}],
out:{total:"The characters navigate the void with little or no trouble.",ok:"They navigate the gate, but the travel has fatigued them mentally and physically. Each character loses all their Hit Dice.",fail:"They navigate the gate but are fatigued beyond measure. Each character loses all Hit Dice and gains 1 level of exhaustion.",okFx:["hdAll:all"],failFx:["hdAll:all","exhAll:1"]}});

C({id:"vizier",b:"2",name:"King’s Vizier",tags:["social"],cx:2,scale:"A single audience. Works best as group checks.",
fl:"The ornate double doors close behind you with a resounding boom. The grand hall, normally full of the king’s court, is all but empty, including the throne. A jackal-headed being in fine robes stands alongside it.",
setup:"The party seeks an audience with a king or queen. The vizier is an ancient arcanaloth who has advised the ruler’s predecessors for decades and sees the characters as rivals for power. They must convince it they’re no threat.",
stages:[{skills:[
K("Deception","vh","Downplay power, abilities and ambitions through lies and half truths.",{bad:["disAll:Deception"]}),
K("History","h","Tell tales of advisors, traitorous and honorable, who kept their lieges ignorant and suffered disastrous repercussions.",{bad:["dis:History,Persuasion"]}),
K("Investigation","m","Repeat rumors of ambition among other royal advisors, nobles or merchants, who are more of a threat to the vizier."),
K("Persuasion","m","Explain plainly what they can offer the ruler and kingdom: power, prestige, renown."),
K("Religion","m","Share faith stories that the good of the ruler and kingdom influence each other, and ignoring an alliance is risky.")]}],
out:{total:"The arcanaloth allows them to remain and gain an audience.",ok:"They gain an audience, but the arcanaloth requires evidence of other advisors or nobles who threaten its position.",fail:"The arcanaloth allows the audience, but first meets with the ruler and advises them not to trust the characters. Disadvantage on all checks pleading for help."}});

C({id:"madman",b:"2",name:"Knowledge of a Madman",tags:["social"],cx:2,scale:"A delicate conversation of a few minutes.",
fl:"The scarred madman mumbles and trembles from some hidden torture. His eyes constantly dart back and forth, searching for a hidden enemy to come for him.",
setup:"The party needs a specific piece of information from the NPC. Physical aggression removes any chance of learning anything useful. A successful suggestion or similar charm earns 2 successes. If the NPC saves against it, that’s 2 failures.",
quick:[{l:"Charm/suggestion worked (+2 successes)",s:2},{l:"NPC saved vs charm (+2 failures)",f:2}],
stages:[{skills:[
K("Deception","m","Spin an untrue tale: champions of the NPC’s deity, or able to end their suffering."),
K("Insight","e","Realize some rational part of the mind remains. Speak reasonably to it. Only a single success.",{cap:1,ok:["adv:Persuasion"]}),
K("Intimidation","h","Threaten to reveal the NPC’s location to an enemy, or harm something precious.",{bad:["disAll:Persuasion"]}),
K("Persuasion","m","Reason with calming words and promise aid or healing."),
K("Religion","h","Identify the NPC as a cultist of an evil deity such as Vecna or Lolth and offer relief by sharing the burden of dark secrets. Only a single success.",{cap:1,ok:["adv:Deception,Intimidation,Persuasion"]})]}],
out:{total:"The characters break through the madness, giving a few minutes of calm. They can ask up to three questions and get clear answers.",ok:"They break through the madness temporarily and get a single question answered.",fail:"The NPC answers two questions, but one is filled with madness and is inaccurate or false, and the NPC is unaware. This leads to a dead end, an unexpected encounter or a misidentified weakness."}});

C({id:"light",b:"2",name:"Let There Be Light",tags:["magic","combat"],cx:1,scale:"Combat rounds.",
fl:"The statues burst with black magical darkness that swallows all the light from the room’s torches, hiding your enemies. A battle like this will not favor you.",
setup:"Best grouped with a combat or trap encounter. Four statues emulate the darkness spell, extinguishing nonmagical light and light from spells of 2nd level or lower. The enemies don’t suffer blindness (ankhegs, grimlocks, remorhazes). Dispel magic or similar counts as 1 automatic success.",
quick:[{l:"Dispel magic (auto success)",s:1}],
stages:[{skills:[
K("Arcana","h","Bend the weave around a statue to remove the darkness effect. A failure causes arcane backlash: thunderwave at an appropriate level.",{bad:["text:Arcane backlash: thunderwave at an appropriate level"]}),
K("Athletics","vh","Slam or knock over a statue to shatter it and end its effect."),
K("Sleight of Hand","m","Use thieves’ tools to remove or alter glyphs, gems or carvings.",{ok:["adv:Arcana"],bad:["text:Arcane backlash: thunderwave at an appropriate level"]})]}],
out:{total:"The characters remove the magical darkness and level the playing field.",ok:"They remove the darkness, but the sudden light blinds them for an additional round.",fail:"The characters can’t disable the statues and fight blind at a severe disadvantage."}});

C({id:"frost-raiders",b:"2",name:"Locating the Frost Raiders",tags:["survival"],cx:2,scale:"Each round is hours or a day of trekking.",
fl:"The icy breeze chills you to your bones, your body trembling. Your sources say the frost raiders have a hidden hideout in this frozen canyon. You hope to find it soon, or this may be your tomb.",
setup:"The party must find the secret hideout of raiders assaulting and robbing merchants. The local towns are struggling because merchants refuse to visit.",
haz:{n:"Frozen tundra",stat:"Constitution",dc:"m",esc:1,t:"Hiking through freezing temperatures, snow mounds and frigid winds. The DC rises one level every round.",fail:["hd:1"]},
stages:[{skills:[
K("Athletics","m","Push through thick snow, clearing a path, leaping ravines, climbing icy walls."),
K("Acrobatics","m","Guide allies across narrow ledges, ice-coated rivers or a controlled slide down a slope.",{bad:["dis:Hazard"]}),
K("Nature","h","Recognize the terrain and pick the best route, avoiding predators and hazards.",{bad:["dis:Hazard"]}),
K("Perception","e","Watch for landmarks mentioned by a local or on a map. Only a single success.",{cap:1}),
K("Survival","h","Identify fading tracks of a large group, animal-drawn sleds or other raider transport.")]}],
out:{total:"The characters navigate the landscape and locate the raiders’ hidden cavern.",ok:"With some trouble they find the hideout. During the trek a valuable item they carried was lost.",fail:"One level of exhaustion and an ambush by level-appropriate monsters such as ice mephits, polar bears, an abominable yeti or a white dragon. Afterward they must complete another Frost Raiders challenge.",failFx:["exhAll:1"]}});

C({id:"desert",b:"2",name:"Lost in the Desert",tags:["survival"],cx:3,scale:"Each round is hours, days or even weeks.",
fl:"The distortion of heat waves drifts off the land. Sweat drips down your body and the heat makes it difficult to breathe. These hours through the nearly endless desert have you wondering if you can navigate this scorching land.",
setup:"The party must survive the unfamiliar desert until they reach their destination or a settlement. Every round at least one character must make a Nature check.",
haz:{n:"Scorching desert",stat:"Constitution",dc:"m",esc:1,t:"Sweltering heat, sand mounds, lack of food and water. The DC rises one level every round.",fail:["hd:1"]},
stages:[{skills:[
K("History","h","Recall nomad legends of navigating by the sun, moons and stars.",{ok:["adv:Survival"]}),
K("Nature","m","Identify poisonous plants, quicksand and other dangerous terrain. Required each round.",{bad:["hdAll:1"]}),
K("Survival","m","Spot dangerous desert creatures, follow safe tracks, forage for game and water.",{ok:["adv:Hazard"],bad:["hdAll:1","text:The group encounters a wild monster"]})]}],
out:{total:"The characters emerge to a familiar location with resources and out of immediate danger.",ok:"They emerge to a familiar location with resources. Every character loses 1 Hit Die.",fail:"One level of exhaustion and an ambush by monsters such as camels, ankhegs, earth elementals or a blue dragon. Afterward they must complete another Lost in the Desert challenge.",okFx:["hdAll:1"],failFx:["exhAll:1"]}});

C({id:"lost-one",b:"2",name:"Lost One",tags:["social"],cx:1,scale:"A tense conversation at a front door.",
fl:"A young child sits hidden in a dark corner, whimpering with tears running down their face. Their once-delicate clothing is coated in dirt and grime.",
setup:"The party finds a child, lost or taken by kidnappers, who knows their home village and parents. The real challenge is returning them: the child’s been missing for months, the parents assume they’re dead, and they know about illusions and shapechangers. The characters must convince them the child is real and theirs.",
stages:[{skills:[
K("Arcana","m","Offer facts confirming the child isn’t under an illusion or a shapechanger, for example removing an object that would reveal it."),
K("Deception","h","Use lies to thread doubt and guilt about carelessly losing their child."),
K("Insight","m","Read the parents’ body language. They’re suspicious but want to believe. Their fidgeting shows they want to call the guards."),
K("Medicine","m","Offer facts confirming the child isn’t undead, by sprinkling the child with holy water."),
K("Persuasion","m","Use logic and reason to wash away concern. Explain where and how the child was found."),
K("Religion","m","Offer facts confirming the child isn’t undead, by sprinkling holy water.")]}],
out:{total:"The parents’ fears are quelled and they happily accept their child.",ok:"The parents hesitantly accept the child but remain wary and ask the adventurers to investigate who took their child.",fail:"The parents call the child an imposter and fetch the town guards, assuming the characters were behind the disappearance."}});

C({id:"ship",b:"2",name:"Repairing the Ship",tags:["social","survival"],cx:2,scale:"A day or more in port. Two stages.",
fl:"“That nasty storm really did a number on my sweet darlin’, the Swift Star,” sighs the captain. “We gonna need some good materials. My budget is low, materials short, crew injured or ill, and my credit with merchants a bit rocky. But a resourceful group like yourselves can probably come up with somethin’.”",
setup:"The only ship docked is in disrepair and the captain lacks funds or support. He needs lumber, nails and canvas from town merchants. The DM sets prices, large enough to give pause. If they buy without negotiating, they auto-succeed stage 1. Move to stage 2 after 3 successes in stage 1.",
quick:[{l:"Bought without negotiating (stage 1 done)",s:3,stage:1}],
stages:[{n:"Stage 1: Materials",adv:{s:3},skills:[
K("Deception","m","Convince a merchant the crew will soon come into treasure and pay double, or that another merchant promised a lower price.",{bad:["dis:Deception,Persuasion"]}),
K("Investigation","h","Dig up dirt on merchants to blackmail them into a discount.",{bad:["dis:Deception,Persuasion"]}),
K("Persuasion","m","Stress the importance of the voyage, get quotes and promise further business."),
K("Sleight of Hand","h","Steal supplies from a warehouse. A failure means a fine equal to the goods and a month of hard labor.",{bad:["text:Caught: fine equal to the goods’ price and 1 month hard labor"]})]},
{n:"Stage 2: Repairs",skills:[
K("Acrobatics","h","Climb the rigging to replace frayed rope or balance on a beam to repair hull cracks."),
K("Athletics","m","Lift and load lumber or raise the broken mast into place."),
K("Medicine","e","Tend injured crew so they can help: stitches, splints, poultices. Only a single success.",{cap:1,bad:["text:A crew member dies from a medical mishap"]})]}],
out:{total:"They gather supplies quickly and, with the captain’s help, set sail as soon as the tide comes in.",ok:"They make the repairs but the process is slow and they’re delayed. They may arrive too late to save someone, stop a battle or prevent a ritual.",fail:"Very poor repairs and a slow, delayed process. Along the journey the repairs catch up and the ship sinks, gets stranded or must dock halfway."}});

C({id:"twister",b:"2",name:"Through the Twister",tags:["survival","combat"],cx:3,scale:"Combat rounds. A character who leaves cover is deafened until they return.",
fl:"Savage winds batter the village’s small buildings. Roofs, walls and debris sail through the air. From the cellar door you see a middle-aged couple with their young children, trying to reach shelter, their screams lost in the wind.",
setup:"The party shelters from a tornado in a village. They spot innocents in danger. A villager pleads or offers a reward. Once a character leaves cover, they are deafened until they return.",
haz:{n:"Flying debris",stat:"Constitution",dc:"m",esc:1,t:"Debris smashes into characters. The DC rises one level every round.",fail:["text:Takes Dangerous damage (see Rules tab table)"]},
stages:[{skills:[
K("Athletics","vh","Rush through the winds, swatting away debris and leaping obstacles.",{ok:["adv:Hazard"],bad:["dis:Hazard"]}),
K("Acrobatics","h","Leap, slide and flip to avoid flying debris.",{bad:["dis:Hazard"]}),
K("Medicine","e","Tend those wounded by winds and debris. Only a single success.",{cap:1}),
K("Perception","m","Spot cover and guide allies behind carts, buildings and fences. Gains up to 2 successes.",{cap:2,ok:["adv:Athletics"]})]}],
out:{total:"The characters reach the villagers and protect them from flying debris on the way to a building or cellar.",ok:"They reach the villagers, but one has died by the time they arrive.",fail:"They reach the villagers but only one has survived. They escort the survivor to safety, but they are traumatized."}});

/* ---------- CUSTOM CHALLENGES (your own) ---------- */
C({id:"veiled-cave",b:"Custom",name:"The Veiled Cave",tags:["survival","magic","investigation"],cx:2,scale:"Each round is roughly an hour of searching. No short or long rest while inside the Veil’s reach.",
fl:"An ancient ward hides the way into a cave, and it works on attention as much as on sight. The party must reach the right ridge, learn how the ward fools them, and open it before the mountain wears them down.",
setup:"The trail ends where the map says it should, and there is nothing here: a wall of grey rock streaked with old rain, wearing a skin of moss. Somewhere behind it is a cave sealed on purpose, a vault, shrine, bandit hold or lair, whatever your adventure needs. Its keepers sealed it with the Veil, a ward that bends light, sound and the sense of direction. It doesn’t hide the entrance so much as persuade the mind to look elsewhere. To get in, the party must work out where to look, learn how the Veil fools them, and open it. Three stages, 2 successes each. Failures carry over between stages.",
notes:["Spotlight: each stage offers an interaction, a knowledge and a physical option. If a skill is short, call a group check.","Pacing: Stage 1 fits overland travel, Stage 2 a tense arrival, Stage 3 a cliffhanger before the cave itself.","Seed the clues: show the closed-eye sigil earlier in the campaign (a coin, a ruin, a dying cultist’s ring) so the History and Religion successes feel earned.","Reskin: swap the cave for a buried temple door, a fey grove, a goblin warren or a smugglers’ cove.","Arcana in Stage 3: for dispel magic, treat the Veil as a 5th-level spell. Backlash is Moderate force damage.","Religion in Stage 3 has advantage if the History success was earned in Stage 1 (the tracker queues it for you)."],
haz:{n:"The Veil’s Lure",stat:"Wisdom",stageDc:["e","m","h"],t:"The Veil pulls at the mind every round. The save DC is Easy in Stage 1, Moderate in Stage 2 and Hard in Stage 3.",fail:["text:The character chases false paths and phantom openings.","hd:1","text:Optional: if they fail by 5 or more, they see a phantom cave mouth and walk toward it until an ally uses their action and succeeds on an Easy Insight or Persuasion check. Until then they can’t contribute a check."]},
onF:{1:{t:"The mist thickens: every character has disadvantage on their next hazard save. The hazard DC does not change.",e:["dis:Hazard"]},
2:{t:"A warden stirs: a level-appropriate guardian bound to the Veil (a pair of gargoyles, animated armor, an earth elemental) comes to drive off the intruders. Pause the challenge and run a normal combat. No skill checks or hazard saves during it. Resume where it stopped."}},
quick:[
{l:"Find Path (Stage 1: +2 successes)",s:2,st:0,once:1,t:"Leads to the edge of the Veil and no farther."},
{l:"Detect Magic (Stage 2: +1 success)",s:1,st:1,once:1,e:["adv:Arcana"]},
{l:"Speak with Animals (Stage 2: +1 success)",s:1,st:1,once:1,t:"A bat, owl or fox knows exactly where it goes in and out."},
{l:"True Seeing (Stage 2: +2 successes)",s:2,st:1,once:1,e:["adv:Arcana"],t:"The illusion falls away. Also advantage on the first Stage 3 Arcana check."},
{l:"Dispel Magic (Stage 3: +1 success)",s:1,st:2,once:1,t:"Treat the Veil as 5th level. Below 5th level needs an ability check (DC 15). Success earns 1 success, since dispel magic removes only one layer."},
{l:"Passwall (after Stage 2: ends as Success)",done:"ok",min:2,once:1,t:"Tunnel in and skip Stage 3. The Veil notices and the challenge ends as a Success, not a Total Success."}],
stages:[
{n:"Stage 1: The Right Valley",adv:{s:2},intro:"The old directions run out in a valley where every ridge looks like the last. Goal: work out which ridge the cave sits behind. Hazard save: Wisdom, Easy DC.",skills:[
