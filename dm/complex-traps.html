<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Complex Trap Tracker</title>

<style>

:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#f1ece9; --surface:#faf7f5; --surface-2:#e8dfda; --line:#cfc2bb;
  --fg:#241a17; --muted:#65534d;
  --accent:#a8342a; --accent-ink:#ffffff; --accent-soft:#f1d6d1;
  --calm:#17695d; --calm-soft:#d2e8e3;
  --warn:#8f5a0e; --warn-soft:#f3e2c0;
  --crit:#a1302a; --crit-soft:#f3d5d1;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161110; --surface:#1f1816; --surface-2:#2b211f; --line:#43332f;
  --fg:#f0e6e2; --muted:#b5a29b;
  --accent:#ef7a6c; --accent-ink:#2a0c08; --accent-soft:#40201b;
  --calm:#4cc5b2; --calm-soft:#183a34;
  --warn:#e8b155; --warn-soft:#3b2e13; --crit:#f08a7f; --crit-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161110; --surface:#1f1816; --surface-2:#2b211f; --line:#43332f;
  --fg:#f0e6e2; --muted:#b5a29b;
  --accent:#ef7a6c; --accent-ink:#2a0c08; --accent-soft:#40201b;
  --calm:#4cc5b2; --calm-soft:#183a34;
  --warn:#e8b155; --warn-soft:#3b2e13; --crit:#f08a7f; --crit-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.01em}
h2{font-size:21px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
.head{padding-top:8px}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding-block:12px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-weight:600;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:650;border-bottom:2px solid transparent;min-height:38px}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.calm{background:var(--calm);color:var(--bg);border-color:var(--calm)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding-block:10px;margin-bottom:16px}
.strip-in{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.stat{display:grid;gap:2px}
.stat b{font:700 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span.sub{font-size:12px;color:var(--muted)}
.stat .row{display:flex;align-items:center;gap:6px}
.strip .acts{display:flex;gap:8px;margin-left:auto}
.pips{display:flex;gap:6px;margin-top:3px}.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--calm)}.pip.f{background:var(--calm)}
.step{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:17px;font-weight:700;line-height:1}
.step:hover{border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.trap{background:var(--accent-soft);border-color:var(--accent)}
.card.calmc{background:var(--calm-soft);border-color:var(--calm)}
.card h2{margin-block:4px 8px}
.run{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1080px){.run{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.run-main,.run-aside{display:grid;gap:16px;min-width:0;grid-template-columns:minmax(0,1fr)}
.order{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0;list-style:none}
.oc{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;white-space:nowrap}
.oc .i{font:600 12px var(--font-mono);color:var(--muted)}
.oc.trap{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600}
.oc.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.oc.cur .i{color:inherit}
.oc.out{opacity:.5}
.party-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.party-head h2,.party-head h3{margin-right:auto}
.addf{display:flex;gap:8px;flex-wrap:wrap}
.addf input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
.addf #newName{flex:1 1 150px}.addf #newInit{width:80px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(285px,100%),1fr))}
.char{grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.char.is-active{box-shadow:0 0 0 2px var(--accent)}
.char.is-out{opacity:.78}
.ch-head{display:flex;gap:8px;align-items:center}
.ch-head .name{flex:1;min-width:0;border:1px solid transparent;background:transparent;font:650 17px var(--font-display);padding:3px 6px;border-radius:6px}
.ch-head .name:hover,.ch-head .name:focus{border-color:var(--line);background:var(--bg)}
.ch-head .init{width:56px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;text-align:center;font-family:var(--font-mono)}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font:600 12px var(--font-body);background:var(--surface-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.ok{background:var(--calm-soft);color:var(--calm)}
.ch-acts{display:flex;flex-wrap:wrap;gap:6px}
.res{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:8px}
.res:first-of-type{border-top:0;margin-top:0}
.res-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res-top .who{flex:1;min-width:130px}
.res-out{font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px}
.res-out input{width:64px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-family:var(--font-mono);text-align:center}
.res-out .eff{flex-basis:100%}
.remind{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.glance{display:grid;gap:8px;margin:0}
.glance div{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px}
.glance dt{font:600 12px/1.6 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.glance dd{margin:0}
.banner{background:var(--calm-soft);border:1px solid var(--calm);color:var(--calm);border-radius:8px;padding:8px 12px;font-weight:600;margin-top:8px}
.banner.bad{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;max-height:300px;overflow-y:auto;font-size:13px}
.log li{display:flex;gap:8px}
.log .r{font:500 11px/1.9 var(--font-mono);color:var(--muted);min-width:30px}
.note{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:14px}
.ref{max-width:820px;display:grid;gap:22px}
.ref section{display:grid;gap:8px}
.ref h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.ref dl{margin:0;display:grid;gap:8px}
.ref dt{font-weight:650}
.ref dd{margin:0}
.ref ul{margin:0;padding-left:20px;display:grid;gap:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.hl td{background:var(--accent-soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* rules carried over from the Concentrated Magic Zone page */
#hum{display:block;width:100%;height:34px;margin-top:6px}
.btn.bad[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.strip .grow{flex:1;min-width:150px}
.party-head h2{margin-right:auto}
.sat-row{display:flex;align-items:center;gap:10px}
.sat-num{font:700 40px/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:48px;text-align:center}
.meter{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:16px}
.cell{border-radius:3px;background:color-mix(in srgb,var(--zone) 22%,var(--surface-2))}
.cell.on{background:var(--zone)}
.z0{--zone:var(--accent)}.z1{--zone:var(--warn)}.z2{--zone:var(--crit)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 10px var(--font-mono);color:var(--muted);margin-top:-4px}
.mlab span{white-space:nowrap;overflow:hidden}
.muts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mut{display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.mut p+p{margin-top:2px}
.mut-x{color:var(--warn);font-weight:600}
.sup{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.sup li{display:flex;gap:8px;align-items:flex-start}

.picker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{min-width:0}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-trap="gwg"]{--bg:#12150E;--surface:#1A1E14;--surface-2:#242A1B;--line:#38412D;--fg:#E5E9D6;--muted:#A5AF92;--accent:#8FB85A;--accent-ink:#12150E;--accent-soft:#27321B;--calm:#8CC97E;--calm-soft:#1E3019;--warn:#EDAA3A;--warn-soft:#3A2D12;--crit:#EE8062;--crit-soft:#3d1c19}}

.dc{font:600 .88em var(--font-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 .35em;white-space:nowrap}

</style>
<div class="wrap">
  <div id="picker" class="picker"></div>
  <header class="head" id="head"></header>
  <div id="controls"></div>
  <div id="strip"></div>
  <main id="view"></main>
</div>
<script>
(function(){
'use strict';
/* =====================================================================
   COMPLEX TRAP TRACKER: shared shell
   ---------------------------------------------------------------------
   To add a trap, write a module and call core.register({...}) with:
     id, name, eyebrow, tagline          text shown in the header
     group, groupName, variant, variantLabel   optional: modules that share a group appear as ONE trap in the
                                         picker with a variant switch (e.g. Young / Old). Add adopt(state,prev) to
                                         copy the party across when switching variants.
     tierLabel, tiers:[{id,label}]       the tier selector (omit tiers to hide it)
     refLabel                            label for the write-up tab (string or function)
     decor                               optional header html (e.g. a canvas)
     fresh()                             returns a new state object (it must hold .tier)
     bind(state)                         called before every render/action with this trap's state
     actions{name:(id,m,el)=>}           handlers for data-act="name" (use core.commit / core.quick)
     fields{name:(id,value,el)=>}        handlers for data-field="name" change events
     addChar(name,init)                  optional: used by the #addForm party form
     controls()                          optional: extra control html in the controls bar
     strip()                             sticky status strip html
     run()                               Run tab html     ref()  write-up tab html
     after()                             optional: runs after each render
   The shell handles: trap picker, tier, tabs, undo, saving. Colors come from the
   CSS tokens: add  body[data-trap="your-id"]{...}  to give a trap its own accent.
   ===================================================================== */
const KEY='complex-traps-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const traps=[];
let root={v:1,sel:null,tab:'run',data:{},last:{}};
const hist=[];
let headFor=null;
const cur=()=>traps.find(t=>t.id===root.sel)||traps[0];
const gid=t=>t.group||t.id;
const gname=t=>t.groupName||t.name;
const members=t=>traps.filter(x=>gid(x)===gid(t));
function save(){try{localStorage.setItem(KEY,JSON.stringify(root));}catch(e){}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const r=JSON.parse(raw);if(r&&r.v===1&&r.data)root=Object.assign(root,r);}}catch(e){}}
function state(t){
  if(!root.data[t.id])root.data[t.id]=t.fresh();
  const S=root.data[t.id];S.tab=root.tab;return S;
}
function commit(fn){hist.push(JSON.stringify(root));if(hist.length>60)hist.shift();fn();save();render();}
function quick(fn){fn();save();render();}
const core={register:t=>{traps.push(t);},commit,quick,save,canUndo:()=>hist.length>0,start};

function switchTo(t){
  const from=cur();
  commit(()=>{
    if(!root.data[t.id]&&from&&from!==t&&t.adopt&&root.data[from.id]&&Array.isArray(root.data[from.id].chars)){
      const S=t.fresh();t.adopt(S,root.data[from.id]);root.data[t.id]=S;
    }
    root.sel=t.id;root.last[gid(t)]=t.id;
  });
}
const own={
  trap:id=>{
    const ms=traps.filter(t=>gid(t)===id);if(!ms.length)return;
    const t=ms.find(x=>x.id===root.last[id])||ms[0];
    switchTo(t);
  },
  variant:id=>{const t=traps.find(x=>x.id===id);if(t)switchTo(t);},
  tier:id=>quick(()=>{state(cur()).tier=+id;}),
  tab:id=>quick(()=>{root.tab=id;}),
  undo:()=>{const h=hist.pop();if(!h)return;root=JSON.parse(h);save();render();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(own[a]){own[a](b.dataset.id);return;}
  const t=cur(),f=t.actions[a];if(f){t.bind(state(t));f(b.dataset.id,b.dataset.m,b);}
});
document.addEventListener('change',e=>{
  const t=cur(),el=e.target,f=el.dataset&&el.dataset.field;
  if(f&&t.fields&&t.fields[f]){t.bind(state(t));t.fields[f](el.dataset.id,el.value,el);}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm')return;
  e.preventDefault();
  const t=cur();if(!t.addChar)return;
  const n=$('#newName').value.trim(),ie=$('#newInit'),i=ie?ie.value:'',pe=$('#newPP'),pp=pe?pe.value:'';if(!n)return;
  t.bind(state(t));
  commit(()=>{t.addChar(n,i,pp);});
  const nn=$('#newName');if(nn)nn.focus();
});

function renderPicker(){
  const seen=[],groups=[];
  traps.forEach(t=>{if(seen.indexOf(gid(t))<0){seen.push(gid(t));groups.push(t);}});
  const key=t=>gname(t).replace(/^The /,'');groups.sort((a,b)=>key(a).localeCompare(key(b)));
  $('#picker').innerHTML='<label class="lbl" for="trapSel">Trap</label><select id="trapSel" class="trapsel" aria-label="Choose a trap">'+
    groups.map(t=>'<option value="'+esc(gid(t))+'"'+(gid(t)===gid(cur())?' selected':'')+'>'+esc(gname(t))+'</option>').join('')+'</select>';
}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='trapSel')own.trap(e.target.value);});
function renderHead(t){
  if(headFor===t.id)return;headFor=t.id;
  $('#head').innerHTML='<p class="eyebrow">'+esc(t.eyebrow)+'</p><h1>'+esc(gname(t))+'</h1><p class="muted" style="margin-top:4px">'+esc(t.tagline)+'</p>'+(t.decor||'');
}
function renderControls(t,S){
  const tiers=t.tiers&&t.tiers.length?'<div class="ctl"><span class="lbl">'+esc(t.tierLabel||'Tier')+'</span><div class="seg" role="group" aria-label="Tier">'+
    t.tiers.map(x=>'<button data-act="tier" data-id="'+x.id+'" aria-pressed="'+(S.tier===x.id)+'">'+esc(x.label)+'</button>').join('')+'</div></div>':'';
  const ms=members(t);
  const vars=ms.length>1?'<div class="ctl"><span class="lbl">Zone</span><div class="seg" role="group" aria-label="Variant">'+ms.map(x=>'<button data-act="variant" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===t.id)+'">'+esc(x.variantLabel||x.name)+'</button>').join('')+'</div></div>':'';
  $('#controls').innerHTML='<div class="controls">'+vars+tiers+(t.controls?t.controls():'')+
    '<div class="tabs" role="group" aria-label="View"><button data-act="tab" data-id="run" aria-pressed="'+(root.tab==='run')+'">Run</button><button data-act="tab" data-id="ref" aria-pressed="'+(root.tab==='ref')+'">'+esc((typeof t.refLabel==='function'?t.refLabel():t.refLabel)||'Trap text')+'</button></div></div>';
}
function render(){
  const t=cur();root.sel=t.id;
  const S=state(t);t.bind(S);
  document.body.dataset.trap=t.id;
  const ae=document.activeElement;let sel=null;
  if(ae&&ae.dataset&&(ae.dataset.act||ae.dataset.field)){
    const d=ae.dataset;
    sel=(d.field?'[data-field="'+d.field+'"]':'[data-act="'+d.act+'"]')+(d.id!==undefined?'[data-id="'+d.id+'"]':'')+(d.m?'[data-m="'+d.m+'"]':'')+(d.kind?'[data-kind="'+d.kind+'"]':'');
  }
  const y=window.scrollY;
  renderPicker();renderHead(t);renderControls(t,S);
  $('#strip').innerHTML=t.strip();
  $('#view').innerHTML=root.tab==='ref'?t.ref():t.run();
  window.scrollTo(0,y);
  if(sel){const n=document.querySelector(sel);if(n&&n.focus)n.focus({preventScroll:true});}
  if(t.after)t.after();
}
function start(){load();if(!root.last)root.last={};if(!root.sel||!traps.some(x=>x.id===root.sel))root.sel=traps[0].id;render();}
window.core=core;
})();

core.register((function(){
let state;
const commit=core.commit,quick=core.quick,save=core.save;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>1+Math.floor(Math.random()*n);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const rollD=(n,d)=>{let t=0;for(let i=0;i<n;i++)t+=rnd(d);return t;};
const avg=(n,d)=>Math.floor(n*(d+1)/2);

const TIERS={
1:{lv:'Level 1–4',r:30,pn:1,bn:2,on:1,od:6,sn:1,sd:6,cap:5,reach:0,push:10,xp:'650'},
2:{lv:'Level 5–10',r:40,pn:2,bn:5,on:1,od:10,sn:1,sd:10,cap:5,reach:0,push:10,xp:'3,850'},
3:{lv:'Level 11–16',r:50,pn:5,bn:9,on:2,od:10,sn:2,sd:10,cap:6,reach:10,push:10,xp:'11,100'},
4:{lv:'Level 17–20',r:60,pn:9,bn:12,on:5,od:10,sn:5,sd:10,cap:7,reach:15,push:15,xp:'21,500'}};

function surge(i,tier){const v=tier===4;return [null,
 {n:'Fire Burst',a:(v?20:15)+' ft radius sphere centered on the rift',sv:'Dex',ty:'fire',ef:''},
 {n:'Lightning Chain',a:(v?'1d4+1':'1d4')+' random creatures in the zone',sv:'Dex',ty:'lightning',ef:''},
 {n:'Frost Wave',a:'All creatures in the zone',sv:'Con',ty:'cold',ef:v?'Fail: speed 0 until the end of their next turn.':'Fail: speed halved until the end of their next turn.'},
 {n:'Crushing Force',a:'A random creature + all within '+(v?15:10)+' ft of it',sv:'Str',ty:'force',ef:'Fail: knocked prone.'},
 {n:'Necrotic Touch',a:'A random creature',sv:'Con',ty:'necrotic',ef:'Fail: hit point maximum reduced by the damage taken until a short or long rest.'},
 {n:'Radiant Beam',a:'All creatures in the zone',sv:'Con',ty:'radiant',ef:v?'Fail: blinded for 1 full round.':'Fail: blinded until the end of their next turn.'},
 {n:'Thunder Wave',a:'All creatures in the zone',sv:'Con',ty:'thunder',ef:'Fail: deafened for '+(v?'10 minutes':'1 minute')+' and pushed '+(v?15:10)+' ft away from the rift.'},
 {n:'Chaotic Swap',a:'All creatures in the zone',sv:'Wis',ty:'',ef:'No damage. Each creature that fails swaps places with another creature that failed, chosen at random.'}][i];}

/* ---------- State ---------- */
const mk=(id,name,init,marked)=>({id,name,init,marked:!!marked,inZone:true,att:false});
const fresh=()=>({v:2,tier:1,tab:'run',round:0,key:null,P:0,pl:0,calm:false,ward:null,nid:5,example:true,
  chars:[mk('c1','Aria',21,true),mk('c2','Borin',15),mk('c3','Cael',12),mk('c4','Dree',8)],
  res:{},pend:[],log:[]});
const TI=()=>TIERS[state.tier];
const get=id=>state.chars.find(c=>c.id===id);
function L(t){state.log.unshift({r:state.round,t});if(state.log.length>120)state.log.pop();}

/* ---------- Derived values (mechanics) ---------- */
function D(){const k=TI(),x=Math.floor(state.P/2);
  return {x,radius:k.r+5*state.P,dcb:Math.min(state.P,k.cap),pn:k.pn+x,bn:k.bn+x,
    rupt:state.tier===4&&state.P>=10&&!state.calm};}
const ready=()=>state.pl>=3&&state.chars.some(c=>c.marked)&&!state.calm;
function addP(why){state.P++;L('Provocation #'+state.P+' ('+why+'): radius '+D().radius+' ft.');}
function selfSurge(who,why){
  const k=TI(),i=rnd(8),dmg=i===8?0:rollD(k.sn,k.sd);
  state.pend.push({id:'p'+(state.nid++),who,why,i,dmg});
  L(who+' suffers a self-surge: '+surge(i,state.tier).n+(dmg?' ('+dmg+' damage on a failed save)':'')+'.');
}

/* ---------- Turn order ---------- */
function buildOrder(){
  const cs=state.chars.map((c,i)=>({c,i})).sort((a,b)=>(num(b.c.init)-num(a.c.init))||(a.i-b.i));
  const traps=[{k:'burst',v:20},{k:'core',v:10},{k:'mark',v:5}];
  const out=[];let t=0;
  for(const {c} of cs){const n=num(c.init);
    while(t<3&&n<traps[t].v){out.push({k:traps[t].k,trap:true});t++;}
    out.push({k:'c:'+c.id,id:c.id});}
  while(t<3){out.push({k:traps[t].k,trap:true});t++;}
  return out;
}
const skipStep=s=>s.trap&&(state.calm||(s.k==='mark'&&!ready()));
function stepLabel(s){
  if(s.k==='burst')return 'Chaos Burst';
  if(s.k==='core')return 'Core Pulse';
  if(s.k==='mark')return 'The Mark Reacts';
  const c=get(s.id);return c?c.name:'?';
}
function goTo(step){
  state.key=step.k;
  if(step.id&&state.ward&&state.ward.by===step.id){state.ward=null;L('Collective Warding ends.');}
}
function nextStep(){
  commit(()=>{
    const order=buildOrder();
    let idx=state.round===0?-1:order.findIndex(s=>s.k===state.key);
    if(state.round===0){state.round=1;L('Round 1 begins.');}
    for(let guard=0;guard<order.length+2;guard++){
      idx++;
      if(idx>=order.length){idx=0;state.round++;state.chars.forEach(c=>{c.att=false;});}
      if(!skipStep(order[idx])){goTo(order[idx]);return;}
    }
    state.key=null;
  });
}

/* ---------- Actions ---------- */
const actions={
  next:()=>nextStep(),
  endEnc:()=>commit(()=>{state.round=0;state.key=null;state.res={};state.pend=[];L('Encounter ended.');}),
  pp:()=>commit(()=>{addP('manual');}),
  pm:()=>commit(()=>{if(state.P>0){state.P--;L('Provocation −1 (now '+state.P+').');}}),
  dispel:()=>commit(()=>{if(state.P>0){state.P--;L('Dispel Magic: Provocation undone, radius '+D().radius+' ft.');}else L('Dispel Magic: no Provocation to undo.');}),
  psuc:id=>commit(()=>{const c=get(id);if(c)c.att=true;if(state.pl<3&&!state.calm){state.pl++;L((c?c.name+': ':'')+'Placation success ('+state.pl+'/3).');if(state.pl===3)L(ready()?'Ready: the mark will react at Initiative 5.':'3 successes, but no marked PC: the zone cannot be calmed.');}}),
  pfail:id=>commit(()=>{const c=get(id);if(c)c.att=true;addP('failed Placation');selfSurge(c?c.name:'Placer','failed Placation');}),
  plminus:()=>commit(()=>{if(state.pl>0)state.pl--;}),
  cast:id=>commit(()=>{
    const c=get(id);if(!c)return;const r=rnd(20);
    if(r<=5){addP('spell, d20='+r);selfSurge(c.name,'spell (d20='+r+')');L(c.name+' casts a spell: d20='+r+', Wild Surge.');}
    else L(c.name+' casts a spell: d20='+r+', no surge.');
    state.res['spell:'+id]=r;
  }),
  ward:id=>commit(()=>{state.ward={by:id};const c=get(id);L('Collective Warding succeeded'+(c?' ('+c.name+')':'')+'.');}),
  wardoff:()=>commit(()=>{state.ward=null;}),
  zone:id=>commit(()=>{const c=get(id);c.inZone=!c.inZone;L(c.name+(c.inZone?' enters':' leaves')+' the zone.');}),
  marked:id=>commit(()=>{const c=get(id);c.marked=!c.marked;}),
  remove:id=>commit(()=>{state.chars=state.chars.filter(c=>c.id!==id);if(state.ward&&state.ward.by===id)state.ward=null;}),
  burst:i=>commit(()=>{const d=D();const n=+i||rnd(8);state.res[state.round+':burst']={i:n,dmg:n===8?0:rollD(d.bn,10)};L('Chaos Burst: '+surge(n,state.tier).n+'.');}),
  burstDmg:()=>quick(()=>{const r=state.res[state.round+':burst'];if(r&&r.i!==8)r.dmg=rollD(D().bn,10);}),
  pi:id=>quick(()=>{state.res[state.round+':pi:'+id]=rollD(D().pn,10);}),
  core:()=>quick(()=>{const k=TI();state.res[state.round+':core']=rollD(k.on,k.od);}),
  msuc:()=>commit(()=>{state.calm=true;state.key=null;L('The mark succeeded: the zone is inert for 24 hours.');}),
  mfail:()=>commit(()=>{state.pl=0;const i=rnd(8);state.res[state.round+':mark']={i,dmg:i===8?0:rollD(D().bn,10)};L('The mark failed: extra Chaos Burst on the marked creature, Placation resets to 0.');}),
  calmOff:()=>commit(()=>{state.calm=false;state.pl=0;L('The zone is active again.');}),
  rollPend:id=>quick(()=>{const p=state.pend.find(x=>x.id===id);if(p&&p.i!==8){const k=TI();p.dmg=rollD(k.sn,k.sd);}}),
  donePend:id=>quick(()=>{state.pend=state.pend.filter(x=>x.id!==id);}),
  clearParty:()=>commit(()=>{state.chars=[];state.example=false;state.round=0;state.key=null;state.ward=null;state.res={};}),
  dismiss:()=>quick(()=>{state.example=false;}),
  clearLog:()=>quick(()=>{state.log=[];})
};
const fields={
  name:(id,v)=>quick(()=>{const c=get(id);if(c)c.name=v.trim()||c.name;}),
  init:(id,v)=>quick(()=>{const c=get(id);if(c)c.init=v===''?'':num(v);})
};

/* ---------- Run view ---------- */
const dice=(n,d)=>'<b>'+n+'d'+d+'</b> <span class="muted">(avg '+avg(n,d)+')</span>';
function surgeBlock(i,dc,dmg,who){
  const g=surge(i,state.tier);
  return '<div><span class="chip">d8 = '+i+'</span> <b>'+g.n+'</b>'+(who?' <span class="muted">· '+esc(who)+'</span>':'')+'</div>'+
    '<div>'+g.a+'</div>'+
    '<div><b>'+g.sv+' save DC '+dc+'</b>'+(i===8?' · no damage':' · <b class="mono">'+dmg+'</b> '+g.ty+' damage, half on a success')+'</div>'+
    (g.ef?'<div class="muted">'+g.ef+'</div>':'');
}
function chipsFor(c){
  const o=[];
  if(c.marked)o.push('<span class="chip warn">Marked</span>');
  if(c.att)o.push('<span class="chip ok">Placated this round</span>');
  if(!c.inZone)o.push('<span class="chip">Outside zone</span>');
  return o.join('');
}
function charCard(c){
  const active=state.key==='c:'+c.id,sp=state.res['spell:'+c.id];
  return '<article class="char'+(active?' is-active':'')+(c.inZone?'':' is-out')+'">'+
   '<div class="ch-head"><input class="name" data-field="name" data-id="'+c.id+'" value="'+esc(c.name)+'" aria-label="Name"><input class="init" type="number" inputmode="numeric" data-field="init" data-id="'+c.id+'" value="'+esc(c.init)+'" placeholder="Init" aria-label="Initiative"><button class="x" data-act="remove" data-id="'+c.id+'" aria-label="Remove '+esc(c.name)+'">×</button></div>'+
   '<div class="chips">'+chipsFor(c)+'</div>'+
   '<div class="ch-acts"><button class="btn sm calm" data-act="psuc" data-id="'+c.id+'"'+(state.pl>=3||state.calm?' disabled':'')+'>Placation ✔</button>'+
   '<button class="btn sm primary" data-act="pfail" data-id="'+c.id+'"'+(state.calm?' disabled':'')+'>Placation ✘</button>'+
   '<button class="btn sm" data-act="cast" data-id="'+c.id+'">Cast spell (d20)</button>'+
   '<button class="btn sm" data-act="ward" data-id="'+c.id+'" aria-pressed="'+!!(state.ward&&state.ward.by===c.id)+'">Warding ✔</button></div>'+
   (sp?'<p class="muted" style="font-size:13px">Last spell roll: d20 = '+sp+(sp<=5?' (surge)':'')+'</p>':'')+
   '<div class="ch-acts"><button class="btn sm" data-act="zone" data-id="'+c.id+'" aria-pressed="'+c.inZone+'">'+(c.inZone?'In zone':'Outside zone')+'</button>'+
   '<button class="btn sm" data-act="marked" data-id="'+c.id+'" aria-pressed="'+c.marked+'">'+(c.marked?'Marked':'Not marked')+'</button></div></article>';
}
function partyCard(){
  return '<section><div class="party-head"><h2>Party</h2><button class="btn sm" data-act="clearParty">Clear party</button></div>'+
   '<p class="muted" style="margin:4px 0 10px">Set initiative once. Placation buttons record the attempt, the shared counter, and any Provocation and self-surge for you.</p>'+
   (state.example?'<div class="note" style="margin-bottom:10px">Example party. Rename them, or clear the party and add your own. <button class="btn sm" data-act="dismiss">Dismiss</button></div>':'')+
   '<form id="addForm" class="addf" style="margin-bottom:12px"><input id="newName" placeholder="Character name" aria-label="New character name" autocomplete="off"><input id="newInit" type="number" inputmode="numeric" placeholder="Init" aria-label="New character initiative"><button class="btn primary" type="submit">Add</button></form>'+
   '<div class="grid">'+state.chars.map(charCard).join('')+'</div>'+(state.chars.length?'':'<p class="muted">No characters yet.</p>')+'</section>';
}
function orderCard(order){
  return '<section><h2 style="margin-bottom:8px">Turn order</h2><ol class="order">'+order.map(s=>{
    const c=s.id?get(s.id):null;
    const i=s.k==='burst'?20:s.k==='core'?10:s.k==='mark'?5:(c&&c.init!==''?c.init:'–');
    const dim=(s.trap&&skipStep(s))||(c&&!c.inZone);
    return '<li class="oc'+(s.trap?' trap':'')+(state.key===s.k&&state.round>0?' cur':'')+(dim?' out':'')+'"><span class="i">'+i+'</span><span>'+esc(stepLabel(s))+'</span></li>';
  }).join('')+'</ol></section>';
}
function endBtn(){return state.round>0?'<p style="margin-top:12px"><button class="btn sm" data-act="endEnc">End encounter</button> <span class="muted">Resets the round counter. Provocations and Placation stay.</span></p>':'';}
function pendCard(){
  if(!state.pend.length)return '';
  const k=TI();
  return '<section class="card trap"><p class="eyebrow">Self-surge</p><h2>To resolve</h2>'+state.pend.map(p=>
    '<div class="res"><div class="res-top"><div class="who"><b>'+esc(p.who)+'</b> <span class="muted">· '+esc(p.why)+'</span></div><button class="btn sm" data-act="rollPend" data-id="'+p.id+'">Reroll damage</button><button class="btn sm" data-act="donePend" data-id="'+p.id+'">Resolved</button></div>'+
    '<div class="res-out" style="display:grid">'+surgeBlock(p.i,10,p.dmg,'only this creature · '+k.sn+'d'+k.sd)+'</div></div>').join('')+'</section>';
}
function calmCard(){
  return '<section class="card calmc"><p class="eyebrow">Calmed</p><h2>The zone is inert</h2><p>For 24 hours nothing happens here. No active elements, no Pulsing Instability.'+(state.tier===4?' Reality Rupture is reset.':'')+'</p><p style="margin-top:10px"><button class="btn sm" data-act="calmOff">Reactivate zone</button></p></section>';
}
function burstCard(){
  const d=D(),k=TI(),r=state.res[state.round+':burst'];
  let h='<section class="card trap"><p class="eyebrow">Round '+state.round+' · Initiative 20</p><h2>Chaos Burst</h2><p>DC '+(20+d.dcb)+' · '+dice(d.bn,10)+'. Roll a d8 for the type and targets.'+(k.reach?' Also hits creatures up to '+k.reach+' ft <b>outside</b> the zone.':'')+'</p>'+
   '<p style="margin-top:10px" class="ch-acts"><button class="btn primary" data-act="burst" data-id="0">'+(r?'Re-roll d8':'Roll d8')+'</button> <span class="muted" style="align-self:center">or pick:</span>'+
   [1,2,3,4,5,6,7,8].map(i=>'<button class="btn sm" data-act="burst" data-id="'+i+'">'+i+'</button>').join('')+'</p>';
  if(r)h+='<div class="res"><div class="res-out" style="display:grid">'+surgeBlock(r.i,20+d.dcb,r.dmg,'')+'</div>'+(r.i!==8?'<div><button class="btn sm" data-act="burstDmg">Reroll damage</button></div>':'')+'</div>';
  return h+endBtn()+'</section>';
}
function coreCard(){
  const k=TI(),r=state.res[state.round+':core'];
  return '<section class="card trap"><p class="eyebrow">Round '+state.round+' · Initiative 10</p><h2>Core Pulse</h2><p>Every creature in the zone: <b>Str save DC 10</b>. On a failure it is pushed <b>'+k.push+' ft</b> away from the rift and knocked prone. If it hits an obstacle: +'+dice(k.on,k.od)+' bludgeoning damage.</p>'+
   '<p style="margin-top:10px" class="ch-acts"><button class="btn sm" data-act="core">Roll obstacle damage</button>'+(r!==undefined?'<b class="mono" style="align-self:center">= '+r+'</b>':'')+'</p>'+endBtn()+'</section>';
}
function markCard(){
  const d=D(),r=state.res[state.round+':mark'];
  let h='<section class="card trap"><p class="eyebrow">Round '+state.round+' · Initiative 5</p><h2>The Mark Reacts</h2><p>The marked creature rolls <b>Cha (Arcana) DC 15</b> automatically. It is not a conscious act.</p>'+
   '<p style="margin-top:10px" class="ch-acts"><button class="btn calm" data-act="msuc">Success: zone inert 24 h</button><button class="btn primary" data-act="mfail">Failure</button></p>';
  if(r)h+='<div class="res"><div class="res-out" style="display:grid"><div class="muted">Extra Chaos Burst on the <b>marked creature only</b>. Placation reset to 0.</div>'+surgeBlock(r.i,20+d.dcb,r.dmg,'marked creature')+'</div></div>';
  return h+endBtn()+'</section>';
}
function turnCard(c){
  const d=D(),k=TI(),v=state.res[state.round+':pi:'+c.id];
  let h='<section class="card now"><p class="eyebrow">Round '+state.round+' · Turn</p><h2>'+esc(c.name)+'</h2>';
  if(c.inZone)h+='<div class="remind"><span><b>Pulsing Instability:</b> Con save DC '+(15+d.dcb)+', '+d.pn+'d10 force, half on a success.</span><button class="btn sm" data-act="pi" data-id="'+c.id+'">Roll damage</button>'+(v!==undefined?'<b class="mono">= '+v+'</b>':'')+'</div>';
  else h+='<p class="muted">Outside the zone. No Pulsing Instability.</p>';
  h+='<p class="muted" style="margin-top:8px">Warped Space: difficult terrain. A spell of level 1+ cast here: roll d20, 1–5 means a Wild Surge on the caster only.</p>'+
   '<div class="chips" style="margin-top:8px">'+chipsFor(c)+'</div>'+
   '<div class="ch-acts" style="margin-top:12px"><button class="btn calm" data-act="psuc" data-id="'+c.id+'"'+(state.pl>=3?' disabled':'')+'>Placation ✔</button><button class="btn primary" data-act="pfail" data-id="'+c.id+'">Placation ✘</button><button class="btn" data-act="cast" data-id="'+c.id+'">Cast spell (d20)</button><button class="btn" data-act="ward" data-id="'+c.id+'">Warding ✔</button></div>';
  return h+endBtn()+'</section>';
}
function nowCard(){
  if(state.round===0)return '<section class="card now"><p class="eyebrow">Ready</p><h2>Set up, then press Start</h2><p class="muted">Enter each character\'s initiative, mark who carries the mark, and whether they are in the zone. The zone acts at Initiative 20 (Chaos Burst) and 10 (Core Pulse), and at 5 only when the mark is ready to react. Pulsing Instability is shown at the start of each turn.</p></section>';
  if(state.calm)return calmCard();
  if(state.key==='burst')return burstCard();
  if(state.key==='core')return coreCard();
  if(state.key==='mark')return markCard();
  const c=state.key&&state.key.indexOf('c:')===0?get(state.key.slice(2)):null;
  if(!c)return '<section class="card now"><p class="eyebrow">Round '+state.round+'</p><h2>Press Next to continue</h2>'+endBtn()+'</section>';
  return turnCard(c);
}
function glance(){
  const k=TI(),d=D();
  return '<section class="card"><h3 style="margin-bottom:10px">Rules at a glance</h3><dl class="glance">'+
   '<div><dt>Constant</dt><dd>Pulsing Instability: Con DC '+(15+d.dcb)+', '+d.pn+'d10 force, half on a success. At the start of a turn in the zone, or on entering.</dd></div>'+
   '<div><dt>Init 20</dt><dd>Chaos Burst: DC '+(20+d.dcb)+', '+d.bn+'d10. d8 sets the type.</dd></div>'+
   '<div><dt>Init 10</dt><dd>Core Pulse: Str DC 10 or pushed '+k.push+' ft and prone.</dd></div>'+
   '<div><dt>Init 5</dt><dd>The mark reacts only after 3 Placation successes. Cha (Arcana) DC 15.</dd></div>'+
   '<div><dt>Placation</dt><dd>Action, one attempt per creature per round, DC 15. Failure: no progress, +1 Provocation, self-surge (DC 10, '+k.sn+'d'+k.sd+').</dd></div>'+
   '<div><dt>Provocation</dt><dd>+5 ft radius, +1 DC (cap +'+k.cap+'), +1 die every 2.</dd></div>'+
   '<div><dt>Warding</dt><dd>Int (Arcana) DC 18. Advantage on saves vs Pulsing Instability and Chaos Burst for everyone until the caster\'s next turn.</dd></div>'+
   '<div><dt>Dispel</dt><dd>DC 18. Undoes the latest Provocation. Does not calm the zone.</dd></div></dl></section>';
}
function identCard(){
  return '<section class="card"><h3 style="margin-bottom:10px">Identification</h3><dl class="glance">'+
   '<div><dt>Passive Perc.</dt><dd>DC 15. The zone is visible and can be heard pulsing.</dd></div>'+
   '<div><dt>Investigation</dt><dd>DC 15. Beat it by 5+: a faint symbol at the center pulsing in rhythm with something or someone.</dd></div>'+
   '<div><dt>Arcana</dt><dd>DC 10. A brand-new, extremely unstable rift. No anchors, guardians, or known method to close it.</dd></div>'+
   '<div><dt>Arcana / Nature</dt><dd>DC 15. It can be attuned to with calm, targeted actions (Placation). Spells inside cause surges and grow the zone.</dd></div></dl></section>';
}
function logCard(){
  return '<section class="card"><div class="party-head"><h3>Log</h3>'+(state.log.length?'<button class="btn sm" data-act="clearLog">Clear</button>':'')+'</div>'+
   (state.log.length?'<ul class="log">'+state.log.slice(0,60).map(e=>'<li><span class="r">R'+e.r+'</span><span>'+esc(e.t)+'</span></li>').join('')+'</ul>':'<p class="muted" style="margin-top:6px">Events appear here as you play.</p>')+'</section>';
}
function viewRun(){
  const order=buildOrder();
  return '<div class="run"><div class="run-main">'+pendCard()+nowCard()+orderCard(order)+partyCard()+'</div><aside class="run-aside">'+glance()+identCard()+logCard()+'</aside></div>';
}

/* ---------- Reference view ---------- */
function viewRef(){
  const k=TI(),cur=D();
  let rows='';
  for(let p=0;p<=k.cap*2+2;p++){
    const x=Math.floor(p/2),dc=Math.min(p,k.cap);
    rows+='<tr'+(p===state.P?' class="hl"':'')+'><td class="mono">'+p+'</td><td class="mono">'+(k.r+5*p)+' ft</td><td class="mono">+'+dc+'</td><td class="mono">'+(k.pn+x)+'d10</td><td class="mono">'+(k.bn+x)+'d10</td></tr>';
  }
  const sr=[1,2,3,4,5,6,7,8].map(i=>{const g=surge(i,state.tier);return '<tr><td class="mono">'+i+'</td><td><b>'+g.n+'</b></td><td>'+g.a+'</td><td>'+g.sv+(g.ty?' · '+g.ty:'')+(g.ef?'<br><span class="muted">'+g.ef+'</span>':'')+'</td></tr>';}).join('');
  return '<article class="ref">'+
  '<section><p>A brand-new rift in the weave: raw, wild magic that has just torn open and does not yet know what it is. It is far wilder than an old, settled zone, and for the same reason it can still be soothed. Nobody holds it and nothing anchors it. Creatures caught in it will simply try to survive, or to calm it down.</p></section>'+
  '<section><h3>Using in an adventure</h3><p>This is a first-time event for the party, so no prior knowledge is assumed. The zone <b>reacts</b> like a combatant, acting at Initiative 20, 10 and 5. The way out is not brute force: the party must <b>Placate</b> it with calm, targeted skill checks and avoid provoking it. After three Placation successes, the mark on one PC reacts on its own with a Charisma (Arcana) check. This is a story element: with <b>no marked PC, the zone cannot be calmed</b>.</p>'+
  '<p>Escalation is driven by <b>Provocations</b>, not rounds: each failed Placation and each Wild Surge from a spell makes the zone grow. Standing still is not what hurts the party. Panicking is.</p></section>'+
  '<section><h3>Trigger</h3><p>The trap activates when any creature enters the <b>'+k.r+'-foot-radius zone</b> (this grows with Provocations) and stays active while any creature remains in it.</p></section>'+
  '<section><h3>Identification</h3><dl>'+
   '<div><dt>Passive Perception / Perception DC 15</dt><dd>The zone is visible and can be heard pulsing.</dd></div>'+
   '<div><dt>Investigation DC 15</dt><dd>Beating it by 5 or more reveals a faint symbol at the center of the zone pulsing in rhythm with something or someone.</dd></div>'+
   '<div><dt>Arcana DC 10</dt><dd>It is a brand-new, extremely unstable rift. There are no anchors, guardians, or known method to close it.</dd></div>'+
   '<div><dt>Arcana or Nature DC 15</dt><dd>You work out that it can be attuned to with calm, targeted actions instead of provoking it (Placation), and that casting spells inside can cause a Wild Surge and make the zone grow and strengthen. Avoid it.</dd></div></dl></section>'+
  '<section><h3>Constant elements</h3><dl>'+
   '<div><dt>Pulsing Instability</dt><dd>At the start of a creature\'s turn in the zone, or when it enters, it makes a Constitution save (DC '+(15+cur.dcb)+' now, base 15) or takes '+cur.pn+'d10 force damage (base '+k.pn+'d10); half on a success.</dd></div>'+
   '<div><dt>Warped Space</dt><dd>The zone is difficult terrain. When a creature casts a spell of level 1+ inside it, it rolls a d20: on 1–5 a Wild Surge hits <b>the caster only</b> (Moderate damage, DC 10, '+k.sn+'d'+k.sd+'), and it counts as a Provocation.</dd></div></dl></section>'+
  '<section><h3>Active elements</h3><dl>'+
   '<div><dt>Initiative 20 · Chaos Burst</dt><dd>Roll a d8 on the surge table below. The save type depends on the result. Base DC 20, base damage '+k.bn+'d10; half on a success.'+(k.reach?' It also hits creatures up to '+k.reach+' ft beyond the zone.':'')+'</dd></div>'+
   '<div><dt>Initiative 10 · Core Pulse</dt><dd>Each creature in the zone makes a Strength save, DC 10, or is pushed '+k.push+' ft from the rift and knocked prone. A creature that hits an obstacle takes an extra '+k.on+'d'+k.od+' bludgeoning damage.</dd></div>'+
   '<div><dt>Initiative 5 · The Mark Reacts</dt><dd>Only after <b>3 Placation successes</b>, and only if a marked PC is present. The mark rolls Charisma (Arcana) DC 15 automatically. Success: the zone is inert for 24 hours'+(state.tier===4?' and the Reality Rupture counter resets':'')+'. Failure: an extra Chaos Burst hits the marked creature only, and the Placation counter resets to 0.</dd></div></dl></section>'+
  '<section><h3>Dynamic elements</h3><dl>'+
   '<div><dt>Placation</dt><dd>As an action, any creature can attempt DC 15 Intelligence (Arcana), Wisdom (Insight), Wisdom (Religion) or Charisma (Performance). One attempt per creature per round. Success adds to the shared counter (3 needed). Failure: no progress, +1 Provocation, and the creature suffers a self-surge (DC 10, '+k.sn+'d'+k.sd+', half on a success).</dd></div>'+
   '<div><dt>Provocation</dt><dd>Each Provocation (failed Placation or spell Wild Surge) grows the zone by 5 ft and raises the DC of Pulsing Instability and Chaos Burst by 1 (up to +'+k.cap+'). Every 10 ft of growth (every 2 Provocations) adds 1 die of the same type to both damages.</dd></div>'+
   (state.tier===4?'<div><dt>Reality Rupture</dt><dd>At 50+ ft of total growth (10+ Provocations) without calming: each creature in the zone makes a Wisdom save, DC 20, or is sent to a hostile demiplane for 1d4 rounds.</dd></div>':'')+'</dl></section>'+
  '<section><h3>Countermeasures</h3><dl>'+
   '<div><dt>Collective Warding</dt><dd>One creature makes an Intelligence (Arcana) check, DC 18. On a failure nothing happens and there is no Provocation. On a success every creature in the zone has advantage on saves against Pulsing Instability and Chaos Burst until the start of the caster\'s next turn.</dd></div>'+
   '<div><dt>Dispel Magic</dt><dd>DC 18. Undoes the most recent Provocation (−5 ft, −1 DC, and the extra die if it came with it) but does not calm the zone.</dd></div></dl></section>'+
  '<section><h3>Wild Surge table (d8)</h3><div class="tw"><table><tr><th>d8</th><th>Surge</th><th>Targets</th><th>Save</th></tr>'+sr+'</table></div></section>'+
  '<section><h3>Escalation by Provocations</h3><div class="tw"><table><tr><th>Provocations</th><th>Radius</th><th>DC bonus</th><th>Pulsing Instability</th><th>Chaos Burst</th></tr>'+rows+'</table></div><p class="muted">The highlighted row is the current state.</p></section>'+
  '<section><h3>Reward</h3><p>'+k.xp+' XP for handling the trap ('+k.lv+').</p></section></article>';
}


function strip(){
  const d=D(),k=TI();

  if(!o)out.push({k:'overflow'});

}

function goTo(step){

function leaveStep(){

  }

function nextStep(){

    leaveStep();
    const idx=order.findIndex(s=>s.k===state.key);
    if(idx<order.length-1){goTo(order[idx+1]);return;}
    state.round++;
    state.chars.forEach(c=>{if(c.ward>0)c.ward--;});
    if(state.round===4||state.round===7)L('Deepening Concentration: Surge threshold is now Saturation ≥ '+threshold(state.round)+'.');

}

/* ---------- Rendering: run view ---------- */
function chipsFor(c,th){

function charCard(c,th){

function partyCard(th){

function orderCard(order){

function endBtn(){return state.round>0?'<p style="margin-top:12px"><button class="btn sm" data-act="endEnc">End encounter</button> <span class="muted">Resets the round counter. Saturation and mutations stay.</span></p>':'';}

     '<button class="btn sm bad" data-act="fail" data-id="'+c.id+'" aria-pressed="'+!!(r&&r.fail)+'">Failed save</button><button class="btn sm" data-act="save" data-id="'+c.id+'" aria-pressed="'+!!(r&&r.fail===false)+'">Saved</button></div>';

        '<span>Mutation d10 <input type="number" min="1" max="10" data-field="d10" data-id="'+c.id+'" value="'+r.d10+'" aria-label="d10 roll"> + '+r.bonus+' = <b>'+r.total+'</b></span>'+

function nowCard(th){

   '<div><dt>Surge · 20</dt><dd>Saturation ≥ '+th+(nd?' (drops at round '+nd+')':' (minimum)')+'. DC 15 Con or '+T.surge.a+' ('+T.surge.d+') force, then mutation.</dd></div>'+
   '<div><dt>Overflow · 10</dt><dd>Saturation ≥ 6. '+T.over.a+' ('+T.over.d+') force, no save.</dd></div>'+

function identCard(){

  return '<section class="card"><h3 style="margin-bottom:10px">Identification</h3><dl class="glance">'+
   '<div><dt>Passive Perc.</dt><dd>DC '+d.pp+'. A steady hum felt in teeth and skin.</dd></div>'+
   '<div><dt>Perception</dt><dd>DC '+d.pe+'. Pinpoint where the hum is loudest.</dd></div>'+

function suppressCard(){
  if(state.age==='old')return '<section class="card"><h3>Old zone</h3><p class="muted" style="margin-top:6px">It has fully stabilized. Nothing can suppress it. Avoid it, insulate against it, or endure it.</p></section>';
  const st=[['Arcana','Trace where the concentration is thickest and study how it still gathers.'],['Investigation or Arcana','Identify a counter-resonance that interrupts its formation.'],['Arcana','Impose the counter-resonance.']];
  return '<section class="card"><h3>Suppress a young zone</h3><p class="muted" style="margin:6px 0">Three checks in order, DC 15 each. No two attempted by the same creature in a row. After a success, nobody attempts the next step until the start of that character\'s next turn.</p><ol class="sup">'+
   st.map((s,i)=>'<li><button class="btn sm" data-act="supstep" data-id="'+i+'" aria-pressed="'+state.sup[i]+'"'+(i>0&&!state.sup[i-1]&&!state.sup[i]?' disabled':'')+'>'+(state.sup[i]?'Done':'Mark')+'</button><span><b>'+s[0]+'.</b> '+s[1]+'</span></li>').join('')+'</ol>'+
   (state.suppressed?'<div class="banner">Suppressed. Effects stop now, but the zone reconverges within weeks or months. Nothing known closes it for good.</div><p style="margin-top:8px"><button class="btn sm" data-act="reconv">Zone reconverges</button></p>':'')+'</section>';
}
function logCard(){

}
function viewRun(){
  const th=threshold(Math.max(1,state.round)),order=buildOrder();

/* ---------- Rendering: reference, controls, strip ---------- */
function viewRef(){
  const T=TI(),d=T.dc;
  const rows=T.mut.map((m,i)=>'<tr><td class="mono">'+(i+1)+'</td><td><b>'+esc(m.name)+'</b></td><td>'+esc(m.text)+'</td><td>'+esc(cureText(m,i+1))+'</td></tr>').join('');
  return '<article class="ref">'+
  '<section><p>There\'s nothing to see. The air is just thicker here: warm, humming faintly in the teeth and skin rather than the ears, a patch of reality where ambient magic has pooled deeper than the world can comfortably hold. No crystal, no shrine, no altar. Just a hum, and the knowledge that a body can only take so much of it before it starts to change.</p></section>'+
  '<section><h3>Using in an adventure</h3><p>This isn\'t a device or a monument. It\'s a raw patch of reality where magic has settled thicker than usual, marked only by a heavy hum and warped life nearby. Decide early whether your zone is <b>young</b> or <b>old</b>. A young zone (days to months old) is still coalescing and can be temporarily suppressed by determined characters, though never closed for good, since no known method does that. An old zone (years or longer) has fully stabilized; it is now as permanent a feature of the world as a hot spring, and it can\'t even be suppressed. Old zones make excellent recurring hazards or terrain obstacles the party learns to route around. Young zones make good set-piece encounters that can be pushed back for now, but may reconverge later to threaten a place or people the party cares about.</p>'+
  '<p>Spellcasters who linger near it find their magic measurably stronger, which is exactly the lure that keeps characters standing in the danger zone a round too long. '+esc(T.tail)+'</p></section>'+
  '<section><h3>Trigger</h3><p>The trap activates the instant any creature enters the <b>'+T.r+'-foot-radius zone</b>, and remains active for as long as any creature remains inside it.</p></section>'+
  '<section><h3>Identification</h3><dl>'+
   '<div><dt>Passive Perception DC '+d.pp+'</dt><dd>A low, steady hum fills the air, felt in the teeth and skin as much as heard.</dd></div>'+
   '<div><dt>Perception DC '+d.pe+'</dt><dd>By tracking the hum, pinpoint the exact spot where it is loudest, the effective center of the zone, though there\'s nothing there to see.</dd></div>'+
   '<div><dt>Nature DC '+d.na+'</dt><dd>Notice nearby plant or animal life that is subtly warped (extra growth, strange coloration, fused limbs) frozen mid-transformation. This is a clue to the mutation risk.</dd></div>'+
   '<div><dt>Arcana DC '+d.ar+'</dt><dd>Determine that this is a stable, continuously replenishing convergence of ambient magic. It will not attack, but it steadily saturates anyone who stays too long. Succeeding by 5 or more also reveals whether the convergence is newly formed or long settled, and that spells cast within the zone draw on its power and are measurably empowered as a result.</dd></div></dl></section>'+
  '<section><h3>Constant elements</h3><dl>'+
   '<div><dt>Ambient Saturation</dt><dd>At the start of each of its turns while in the zone, a creature gains <b>1 point of Saturation</b>. This is a running total tracked per creature. No save; the exposure is constant and unavoidable while standing in the field.</dd></div>'+
   '<div><dt>Empowered Casting</dt><dd>Whenever a creature casts a spell using a spell slot while in the zone, treat it as though cast using a slot <b>two levels higher</b> (maximum 9th level) for any level-based scaling the spell has, such as extra damage dice or additional targets. This costs the caster nothing extra in spell slots. The spell\'s save DC also increases by <b>2</b>. However, the caster gains <b>2 points of Saturation</b> that turn instead of 1. A cantrip gains the +2 to its save DC but not the upcasting effect, since it isn\'t cast with a slot.</dd></div></dl></section>'+
  '<section><h3>Active elements</h3><dl>'+
   '<div><dt>Saturation Surge (Initiative 20)</dt><dd>Every creature in the zone with Saturation 3 or higher (see Deepening Concentration) must succeed on a <b>DC 15 Constitution saving throw</b> or take <b>'+T.surge.a+' ('+T.surge.d+') force damage</b>, then roll on the Mutation Table. On a success, the creature takes no damage and does not roll for mutation.</dd></div>'+
   '<div><dt>Overflow (Initiative 10)</dt><dd>Any creature with Saturation 6 or higher takes <b>'+T.over.a+' ('+T.over.d+') force damage</b>, no save.</dd></div></dl></section>'+
  '<section><h3>Dynamic elements</h3><dl>'+
   '<div><dt>Deepening Concentration</dt><dd>Starting on round 4, and every 3 rounds after (rounds 4, 7, 10…), the Saturation threshold for Saturation Surge decreases by 1 (minimum 1). The threshold is 3 on rounds 1–3, 2 on rounds 4–6, and 1 from round 7.</dd></div>'+
   '<div><dt>Mutation Severity</dt><dd>Roll a d10 and add the creature\'s current Saturation divided by 3 (round down). A total above 10 is treated as 10.</dd></div></dl>'+
   '<div class="tw"><table><thead><tr><th>Roll</th><th>Mutation</th><th>Effect</th><th>Ends or cure</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+(T.sev?'<p class="muted">'+esc(T.sev)+'</p>':'')+'</section>'+
  '<section><h3>Countermeasures</h3><dl>'+
   '<div><dt>Step back</dt><dd>Leaving the zone stops further Saturation gain immediately, though existing Saturation remains.</dd></div>'+
   '<div><dt>Recover</dt><dd>A creature loses 1 point of Saturation for each short rest taken outside the zone, or loses all Saturation upon finishing a long rest outside the zone.</dd></div>'+
   '<div><dt>Arcane Insulation</dt><dd>As an action, a character can attempt a DC 15 Arcana check to weave a temporary personal ward. Success prevents that creature from gaining Saturation for 1 minute, even while inside the zone.</dd></div>'+
   '<div><dt>Mutation effects</dt><dd>'+esc(T.fix)+'</dd></div>'+
   '<div><dt>Suppress a young zone</dt><dd>If the zone is newly formed (days to months old, DM\'s discretion), it can be held back, though not closed. This takes a series of three actions (DC 15), no two attempted by the same creature in succession. Once a character succeeds, no one may attempt the next step until the start of that character\'s next turn: (1) Arcana to trace where the concentration is thickest; (2) Investigation or Arcana to identify a counter-resonance; (3) Arcana to impose it. Completing all three ends the trap\'s effects immediately, but the zone slowly reconverges over weeks or months and becomes active again. As far as anyone has discovered, no known way exists to permanently close a concentrated magic zone, young or old.</dd></div>'+
   '<div><dt>Old zones</dt><dd>A zone that has existed for years or more cannot even be suppressed. It is as permanent as a hot spring. The only options are avoidance, insulation, and enduring it.</dd></div></dl></section>'+
  '<section><p class="muted">Complex trap XP award (if overcome or survived): <b>'+T.xp+' XP</b>. Save DCs and attack bonuses stay at the Dangerous values (DC 15) at every tier; only damage and zone size scale.</p></section></article>';
}
function viewStrip(){
  if(state.tab!=='run')return '';

  return '<div class="strip"><div class="strip-in" aria-live="polite"><div class="stat"><span class="lbl">Round</span><b>'+(state.round||'–')+'</b></div>'+
   '<div class="stat"><span class="lbl">Surge at Saturation</span><b>≥ '+th+'</b><span class="sub">'+(nd?'drops at round '+nd:'at its minimum')+'</span></div>'+
   '<div class="stat grow"><span class="lbl">Now</span><b style="font-size:20px">'+esc(now)+'</b><span class="sub">Zone radius '+TI().r+' ft</span></div>'+
   '<div class="acts"><button class="btn" data-act="undo"'+(core.canUndo()?'':' disabled')+'>Undo</button><button class="btn primary" data-act="next">'+esc(nxt)+'</button></div></div></div>';
}
function addChar(n,i){state.chars.push(mk('c'+(state.nid++),n,i===''?'':num(i)));state.example=false;}
function controls(){return '<div class="ctl"><span class="lbl">Zone</span><div class="seg" role="group" aria-label="Zone age"><button data-act="age" data-id="young" aria-pressed="'+(state.age==='young')+'">Young</button><button data-act="age" data-id="old" aria-pressed="'+(state.age==='old')+'">Old</button></div></div>';}
/* hum canvas */
let cv=null,cx=null,W=0,H=0,dpr=1,amp=3,tgt=3,running=false;
const rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function humSize(){if(!cv)return;dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);}
function humTarget(){const m=state.suppressed?0:state.chars.reduce((a,c)=>c.inZone?Math.max(a,c.sat):a,0);tgt=3+Math.min(11,m*1.3);if(rm){amp=tgt;humDraw(0);}}
function humDraw(t){
  if(!cx||!W)return;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  const col=getComputedStyle(document.body).getPropertyValue('--accent').trim()||'#17695d';
  cx.strokeStyle=col;cx.lineWidth=1.5;
  for(let k=0;k<3;k++){cx.globalAlpha=1-k*0.3;cx.beginPath();
    for(let x=0;x<=W;x+=3){const env=Math.sin(Math.PI*x/W);const y=H/2+Math.sin(x/(34+k*16)+t*0.0014*(1+k*0.4)+k*1.7)*amp*(1-k*0.25)*env;x?cx.lineTo(x,y):cx.moveTo(x,y);}
    cx.stroke();}
  cx.globalAlpha=1;
}
function humLoop(t){if(!cv||!cv.isConnected||document.hidden){running=false;return;}amp+=(tgt-amp)*0.04;humDraw(t);requestAnimationFrame(humLoop);}
function kick(){if(!rm&&!running&&cv&&cv.isConnected){running=true;requestAnimationFrame(humLoop);}}
function after(){cv=document.getElementById('hum');cx=cv&&cv.getContext?cv.getContext('2d'):null;if(!cv)return;humSize();humTarget();kick();}
window.addEventListener('resize',()=>{humSize();if(rm)humDraw(0);});
document.addEventListener('visibilitychange',kick);
return {id:'cmz',name:'Concentrated Magic Zone',eyebrow:'Complex trap · Dangerous · Magical',tagline:'A patch of reality where ambient magic has pooled too deep.',
  tierLabel:'Party level',tiers:[1,2,3,4].map(n=>({id:n,label:TIERS[n].short})),refLabel:'Trap text',
  decor:'<canvas id="hum" aria-hidden="true"></canvas>',
  fresh,bind:s=>{state=s;},actions,fields,addChar,controls,strip:viewStrip,run:viewRun,ref:viewRef,after};
})());

core.register((function(){
let state;
const commit=core.commit,quick=core.quick;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>1+Math.floor(Math.random()*n);

/* ---------- Data ---------- */
// flow = Tide hits ONE creature, flood = hits ALL; obst = Wild Gust obstacle damage; back = Backlash (self-surge)
const TIERS={
1:{lv:'Level 1–4',short:'1–4',r:60,flow:2,flood:1,obst:[1,6],back:[1,6],push:10,xp:'650',dc:{pp:13,pe:13,na:12,ar:12}},
2:{lv:'Level 5–10',short:'5–10',r:80,flow:5,flood:3,obst:[1,10],back:[1,10],push:10,xp:'3,850',dc:{pp:15,pe:15,na:14,ar:14}},
3:{lv:'Level 11–16',short:'11–16',r:100,flow:9,flood:5,obst:[2,10],back:[2,10],push:10,xp:'11,100',dc:{pp:17,pe:17,na:16,ar:16}},
4:{lv:'Level 17–20',short:'17–20',r:120,flow:12,flood:8,obst:[5,10],back:[5,10],push:15,xp:'21,500',dc:{pp:19,pe:19,na:18,ar:18}}};
const DIRS=['North','North-east','East','South-east','South','South-west','West','North-west'];
function surge(i,tier){const v=tier===4;return [null,
 {n:'Fire',sv:'Dex',ty:'fire',ef:'Flammable objects the creature carries or stands on ignite.'},
 {n:'Lightning',sv:'Dex',ty:'lightning',ef:'Fail: no reactions until the start of its next turn.'},
 {n:'Cold',sv:'Con',ty:'cold',ef:'Fail: speed halved until the end of its next turn.'},
 {n:'Force',sv:'Str',ty:'force',ef:'Fail: pushed '+(v?15:10)+' ft in a random direction and knocked prone.'},
 {n:'Necrotic',sv:'Con',ty:'necrotic',ef:'Fail: hit point maximum reduced by the damage taken until a short or long rest.'},
 {n:'Radiant',sv:'Con',ty:'radiant',ef:'Fail: blinded until the end of its next turn.'},
 {n:'Thunder',sv:'Con',ty:'thunder',ef:'Fail: deafened for '+(v?'10 minutes':'1 minute')+'.'},
 {n:'Psychic',sv:'Wis',ty:'psychic',ef:'Fail: disadvantage on attack rolls until the end of its next turn.'}][i];}

/* ---------- State ---------- */
const mk=(id,name,init)=>({id,name,init,att:0,inZone:true,brace:false});
const fresh=()=>({v:1,tier:1,round:0,key:null,feed:0,last:null,example:true,nid:5,
  chars:[mk('c1','Aria',21),mk('c2','Borin',15),mk('c3','Cael',12),mk('c4','Dree',8)],res:{},pend:[],log:[]});
const TI=()=>TIERS[state.tier];
const get=id=>state.chars.find(c=>c.id===id);
function L(t){state.log.unshift({r:state.round,t});if(state.log.length>120)state.log.pop();}
const inZone=()=>state.chars.filter(c=>c.inZone);

/* ---------- Rules ---------- */
function tideKind(total){return total<=2?'ebb':total<=4?'flow':'flood';}
function rollTide(force){
  const k=TI(),roll=rnd(6),total=roll+state.feed;
  const kind=force||tideKind(total);
  const r={roll,feed:state.feed,total,kind,forced:!!force};
  if(kind!=='ebb'){
    const n=kind==='flow'?k.flow:k.flood;

  }
  state.res[state.round+':tide']=r;
  L('Tide: '+(force?'set to ':'d6 '+roll+(state.feed?' + Feed '+state.feed:'')+' = '+total+' → ')+kind.toUpperCase()+(r.type?' ('+surge(r.type,state.tier).n+', '+r.dmg+' damage)':'')+'.');

}
function mods(c){return {adv:c.att>=1||c.brace,res:c.att>=2,imm:c.att>=3};}
function outcome(c,D){
  const m=mods(c);

function modChips(c){

}
function backlash(who,why){
  const k=TI(),i=rnd(8);

}
function buildOrder(){
  const cs=state.chars.map((c,i)=>({c,i})).sort((a,b)=>(num(b.c.init)-num(a.c.init))||(a.i-b.i));
  const traps=[{k:'tide',v:20},{k:'gust',v:10}];
  const out=[];let t=0;
  for(const {c} of cs){const n=num(c.init);
    while(t<2&&n<traps[t].v){out.push({k:traps[t].k,trap:true});t++;}
    out.push({k:'c:'+c.id,id:c.id});}
  while(t<2){out.push({k:traps[t].k,trap:true});t++;}
  return out;
}
const stepLabel=s=>s.k==='tide'?'The Tide':s.k==='gust'?'Wild Gust':(get(s.id)||{name:'?'}).name;
function goTo(step){state.key=step.k;if(step.id){const c=get(step.id);if(c&&c.brace){c.brace=false;}}}
function nextStep(){
  commit(()=>{

const actions={

  tideDmg:()=>quick(()=>{const r=state.res[state.round+':tide'];if(r&&r.dice)r.dmg=rollD(r.dice,10);}),
  tideType:()=>quick(()=>{const r=state.res[state.round+':tide'];if(r&&r.dice)r.type=rnd(8);}),
  tideTarget:()=>quick(()=>{const r=state.res[state.round+':tide'];if(r&&r.kind==='flow'){const z=inZone();if(z.length)r.targets=[z[rnd(z.length)-1].id];}}),
  gust:()=>commit(()=>{state.res[state.round+':gust']=Object.assign(state.res[state.round+':gust']||{},{dir:rnd(8)});L('Wild Gust blows '+DIRS[state.res[state.round+':gust'].dir-1].toLowerCase()+'.');}),
  gustObst:()=>quick(()=>{const k=TI();state.res[state.round+':gust']=Object.assign(state.res[state.round+':gust']||{},{obst:rollD(k.obst[0],k.obst[1])});}),
  asuc:id=>commit(()=>{const c=get(id);if(!c)return;c.att=Math.min(3,c.att+1);L(c.name+' attunes (level '+c.att+').');}),
  afail:id=>commit(()=>{const c=get(id);if(!c)return;backlash(c.name,'failed attunement');}),

  zone:id=>commit(()=>{const c=get(id);c.inZone=!c.inZone;if(!c.inZone){c.att=0;c.brace=false;}L(c.name+(c.inZone?' enters':' leaves (Attunement lost)')+(c.inZone?' the zone.':'.'));}),
  remove:id=>commit(()=>{state.chars=state.chars.filter(c=>c.id!==id);}),
  rollPend:id=>quick(()=>{const p=state.pend.find(x=>x.id===id),k=TI();if(p)p.dmg=rollD(k.back[0],k.back[1]);}),

  clearParty:()=>commit(()=>{state.chars=[];state.example=false;state.round=0;state.key=null;state.res={};state.pend=[];}),

};

  '<section><p>A region where wild magic settled long ago and never left. It is not a wound or a breach: it is weather. Slow swells roll across the ground, the air shimmers and tastes of metal, and every so often the whole field exhales. There is no source to find, no caster to stop, and no door to close. The zone is simply part of the world now, and the only question is how to cross it.</p></section>'+
  '<section><h3>Using in an adventure</h3><p>Use it as a lasting hazard the party must cross, camp beside, or route around. It rewards preparation more than brute force. It cannot be closed, dispelled or suppressed, so do not offer the party a puzzle that ends it. What they can do is <b>resist</b> it: attune to its rhythm, brace against it, shorten their stay, and keep their casting to a minimum, because every spell cast in the zone feeds the next Tide.</p>'+
  '<p>It pairs well with a goal on the far side, a faction that has learned to live with it, or a guide who knows its seasons. It is the old form of the Wild Magic Zone: a brand-new rift can still be soothed, but this one never will be.</p></section>'+
  '<section><h3>Trigger</h3><p>The trap activates when any creature enters the <b>'+k.r+'-foot-radius zone</b>. It stays active whether or not anyone is inside, but only creatures inside are affected.</p></section>'+
  '<section><h3>Identification</h3><dl>'+
   '<div><dt>Passive Perception DC '+d.pp+'</dt><dd>The air shimmers like heat over stone. Hair lifts, and the ground hums in slow swells.</dd></div>'+
   '<div><dt>Investigation DC '+d.pe+'</dt><dd>The effects are not random noise. They come in waves: quiet stretches, then single strikes, then surges that reach everyone at once.</dd></div>'+
   '<div><dt>Nature DC '+d.na+'</dt><dd>Plants and animals nearby have adapted to the zone. Animals shelter or flee just before the strongest waves.</dd></div>'+
   '<div><dt>Arcana DC '+d.ar+'</dt><dd>This is an ancient, fully settled concentration of wild magic. It has no source, no caster, and no known way to close or dispel it. Beating the DC by 5 or more also reveals that spells cast inside feed the zone, and that calm, practiced attunement lets a creature resist it.</dd></div></dl></section>'+
  '<section><h3>Constant elements</h3><dl>'+
   '<div><dt>Feeding</dt><dd>Each time a creature in the zone casts a spell of level 1 or higher, the zone is fed: Feed increases by 1 (it resets after each Tide). The caster rolls a d20. On 1–5 the spell still resolves, but Backlash hits the caster. Whatever the roll, the caster also loses 1 level of Attunement. Cantrips do not feed the zone and do not trigger Backlash.</dd></div>'+
   '<div><dt>Backlash</dt><dd>Roll a d8 on the surge table. Only the affected creature is hit: save DC 10 of the listed type, '+k.back[0]+'d'+k.back[1]+' damage (avg '+avg(k.back[0],k.back[1])+'), half on a success. Riders apply on a failed save.</dd></div></dl></section>'+
  '<section><h3>Active elements</h3><dl>'+
   '<div><dt>Initiative 20 · The Tide</dt><dd>Roll a d6 and add the zone\'s Feed. <b>1–2 Ebb:</b> nothing happens. <b>3–4 Flow:</b> one random creature in the zone is hit. <b>5 or more Flood:</b> every creature in the zone is hit. Roll a d8 for the type. Each hit creature makes the listed save, DC 15, taking '+k.flow+'d10 (Flow, avg '+avg(k.flow,10)+') or '+k.flood+'d10 (Flood, avg '+avg(k.flood,10)+') damage, half on a success. Roll damage once per Tide. Riders apply to creatures that fail.</dd></div>'+
   '<div><dt>Initiative 10 · Wild Gust</dt><dd>Roll a d8 for the direction (1 north, then clockwise). Each creature in the zone makes a Strength save, DC 10, or is pushed '+k.push+' ft in that direction and knocked prone. A creature that hits an obstacle takes '+k.obst[0]+'d'+k.obst[1]+' bludgeoning damage (avg '+avg(k.obst[0],k.obst[1])+').</dd></div></dl></section>'+

   '<div><dt>Attunement</dt><dd>As an action, a creature in the zone can attempt DC 15 Intelligence (Arcana), Wisdom (Nature) or Wisdom (Survival). Success raises its Attunement by 1, to a maximum of 3. Failure: no progress, and Backlash hits the creature. Attunement ends when the creature leaves the zone.</dd></div>'+
   '<div><dt>Attunement 1</dt><dd>Advantage on saves against the Tide and the Wild Gust.</dd></div>'+
   '<div><dt>Attunement 2</dt><dd>Also resistance to damage from the Tide.</dd></div>'+

  '<section><h3>Countermeasures</h3><dl>'+
   '<div><dt>Brace</dt><dd>A creature that takes the Dodge action has advantage on saves against the Tide and the Wild Gust until the start of its next turn. It does not stack with Attunement advantage.</dd></div>'+

   '<div><dt>No way to close it</dt><dd>The zone cannot be closed, suppressed or dispelled. Dispel Magic and similar effects have nothing to target. The only options are avoiding it, resisting it, and crossing it quickly.</dd></div></dl></section>'+

}
