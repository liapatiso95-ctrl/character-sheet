/* ───────────── Data ─────────────
   Rebalanced as a DEADLY complex trap per the Level and Lethality rules: saves DC 20 and attacks +12 at every tier,
   damage dice scaled by the Dangerous column of the Damage Severity table (x0.2 / x0.4 / x1 / x1.8 from the tier-3 base).
   Check DCs (identification, countermeasures) keep the older tier shift so each party level can interact with the trap. */
const TI={
 1:{lvl:'1–4',sh:-5,f:.2,scAC:14,scHP:25,chAC:11,chHP:20,orAC:13,orHP:30,sp:3,xp:'650'},
 2:{lvl:'5–10',sh:-3,f:.4,scAC:15,scHP:40,chAC:12,chHP:35,orAC:14,orHP:50,sp:4,xp:'3,850'},
 3:{lvl:'11–16',sh:0,f:1,scAC:17,scHP:60,chAC:13,chHP:60,orAC:15,orHP:80,sp:5,xp:'11,100'},
 4:{lvl:'17–20',sh:2,f:1.8,scAC:19,scHP:100,chAC:14,chHP:100,orAC:17,orHP:130,sp:7,xp:'21,500'}};
const T=()=>TI[S.tier];
const DX=n=>n+T().sh;                    // shift a tier-3 DC to this tier
const SCN=n=>Math.max(1,Math.round(n*T().f));
const D=(n,d)=>[SCN(n),d];               // scaled damage dice
const avgOf=o=>avg(o[0],o[1]);
const dcc=n=>`<span class="dc">DC&nbsp;${n}</span>`;
const dd=(o,l)=>`<button type="button" class="dice" data-act="roll" data-dice="${o[0]}d${o[1]}" data-label="${esc(l)}">${avgOf(o)}&nbsp;(${o[0]}d${o[1]})</button>`;
const at=(n,l)=>`<button type="button" class="dice" data-act="roll" data-atk="${n}" data-label="${esc(l)}">+${n}</button>`;
function V(){ // every number the trap uses at the current tier
 const t=T();
 const DCV=S.tier===1?16:20;
 return {dc:DCV,atk:S.tier===1?9:12,
  cold:D(2,6),chP:D(5,6),chC:S.tier===2?[2,6]:D(3,6),blS:S.tier===2?[2,8]:D(2,10),blC:D(2,6),grap:D(2,6),crP:D(4,6),crC:D(2,6),win:S.tier===2?[2,6]:D(3,6),chord:D(8,6),fall:D(3,6),ctrl:D(10,6),
  scAC:t.scAC,scHP:t.scHP,chAC:t.chAC,chHP:t.chHP,orAC:t.orAC,orHP:t.orHP,dispel:10+t.sp,sp:t.sp,
  br:{find:DX(18),light:DX(15)},ch:{pred:DX(22),sec:DX(20),sp5:10+t.sp},sc:{mark:DX(20)},og:{chk:DX(18),play:DX(20)},sd:{loc:DX(20),open:DX(18),lad:DX(15),stand:DX(15),idc:DX(16),crys:DX(20),back:DCV},
  id:{pp:DX(15),p1:DX(17),p2:DX(20),inv:DX(18),arc:DX(18),nat:DX(17)}};
}
const CH=['West','Center','East'];
const ORG=['Fugue of Confusion','Crescendo of Ice','Dirge of Lethargy','Chord of Shattering','Waltz of Winter','Symphony of Souls'];

/* ───────────── State ───────────── */
const mk=(id,name,init,pp)=>({id,name,init:init===''||init==null?'':num(init),pp:pp===''||pp==null?null:Math.max(0,Math.min(40,parseInt(pp,10)||0)),inRoom:true,prot:0,heal:false,brazier:false,grap:false,restr:false,fails:0,sculpt:false});
const def=()=>({tier:3,phase:'setup',round:1,key:null,party:[],nid:1,revealed:{},chand:['ok','ok','ok'],scAct:0,scX:0,scDead:0,scPrev:0,animUntil:0,
  organ:{checks:[false,false,false],dead:false,played:false},braz:[false,false,false,false],sealed:false,shutSteps:[false,false,false],crystals:0,shut:false,res:{},done:{},last:null,log:[]});
const pcOf=id=>S.party.find(x=>String(x.id)===String(id));
function L(t){S.log.unshift({r:S.round,t});if(S.log.length>80)S.log.pop();}
const run=()=>S.phase==='run';
const act=()=>S.scAct+S.scX;
function petri(c){ // a petrified creature becomes one more active sculpture (outside the 12)
 if(c.fails>=3&&!c.sculpt){c.sculpt=true;S.scX++;L(c.name+' is petrified and animates as a new sculpture ('+act()+' active).');}
 else if(c.fails<3&&c.sculpt){c.sculpt=false;S.scX=Math.max(0,S.scX-1);}
}
const pool=()=>Math.max(0,12-S.scAct-S.scDead-S.scPrev);
const chandOK=()=>[0,1,2].filter(i=>S.chand[i]==='ok');
const lit=()=>S.braz.filter(Boolean).length;
const organOff=()=>S.organ.dead||S.organ.checks.every(Boolean);
const inRoom=()=>S.party.filter(c=>c.inRoom);
const names=a=>a.length?a.map(p=>esc(p.name)).join(', '):'';

/* which trap steps act this round (rules unchanged) */
function active(step){
 if(S.shut)return false;
 if(step==='chand')return chandOK().length>0;
 if(step==='dance')return act()>0||(pool()>0&&S.round>S.animUntil);
 if(step==='organ')return !organOff();
 if(step==='exit')return S.round===1&&!S.sealed;
 return false;
}
const isTrapKey=k=>['chand','dance','organ','exit'].includes(k);
function orderFor(){
 const cs=S.party.map((c,i)=>({c,i})).sort((a,b)=>(num(b.c.init)-num(a.c.init))||(a.i-b.i));
 const tr=[{k:'chand',v:20},{k:'dance',v:15},{k:'organ',v:10},{k:'exit',v:5}];
 const out=[];let t=0;
 for(const {c} of cs){const n=num(c.init);
  while(t<4&&n<tr[t].v){out.push({k:tr[t].k,trap:true});t++;}
  out.push({k:'c:'+c.id,id:c.id});}
 while(t<4){out.push({k:tr[t].k,trap:true});t++;}
 return out;
}
const skip=s=>s.trap&&!active(s.k);
function firstKey(){const s=orderFor().find(x=>!skip(x));return s?s.k:null;}
function next(){
 if(!run())return;
 if(S.key==='organ'&&S.organ.played)S.organ.played=false;
 if(S.key==='exit'){S.sealed=true;L('Sealed Exit: the doors freeze shut. Teleportation out of the ballroom fails.');}
 let o=orderFor(),idx=o.findIndex(s=>s.k===S.key);
 for(let g=0;g<o.length*2+4;g++){
  idx++;
  if(idx>=o.length){
   if(S.crystals>0&&S.crystals<3){S.res[S.round+':renew']=true;L('Crystals were not all disrupted in the same round: they are renewed and cold fills the ballroom.');S.crystals=0;}
   S.round++;L('Round '+S.round);o=orderFor();idx=0;}
  if(!skip(o[idx])){S.key=o[idx].k;return;}
 }
}
function resetTrap(){
 const d=def();Object.keys(d).forEach(k=>{if(k!=='party'&&k!=='tier'&&k!=='nid')S[k]=d[k];});
 S.party.forEach(c=>{Object.assign(c,{inRoom:true,prot:0,heal:false,brazier:false,grap:false,restr:false,fails:0,sculpt:false});});
}
function doRoll(d){
 let r;
 if(d.atk){const n=rnd(20),b=+d.atk;r={label:d.label,formula:`d20 (${n}) + ${b}`,total:n+b,nat:n};}
 else{
  const m=/^(\d+)d(\d+)$/.exec(d.dice);if(!m)return;
  const c=+m[1],s=+m[2],v=[];for(let i=0;i<c;i++)v.push(rnd(s));
  r={label:d.label,formula:`${d.dice} (${v.join(' + ')})`,total:v.reduce((a,b)=>a+b,0)};
 }
 S.last=r;L(`${r.label}: ${r.formula} = ${r.total}`);
}
/* Numbing Cold outcome for one creature, damage already rolled as D */
function cold(c,Dm){
 const prot=c.prot; // 0 none, 1 resistance, 2 immunity
 const allLit=lit()===4;
 const auto=c.brazier||prot===2;
 let f=Dm,s=0;
 if(prot===1)f=Math.floor(f/2);
 if(prot===2)s=Math.floor(Dm/2);
 if(allLit){f=Math.floor(f/2);s=Math.floor(s/2);}
 const adv=!auto&&(prot===1||c.heal);
 return {auto,adv,f,s};
}

/* ───────────── Run view ───────────── */
const WALTZ=v=>`<b>Waltz of Blades.</b> Melee attack ${at(v.atk,'Waltz of Blades attack')}, reach 10 ft. <b>Hit:</b> ${dd(v.blS,'Waltz of Blades slashing')} slashing plus ${dd(v.blC,'Waltz of Blades cold')} cold. The target makes a ${dcc(v.dc)} Strength save or is grappled (escape ${dcc(v.dc)}).`;
function chandHit(v,lab){return `${dcc(v.dc)} Dexterity save: ${dd(v.chP,lab+' piercing')} piercing + ${dd(v.chC,lab+' cold')} cold on a failure, half on a success. Failures are knocked prone.`;}
function tog(f,id,label,checked,locked){return `<label class="chk ${locked?'lock':''}"><input type="checkbox" data-field="${f}" data-id="${id}" ${checked?'checked':''} ${locked?'disabled':''}> ${label}</label>`;}
function coldLine(c,v){
 const o=S.res[S.round+':cold:'+c.id];
 return `<div class="remind"><span><b>Numbing Cold</b> (end of turn): ${dcc(v.dc)} Constitution save or ${dd(v.cold,'Numbing Cold')} cold damage and speed halved until the end of its next turn.</span><button class="btn sm" data-act="coldroll" data-id="${c.id}">${o?'Re-roll':'Roll damage'}</button></div>`+
  (o?`<div class="res-out"><span>Rolled <b class="mono">${o.r}</b></span>${o.auto?'<span><b>Automatic success</b>'+(o.prot===2?' (cold immunity)':' (lit brazier)')+': takes <b class="mono">'+o.s+'</b></span>':'<span>Fail: <b class="mono">'+o.f+'</b> and speed halved</span><span>Success: <b class="mono">'+o.s+'</b></span>'}${o.adv?'<span>Advantage on the save</span>':''}${o.halved?'<span class="muted">(all braziers lit: halved)</span>':''}</div>`:'');
}
function chandCard(){
 const v=V(),r=S.res[S.round+':chand'],av=chandOK();
 let h=`<section class="card trap"><p class="eyebrow">Round ${S.round} · Initiative 20</p><h2>Falling Chandeliers</h2><p>Roll d3 to pick the chandelier. Secured and destroyed chandeliers are removed from the roll. It showers a 25-ft radius: ${chandHit(v,'Chandelier')}</p>`+
  `<p style="margin-top:10px" class="ch-acts"><button class="btn primary" data-act="chand" data-id="0">${r?'Re-roll':'Roll d3'}</button><span class="muted" style="align-self:center">or pick:</span>${av.map(i=>`<button class="btn sm" data-act="chand" data-id="${i+1}">${i+1} ${CH[i]}</button>`).join('')}</p>`;
 if(r)h+=`<div class="res"><div class="res-out" style="display:grid"><div><span class="chip">${r.roll?'d3 = '+r.roll:'chosen'}</span> <b>${CH[r.idx]} chandelier</b> <span class="muted">(${['centered 30 ft from the west wall','room center','centered 30 ft from the east wall'][r.idx]})</span></div><div>All creatures in the 25-ft radius: ${chandHit(v,'Chandelier')}</div></div></div>`;
 return h+'</section>';
}
function danceCard(){
 const v=V(),r=S.res[S.round+':dance'],p=pool(),blocked=S.round<=S.animUntil;
 let h=`<section class="card trap"><p class="eyebrow">Round ${S.round} · Initiative 15</p><h2>Ice Dancers Animate</h2><p>Roll d6: that many sculptures animate (never more than 12 in total). Then <b>every</b> active sculpture moves up to 60 ft and uses Waltz of Blades.</p>`+
  `<div class="tgt"><span>Active: <b class="mono">${act()}</b></span><span>Still dormant: <b class="mono">${p}</b></span><span>Destroyed: <b class="mono">${S.scDead+S.scPrev}</b></span></div>`+
  (blocked?`<p class="muted">Animation is suppressed until round ${S.animUntil}.</p>`:'')+
  `<p class="ch-acts"><button class="btn primary" data-act="animate"${blocked||p===0?' disabled':''}>${r?'Re-roll new sculptures':'Roll d6 new sculptures'}</button></p>`;
 if(r)h+=`<p style="margin-top:8px"><span class="chip">d6 = ${r.roll}</span> <b>${r.n}</b> new sculpture${r.n===1?'':'s'} animate${r.n===1?'s':''}${r.roll>r.n?' (capped by the remaining sculptures)':''}.</p>`;
 h+=`<div class="item" style="margin-top:10px"><h4>Waltz of Blades (each active sculpture)</h4><p>${WALTZ(v)}</p><p>If it hits and grapples, it moves the creature up to 30 ft and ends its movement wherever it likes. If it misses or fails to grapple, it stays within 5 ft of the creature it attacked.</p><p>A grappled creature takes ${dd(v.grap,'Grapple cold')} cold at the start of each of its turns and makes a ${dcc(v.dc)} Constitution save. On a failure it is restrained too. After three failed saves it is petrified until <i>greater restoration</i>.</p><p class="muted">Sculpture: AC ${v.scAC}, ${v.scHP} HP. Immune to cold, lightning, necrotic, poison, psychic. Resistant to slashing and radiant. Vulnerable to fire.</p></div>`+
  `<div class="item" style="margin-top:10px"><h4>Targeting priority</h4><ol class="muted" style="margin:0;padding-left:20px"><li>Nearest living, conscious character not grappled by another sculpture (within 60 ft).</li><li>Else the nearest living character already grappled by another sculpture.</li><li>Else the nearest conscious character, even beyond 60 ft.</li><li>If all are dead or unconscious: grapple the nearest one to freeze it into a statue.</li></ol></div>`;
 return h+'</section>';
}
function organEffect(i,v){
 return [null,
  `<b>Fugue of Confusion.</b> All creatures: ${dcc(v.dc)} Wisdom save or confused (as <i>confusion</i>) until the start of the next round.`,
  `<b>Crescendo of Ice.</b> 20-ft radius centered on a random creature: ${dcc(v.dc)} Dexterity save, ${dd(v.crP,'Crescendo piercing')} piercing + ${dd(v.crC,'Crescendo cold')} cold on a failure, half on a success.`,
  `<b>Dirge of Lethargy.</b> All creatures: ${dcc(v.dc)} Constitution save or speed halved and no reactions until the start of the next round.`,
  `<b>Chord of Shattering.</b> One random chandelier that has not activated this round releases its shards now (as Falling Chandeliers).`,
  `<b>Waltz of Winter.</b> All creatures in the ballroom take ${dd(v.win,'Waltz of Winter cold')} cold damage, no save.`,
  `<b>Symphony of Souls.</b> Roll d4: that many more sculptures animate now and act at Initiative 10. They also act normally at Initiative 15.`][i];
}
function organDetail(i,v){
 let x='';
 if(i===2){const z=inRoom();x=`<div class="muted">Random creature: <b>${z.length?esc(z[rnd(z.length)-1].name):'nobody in the room'}</b> (re-rolls when you press Roll)</div>`;}
 return `<div class="res-out" style="display:grid"><div>${organEffect(i,v)}</div></div>`;
}
function organCard(){
 const v=V(),r=S.res[S.round+':organ'],two=S.round>=5;
 let h=`<section class="card trap"><p class="eyebrow">Round ${S.round} · Initiative 10</p><h2>The Organ Plays</h2><p>${two?'From round 5 roll d6 <b>twice</b> and apply both. The same number twice doubles the effect (double damage, or disadvantage on saves for status effects).':'Roll a d6 on the organ table.'}</p>`+
  (S.organ.played?`<div class="banner">A character is playing the organ (Performance ${dcc(DX(20))}): it is suppressed this activation, or they choose which effect occurs.</div>`:'')+
  `<p style="margin-top:10px" class="ch-acts"><button class="btn primary" data-act="organ" data-id="0">${r?'Re-roll':'Roll'}</button><span class="muted" style="align-self:center">or pick:</span>${[1,2,3,4,5,6].map(i=>`<button class="btn sm" data-act="organ" data-id="${i}">${i}</button>`).join('')}</p>`;
 if(r){
  h+=`<div class="res">`;
  r.rolls.forEach((i,k)=>{h+=`<div><span class="chip">${r.rolls.length>1?'Roll '+(k+1)+': ':'d6 = '}${i}</span> ${ORG[i-1]}</div>${organDetail(i,v)}`;});
  if(r.double)h+=`<div class="banner bad">Same number twice: double the effect (double damage, or disadvantage on saves).</div>`;
  if(r.rolls.includes(2)&&r.target)h+=`<p class="muted">Crescendo of Ice is centered on <b>${esc(r.target)}</b>.</p>`;
  if(r.rolls.includes(4)){const av=chandOK().filter(i=>(S.res[S.round+':chand']||{}).idx!==i);h+=`<p>Chord of Shattering: ${av.length?'chandelier <b>'+av.map(i=>CH[i]).join(' / ')+'</b> '+(av.length>1?'(pick one at random)':'')+' releases shards now: '+chandHit(v,'Chandelier'):'no chandelier is available (none left that has not activated).'}</p>`;}
  if(r.rolls.includes(6)){h+=`<p class="ch-acts"><button class="btn sm" data-act="symph">Roll d4 more sculptures</button>${r.symph?`<b style="align-self:center">+${r.symph.n} (d4 = ${r.symph.roll})</b>`:''}</p>`;}
  h+='</div>';
 }
 return h+'</section>';
}
function exitCard(){
 return `<section class="card trap"><p class="eyebrow">Round ${S.round} · Initiative 5</p><h2>Sealed Exit</h2><p>The entrance doors freeze shut under a <i>wall of ice</i>. Characters must break through to escape. From now on all teleportation to leave the ballroom fails, but the spell slot or ability use is not expended.</p></section>`;
}
function turnCard(c){
 const v=V();

 if(c.grap){
  const rv=S.res[S.round+':grap:'+c.id];
  h+=`<div class="remind"><span><b>Start of turn, grappled:</b> ${dd(v.grap,'Grapple cold')} cold damage, then a ${dcc(v.dc)} Constitution save. A failure makes it restrained. After three failures it is petrified.</span></div><div class="ch-acts" style="margin-top:8px"><button class="btn sm primary" data-act="freezefail" data-id="${c.id}">Failed freezing save</button><button class="btn sm calm" data-act="freezepass" data-id="${c.id}">Saved</button></div>`;
 }
 h+=coldLine(c,v);

function chips(c){
 const o=[];
 if(!c.inRoom)o.push('<span class="chip">Outside room</span>');
 if(c.prot===1)o.push('<span class="chip ok">Cold resistance</span>');
 if(c.prot===2)o.push('<span class="chip ok">Cold immunity</span>');
 if(c.heal)o.push('<span class="chip ok">Healed (advantage)</span>');
 if(c.brazier)o.push('<span class="chip ok">By a lit brazier</span>');
 if(c.grap)o.push('<span class="chip warn">Grappled</span>');
 if(c.restr)o.push('<span class="chip warn">Restrained</span>');
 if(c.fails>0&&c.fails<3)o.push(`<span class="chip crit">Frozen ${c.fails}/3</span>`);
 if(c.fails>=3)o.push('<span class="chip crit">Petrified</span>');
 return o.join('');
}
function nowCard(){
 if(!run())return `<section class="card trap"><p class="eyebrow">Armed</p><h2>Not triggered yet</h2><p style="margin-top:10px"><button class="btn primary" data-act="trigger">Trigger the trap</button></p><p class="muted" style="margin-top:8px">It activates when a warm-blooded creature moves more than 15 ft into the ballroom or casts a spell in the room.</p></section>`;
 if(S.shut)return `<section class="card calmc"><p class="eyebrow">Shut down</p><h2>The master controls are disrupted</h2><p>All trap elements stop. Nothing acts.</p></section>`;
 const rn=S.res[S.round-1+':renew'];
 let pre='';
 if(S.res[S.round-1+':renew']||S.res[(S.round-1)+':renew'])pre=`<section class="card trap"><p class="eyebrow">Control crystals</p><h2>Renewed</h2><p>Not all three crystals were disrupted in the same round. Piercing cold fills the ballroom: ${dcc(V().dc)} Constitution save, ${dd(V().ctrl,'Crystal backlash cold')} cold damage to all creatures, half on a success.</p></section>`;
 const k=S.key;
 if(k==='chand')return pre+chandCard();
 if(k==='dance')return pre+danceCard();
 if(k==='organ')return pre+organCard();
 if(k==='exit')return pre+exitCard();
 const c=k&&k.indexOf('c:')===0?pcOf(k.slice(2)):null;
 return pre+(c?turnCard(c):`<section class="card now"><p class="eyebrow">Round ${S.round}</p><h2>Press Next</h2></section>`);
}

/* ───────────── Side cards ───────────── */

function partyCard(){
 return `<section><div class="party-head"><h2>Party</h2></div>
 <p class="muted" style="margin:4px 0 10px">Add each character with initiative and (optionally) Passive Perception. The trap acts on counts 20, 15, 10 and 5; creatures on the same count go first.</p>

  r('Numbing Cold','Constant · end of each creature’s turn',`${dcc(v.dc)} Con · ${dd(v.cold,'Numbing Cold')}`)+
  r('Falling Chandeliers','Init 20 · every round',`${dcc(v.dc)} Dex · ${dd(v.chP,'Chandelier piercing')} + ${dd(v.chC,'Chandelier cold')}`)+
  r('Ice Dancers','Init 15 · every round',`${at(v.atk,'Waltz attack')} ${dd(v.blS,'Waltz slashing')} + ${dd(v.blC,'Waltz cold')} · ${dcc(v.dc)} Str`)+
  r('The Organ Plays','Init 10 · every round (twice from round 5)','d6 table')+
  r('Sealed Exit','Init 5 · round 1 only','No teleporting out')+`</dl></section>`;
}
const seg3=(act,id,cur,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="${act}" data-id="${id}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
function cmCard(){
 const v=V(),tg=(f,id,l,ck,lk)=>tog(f,id,l,ck,lk);
 const row=(t,body)=>`<div class="cmr"><b>${t}</b>${body}</div>`;
 const bz=['North column 1','North column 2','South column 1','South column 2'];
 const cm=[
  row('Braziers (Numbing Cold)',`<p class="muted">Find: Investigation ${dcc(v.br.find)}. Light: 5+ fire damage or Arcana ${dcc(v.br.light)}.</p>`+bz.map((l,i)=>tg('braz',i,l+' lit',S.braz[i])).join('')+`<p class="muted">Lit: <b class="mono">${lit()}/4</b>${lit()===4?' · cold damage halved room-wide':''}. Mark “By a lit brazier” on characters within 20 ft.</p>`),
  row('Chandeliers',`<p class="muted">Predict: Investigation ${dcc(v.ch.pred)} after two rounds (advantage and move away). Secure: flying, thieves’ tools ${dcc(v.ch.sec)}. Destroy: AC ${v.chAC}, ${v.chHP} HP, vulnerable to thunder; or <i>dispel magic</i> ${dcc(v.ch.sp5)}. Destroyed: one last shower.</p>`+CH.map((n,i)=>`<div class="ch-acts" style="align-items:center"><b style="min-width:56px">${n}</b>${seg3('chs',i,S.chand[i],[['ok','Active'],['secured','Secured'],['destroyed','Destroyed']])}</div>`).join('')),
  row('Ice sculptures',`<div class="tgt"><span>Active <b class="mono">${act()}</b>${S.scX?` (incl. ${S.scX} from petrified)`:''}</span><span>Dormant <b class="mono">${pool()}</b></span><span>Destroyed <b class="mono">${S.scDead+S.scPrev}</b></span></div><p class="muted">AC ${v.scAC}, ${v.scHP} HP. A dormant one at 0 HP never animates; a rune marked (Arcana or Religion ${dcc(v.sc.mark)}) can’t animate either. <i>Dispel magic</i> ${dcc(v.dispel)} suppresses animation for 1 minute.</p><div class="ch-acts"><button type="button" class="btn sm" data-act="scdest"${act()?'':' disabled'}>Destroy an active sculpture</button><button type="button" class="btn sm" data-act="scprev"${pool()?'':' disabled'}>Prevent / mark a dormant one</button><button type="button" class="btn sm" data-act="scdisp">${S.animUntil>=S.round?'Animation suppressed (clear)':'Dispel animation (1 min)'}</button></div>`),
  row('Organ',`<p class="muted">Three actions, each ${dcc(v.og.chk)}: Performance or Arcana; Arcana; Sleight of Hand. Or destroy it: AC ${v.orAC}, ${v.orHP} HP, death chord ${dcc(v.dc)} Con ${dd(v.chord,'Death chord thunder')} thunder + stunned (half, no stun on a success).</p>`+['1. Performance / Arcana','2. Arcana','3. Sleight of Hand'].map((l,i)=>tg('ochk',i,l,S.organ.checks[i])).join('')+tg('odead',0,'Organ destroyed',S.organ.dead)+tg('oplay',0,'A character is playing it (Performance '+v.og.play+') this round',S.organ.played)),
  row('Complete shutdown',`<p class="muted">Control chamber under the dais. Four actions:</p>`+tg('sstep',0,`Locate panel (Investigation ${v.sd.loc})`,S.shutSteps[0])+tg('sstep',1,`Open the lock (Thieves’ Tools ${v.sd.open}); ladder ${dcc(v.sd.lad)} or fall ${dd(v.fall,'Ladder fall')} bludgeoning, prone (stand: Acrobatics ${dcc(v.sd.stand)})`,S.shutSteps[1])+tg('sstep',2,`Identify the crystals (Arcana ${v.sd.idc})`,S.shutSteps[2])+`<div class="stepper"><span>Crystals disrupted this round (Arcana or Thieves’ Tools ${dcc(v.sd.crys)})</span><button type="button" class="btn sm" data-act="crys" data-d="-1" aria-label="−1">−</button><span class="mono">${S.crystals}/3</span><button type="button" class="btn sm" data-act="crys" data-d="1" aria-label="+1">+</button></div><p class="muted">All three must go in the <b>same round</b>. Otherwise they renew: ${dcc(v.sd.back)} Con, ${dd(v.ctrl,'Crystal backlash')} cold to all, half on a success.</p>`)
 ];
 return `<section class="card"><h3 style="margin-bottom:10px">Countermeasures</h3><div class="cmlist">${cm.join('')}</div></section>`;
}
function identCard(inter){
 const v=V(),I=v.id;
 const rows=[
  {k:'pp',h:'Passive Perception',dc:I.pp,t:'Some “ice sculptures” wear adventuring gear: they are earlier victims, frozen solid.'},
  {k:'p1',h:'Perception',dc:I.p1,t:'The chandeliers float in suspended animation by magic. Faint frost patterns on the floor beneath each chandelier.'},
  {k:'p2',h:'Perception',dc:I.p2,t:'Several sculptures have articulated joints under the ice, and their eyes seem to track movement. Tiny runes are carved into each sculpture’s base.'},
  {k:'inv',h:'Investigation',dc:I.inv,t:'The pipe organ is a control mechanism. Specific keys correspond to different trap elements.'},
  {k:'arc',h:'Arcana',dc:I.arc,t:'Powerful evocation and transmutation magic. The sculptures are victims of <i>flesh to ice</i>. The organ controls the trap through sympathetic magic.'},
  {k:'nat',h:'Nature or Survival',dc:I.nat,t:'This cold drains life force, not just heat. Even creatures resistant to cold suffer here.'}];
 const wp=S.party.filter(c=>c.pp!=null);
 return `<section class="card"><h3 style="margin-bottom:10px">Identification</h3><div class="ids">${rows.map(r=>{
  let who='';
  if(inter&&r.k==='pp')who=wp.length?`<p class="muted">Notice: ${(()=>{const a=wp.filter(c=>c.pp>=r.dc);return a.length?names(a):'nobody';})()}</p>`:`<p class="muted">Enter Passive Perception on the party cards to see who notices.</p>`;
  return `<div class="id"><div class="id-h"><b>${r.h}</b>${dcc(r.dc)}${inter?`<label class="chk" style="margin-left:auto"><input type="checkbox" data-field="rev" data-id="${r.k}" ${S.revealed[r.k]?'checked':''}> Revealed</label>`:''}</div><p>${r.t}</p>${who}</div>`;}).join('')}</div></section>`;
}
function logCard(){
 return `<section class="card"><div class="party-head"><h3>Rolls &amp; log</h3>${S.log.length?`<button class="btn sm" data-act="clearLog">Clear</button>`:''}</div>`+
  (S.log.length?`<ul class="log">${S.log.slice(0,60).map(e=>`<li><span class="r">R${e.r}</span><span>${esc(e.t)}</span></li>`).join('')}</ul>`:`<p class="muted" style="margin-top:6px">Tap any dice or attack button to roll it here.</p>`)+`</section>`;
}
let sure=false,sureTimer=0;
function viewRun(){

function strip(){
 const l=S.last;

 const cur=!run()?'Armed':S.shut?'Shut down':isTrapKey(S.key)?({chand:'Chandeliers',dance:'Ice Dancers',organ:'The Organ',exit:'Sealed Exit'})[S.key]:(pcOf((S.key||'').slice(2))||{name:'–'}).name;
 return `<div class="strip"><div class="strip-in">`+
  stat('Round',run()?S.round:'–')+
  `<div class="stat"><span class="lbl">${run()?'Now':'Armed'}</span><b style="font-size:20px">${esc(cur)}</b></div>`+
  stat('Sculptures',act(),pool()+' dormant')+
  stat('Chandeliers',chandOK().length+'/3','active')+
  stat('Braziers',lit()+'/4','lit')+
  stat('Crystals',S.crystals+'/3','this round')+
  (l?`<div class="stat"><span class="lbl">Last</span><b class="${l.nat===20?'good':l.nat===1?'bad':''}">${l.total}</b><span class="sub">${esc(l.label)}</span></div>`:'')+
  `<div class="acts"><button class="btn" data-act="undo">Undo</button>`+(run()?`<button class="btn primary" data-act="next">Next →</button>`:`<button class="btn primary" data-act="trigger">Trigger</button>`)+`</div></div></div>`;
}

const USE={
 1:['This trap guards the approach to the Ice Queen’s throne room. The sealed doors on the western wall lead to her inner sanctum. It is designed to freeze intruders solid or crush them with ice shards while ice sculptures waltz them to their doom.','At this tier the party has no flight, few resistances and little healing, so the numbers are toned down and the room is something to cross with care and teamwork rather than a death sentence. Without flight, a character can reach a chandelier with a rope and grappling hook up the columns (use the same check). Place a valuable treasure or plot item on the dais to tempt the party deeper.'],
 2:['This trap guards the approach to the Ice Queen’s throne room. The sealed doors on the western wall lead to her inner sanctum. It is designed to freeze intruders solid or crush them with ice shards while ice sculptures waltz them to their doom.','At this tier a party may have a little flight, a cold resistance or a healer, but the cold and the growing army will still wear them down. Place a valuable treasure or plot item on the dais to tempt the party deeper.'],
 3:['This trap guards the approach to the Ice Queen’s throne room. The sealed doors on the western wall lead to her inner sanctum. The trap is designed to freeze intruders solid or crush them with ice shards while ice sculptures waltz them to their doom.','At this tier, players have access to powerful magic like <i>fly</i> and environmental resistances, but the trap’s life-draining cold and multiple threats will still challenge them. Place a valuable treasure or plot item in the center of the room on the dais to tempt the party deeper into danger.'],
 4:['This trap guards the approach to the Ice Queen’s throne room. The sealed doors on the western wall lead to her inner sanctum. It is designed to freeze intruders solid or crush them with ice shards while ice sculptures waltz them to their doom.','At this tier the party has reliable flight, cold immunity, strong healing and teleportation, so the trap hits harder, its DCs are higher and its sculptures are tougher. Resistance and immunity still do not blunt the cold completely. Place a valuable treasure or plot item on the dais to tempt the party deeper.']};
function elc(h,tag,body,extra){return `<article class="el"><header><h3>${h}</h3><span class="tag">${tag}</span></header><p class="fx">${body}</p>${extra||''}</article>`;}
const cmr=(n,t)=>`<div class="cm"><b class="n">${n}</b><p>${t}</p></div>`;
function viewRef(){
 const v=V(),t=T(),u=USE[S.tier];
 const ids=identCard(false);
 const organTbl=`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>d6</th><th>Effect</th></tr></thead><tbody>${[1,2,3,4,5,6].map(i=>`<tr><td class="mono">${i}</td><td>${organEffect(i,v)}</td></tr>`).join('')}</tbody></table></div>`;
 const flavor='The Ice Queen’s grand ballroom is a masterpiece of frozen architecture, 60 feet wide and 120 feet long. A mirror-smooth ice floor reflects the light of massive crystalline chandeliers floating beneath the 40-foot vaulted ceiling. Eight towering columns of carved ice line the room, four along the north wall and four along the south wall. Twelve ice sculptures of nobles and dancers stand frozen mid-waltz throughout the chamber. In the center, a raised circular dais of carved ice stands fifteen feet across. A massive pipe organ made entirely of ice dominates the western wall. The room radiates an otherworldly blue luminescence and bitter cold. The entrance lies on the eastern wall; sealed doors on the western wall lead to the Ice Queen’s throne room beyond the organ.';
 return `<article class="ref"><section><div class="meta"><span>Tier <b>${S.tier}</b></span><span>Levels <b>${t.lvl}</b></span><span>Threat <b>Deadly</b></span><span>XP <b>${t.xp}</b></span></div><p>${flavor}</p><p class="muted"><i>Balance note:</i> This version is rebalanced as a <b>Deadly</b> complex trap using the Level and Lethality rules: saving throws are DC 20 and attacks +12 at tiers 2–4 (at tier 1, DC 16 and +9, so level 1–4 characters get a fighting chance); damage dice follow the Dangerous column of the Damage Severity table (the trap stacks many elements, so each hits for less than a single Deadly effect); constant elements deal reduced damage. HP, AC and dispel DCs, plus the DCs of identification and countermeasure checks, are scaled to the party level.</p></section>
 <section><h3>Using in an adventure</h3><p>${u[0]}</p><p>${u[1]}</p></section>
 <section><h3>Trigger</h3><p>The trap activates when a warm-blooded creature moves more than 15 feet into the ballroom or casts a spell within the room.</p></section>
 ${ids}
 <section><h3>Constant element</h3><div class="els">${elc('Numbing Cold','Constant · end of each creature’s turn',`The ballroom is infused with life-draining cold. At the end of each creature’s turn in the ballroom, it must succeed on a ${dcc(v.dc)} Constitution saving throw or take ${dd(v.cold,'Numbing Cold')} cold damage and have its movement speed halved until the end of its next turn.`,`<p class="fx">Creatures with <b>resistance</b> to cold have advantage on the save and take half damage; on a failure their speed is still halved. Creatures with <b>immunity</b> automatically succeed on the save but still take half damage (this cold damages the soul, not just the body).</p>`+cmr('Find the Braziers',`Investigation ${dcc(v.br.find)} reveals four frozen magical braziers on the ice columns, two on the north wall and two on the south wall. A creature adjacent to a brazier lights it by dealing 5+ fire damage to it or succeeding on an Arcana check ${dcc(v.br.light)}. A lit brazier makes a 20-foot-radius area of warmth where creatures automatically succeed on saves against Numbing Cold. Lighting all four halves the cold damage throughout the room.`)+cmr('Magical Protection','Each healing spell cast on a creature gives it advantage on its next Constitution save against Numbing Cold.'))}</div></section>
 <section><h3>Active elements</h3><div class="els">
 ${elc('Falling Chandeliers','Initiative 20 · every round',`Roll 1d3 to pick the chandelier: 1 West (centered 30 ft from the west wall), 2 Center (room center), 3 East (centered 30 ft from the east wall). It shudders and releases a shower of razor-sharp ice shards in a 25-foot-radius circle beneath it. ${chandHit(v,'Chandelier')} The chandeliers keep functioning each round unless destroyed.`,
  cmr('Predict the Pattern',`After watching the chandeliers for two rounds, an Intelligence (Investigation) check ${dcc(v.ch.pred)} reveals which releases shards next. Success gives advantage on the save and lets creatures move away first.`)+cmr('Secure the Chandeliers',`A flying character can reach a chandelier and secure its crystals with a Dexterity check using thieves’ tools ${dcc(v.ch.sec)}, preventing it from releasing shards. Each secured chandelier removes one option from the d3. If all three are secured, this element is disabled.`)+cmr('Destroy Them',`Each chandelier has AC ${v.chAC}, ${v.chHP} HP, immunity to cold and poison, vulnerability to thunder. When destroyed it releases one final shower of shards in a 25-foot radius (${dcc(v.dc)} Dexterity save, ${dd(v.chP,'Chandelier piercing')} piercing + ${dd(v.chC,'Chandelier cold')} cold, half on a success) and no longer activates on initiative 20. <i>Dispel magic</i> ${dcc(v.ch.sp5)} (as against a spell of level ${v.sp}) also destroys one, causing it to fall.`))}
 ${elc('Ice Dancers Animate','Initiative 15 · every round',`Roll 1d6: that many ice sculptures animate and join the dance (never more than 12 in total). New sculptures move up to 60 feet in a circular, waltzing pattern toward their target, then take the Waltz of Blades action. All previously animated sculptures also act on this count.`,
  `<div class="item"><h4>Targeting priority</h4><ol class="muted" style="margin:0;padding-left:20px"><li>Move toward the nearest living, conscious character not grappled by another sculpture (within 60 feet of movement).</li><li>If none, toward the nearest living character already grappled by another sculpture.</li><li>If no conscious character is within 60 feet, toward the nearest conscious character (even beyond 60 feet for that turn).</li><li>If all characters are dead or unconscious, toward and grapple the nearest dead or unconscious creature to freeze it into a statue.</li></ol></div>
  <p class="fx">${WALTZ(v)}</p><p class="fx">If the sculpture hits and grapples, it moves the grappled creature up to 30 feet in any direction as part of its grotesque dance, ending its movement wherever it chooses. If it misses or fails to grapple, it remains within 5 feet of the creature it attacked.</p><p class="fx">A grappled creature takes ${dd(v.grap,'Grapple cold')} cold damage at the start of each of its turns and must make a ${dcc(v.dc)} Constitution saving throw. On a failure it becomes restrained (in addition to grappled). After three failed saves (not necessarily consecutive) it is petrified until <i>greater restoration</i> or similar magic is cast on it.</p><p class="fx"><b>Ice sculpture statistics:</b> AC ${v.scAC}, ${v.scHP} HP, immunity to cold, lightning, necrotic, poison and psychic, resistance to slashing and radiant, vulnerability to fire. The sculptures are animated objects, not creatures, with no self-preservation. A sculpture never willingly releases a grappled creature, even if it dies, until that creature is petrified and animates as a new ice sculpture under the trap’s control.</p>`+
  cmr('Prevent Animation',`Reducing a dormant sculpture to 0 HP destroys it and prevents it from animating. Or: <i>dispel magic</i> ${dcc(v.dispel)} suppresses animation for 1 minute; or an Arcana or Religion check ${dcc(v.sc.mark)} disrupts one sculpture’s animation rune.`)+cmr('Combat Them','Bringing an animated sculpture to 0 HP destroys it forever.'))}
 ${elc('The Organ Plays','Initiative 10 · every round','The pipe organ plays a haunting waltz. Roll 1d6:'+organTbl,
  cmr('Disable the Organ',`Three successful checks, each ${dcc(v.og.chk)} and each an action: (1) Performance or Arcana, to understand its magical composition; (2) Arcana, to disrupt the harmonics powering it; (3) Sleight of Hand, to damage the pipes without causing an explosion. Completing all three disables the element.`)+cmr('Destroy It',`The organ has AC ${v.orAC}, ${v.orHP} HP, immunity to cold, psychic and poison. Destroying it causes a final “death chord”: all creatures make a ${dcc(v.dc)} Constitution save or take ${dd(v.chord,'Death chord thunder')} thunder damage and are stunned until the end of their next turn (half damage and no stun on a success).`)+cmr('Play It Yourself',`A character proficient with a musical instrument uses its action for a Performance check ${dcc(v.og.play)}. On a success the organ’s next activation on initiative 10 is suppressed, or the character chooses which effect occurs.`))}
 </div></section>
 <section><h3>Dynamic elements</h3><div class="els">
 ${elc('Growing Army','Every round','Each round a new set of 1d6 ice sculptures animates, as described above. Once all 12 have animated this keeps working: all 12 act together on initiative 15 every round.')}
 ${elc('Organ Crescendo','From round 5','Starting on round 5, roll 1d6 twice on the organ table and apply both effects. If you roll the same number twice, double the effect (double damage for damage effects, disadvantage on saves for status effects).')}
 ${elc('Sealed Exit','Initiative 5 · round 1','On initiative count 5 of round 1 the entrance doors freeze shut under a <i>wall of ice</i>. Characters must break through to escape. From then on all teleportation magic to leave the ballroom automatically fails, but the spell slot or ability use is not expended.')}
 </div></section>
 <section><h3>Complete shutdown</h3><p>The trap can be fully disabled from the master controls beneath the central dais.</p><p><b>The control chamber</b> is a 20 ft × 20 ft room carved from solid ice. A frozen ladder descends 30 ft from the ballroom into its north wall. Three glowing control crystals are embedded in the south wall, directly opposite the ladder, so characters must cross the full 20 feet. Characters with halved speed may need two turns.</p>
 <ol><li>Investigation ${dcc(v.sd.loc)}: locate the hidden access panel in the floor beneath the central dais.</li><li>Thieves’ tools ${dcc(v.sd.open)}: open the crystalline lock. Descending the ladder carefully is an Athletics or Acrobatics check ${dcc(v.sd.lad)}; on a failure the character slips, takes ${dd(v.fall,'Ladder fall')} bludgeoning damage and lands prone. Standing from prone is an Acrobatics check ${dcc(v.sd.stand)} (half movement); on a failure it stays prone.</li><li>Arcana ${dcc(v.sd.idc)}: identify the three crystals and learn that they must all be disrupted in the same round.</li><li>Arcana or thieves’ tools ${dcc(v.sd.crys)}: disrupt one crystal (one action per crystal). Three characters must each disrupt one on the same round. If not all three are disrupted in the same round, the crystals renew and piercing cold fills the ballroom: ${dd(v.ctrl,'Crystal backlash')} cold damage to all creatures in the ballroom (${dcc(v.sd.back)} Constitution save for half).</li></ol><p>Success shuts down all trap elements immediately.</p></section>
 <section><h3>Running the trap</h3><ul><li>Map the ballroom as 120 ft (N–S) × 60 ft (E–W). Entrance on the east wall; throne room doors and organ on the west wall.</li><li>8 ice columns (4 north, 4 south); 4 braziers (2 north, 2 south). 12 sculptures. 3 chandelier positions (West, Center, East, each 25-ft radius). Central dais, 15 ft across.</li><li>Initiative: <b>20</b> chandeliers (d3), <b>15</b> ice dancers (d6, all active sculptures act), <b>10</b> organ (d6), <b>5</b> sealed exit (round 1). End of each creature’s turn: Numbing Cold save.</li><li>Tips: describe the cold draining color from the characters’ skin; stress the elegant, deadly beauty of the dancers; use the organ’s music to build tension; allow creative solutions.</li></ul><p><b>Experience award:</b> ${t.xp} XP for overcoming this trap.</p></section></article>`;

const actions={
 trigger:()=>commit(()=>{S.phase='run';S.round=1;S.res={};S.done={};S.key=firstKey();L('The Frozen Waltz is triggered.');}),
 next:()=>commit(()=>{next();}),
 rm:id=>commit(()=>{S.party=S.party.filter(x=>String(x.id)!==String(id));}),
 tgl:(id,m,el)=>commit(()=>{const c=pcOf(id),k=el.dataset.k;if(!c)return;c[k]=!c[k];if(k==='grap'&&!c.grap)c.restr=false;if(k==='grap'&&c.grap)L(c.name+' is grappled.');}),
 prot:(id,m,el)=>commit(()=>{const c=pcOf(id);if(c)c.prot=+el.dataset.v;}),
 fails:(id,m,el)=>commit(()=>{const c=pcOf(id);if(!c)return;c.fails=Math.max(0,Math.min(3,c.fails+(+el.dataset.d)));petri(c);}),
 freezefail:id=>commit(()=>{const c=pcOf(id);if(!c)return;c.fails=Math.min(3,c.fails+1);c.restr=true;L(c.name+' fails a freezing save ('+c.fails+'/3): restrained.');petri(c);}),
 freezepass:id=>commit(()=>{const c=pcOf(id);if(c)L(c.name+' passes the freezing save.');}),
 coldroll:id=>commit(()=>{const c=pcOf(id);if(!c)return;const v=V(),r=rollD(v.cold[0],v.cold[1]),o=cold(c,r);
  S.res[S.round+':cold:'+c.id]=Object.assign({r,prot:c.prot,halved:lit()===4},o);
  L(`${c.name}: Numbing Cold ${v.cold[0]}d${v.cold[1]} = ${r} (fail ${o.f}, success ${o.s})`);c.heal=false;}),
 chand:(id)=>commit(()=>{const av=chandOK();if(!av.length)return;const idx=+id?+id-1:av[rnd(av.length)-1];
  S.res[S.round+':chand']={roll:+id?0:idx+1,idx};L('Falling Chandeliers: '+CH[idx]+' chandelier releases shards.');}),
 animate:()=>commit(()=>{const k=S.round+':dance',p=S.res[k];if(p)S.scAct-=p.n;const roll=rnd(6),n=Math.min(roll,pool());S.scAct+=n;S.res[k]={roll,n};L(`Ice Dancers: d6 = ${roll}, ${n} new sculpture${n===1?'':'s'} animate (${S.scAct} active).`);}),
 organ:(id)=>commit(()=>{const k=S.round+':organ',p=S.res[k];
  if(p&&p.symph){S.scAct-=p.symph.n;}
  let rolls;const two=S.round>=5;
  if(+id){rolls=(two&&p&&p.rolls.length===1&&p.picked)?[p.rolls[0],+id]:[+id];}
  else rolls=two?[rnd(6),rnd(6)]:[rnd(6)];
  const z=inRoom();
  S.res[k]={rolls,picked:!!+id,double:rolls.length===2&&rolls[0]===rolls[1],target:z.length?z[rnd(z.length)-1].name:''};
  L('The Organ: '+rolls.map(i=>i+' '+ORG[i-1]).join(' + ')+(S.res[k].double?' (doubled)':''));}),
 symph:()=>commit(()=>{const r=S.res[S.round+':organ'];if(!r)return;if(r.symph)S.scAct-=r.symph.n;const roll=rnd(4),n=Math.min(roll,pool());S.scAct+=n;r.symph={roll,n};L(`Symphony of Souls: d4 = ${roll}, ${n} more sculpture${n===1?'':'s'} animate.`);}),
 chs:(id,m,el)=>commit(()=>{const i=+id,v=el.dataset.v;if(S.chand[i]===v)return;S.chand[i]=v;L(CH[i]+' chandelier: '+v+(v==='destroyed'?' (it releases one final shower of shards)':'')+'.');}),

/* ───────── Shared kit for the XGE / DMG-style complex traps ───────── */
const KIT=(function(){

 K.el=(h,tag,body,extra)=>`<article class="el"><header><h3>${h}</h3><span class="tag">${tag}</span></header><p class="fx">${body}</p>${extra||''}</article>`;

core.register(KIT.make(K=>{

  id:'pob',name:'Path of Blades',eyebrow:'Complex trap · Dangerous',tagline:'A 160-ft tomb hallway of whirling blades, crushing pillars and a rune of fear.',
  base:1,sev:[11,22,55,99],threat:'Dangerous',flat:'Dangerous traps use DC 15 and +8 at every tier; tier 1 keeps the original +5 attack bonus',zones:['Outside','Blades (0–80 ft)','Pillars (80–130 ft)','Rune (130–160 ft)'],outZone:0,

  partyHint:'Place each character in the hallway: the zone decides which element threatens it. The trap acts on counts 20 and 10; creatures on the same count go first.',

  glance:()=>{const v=V();return [
   ['Whirling Blades','Init 20 · first 80 ft',`${at(v.atk,'Blades attack')} ${dd(v.bl,'Blades slashing')}`],

  step:k=>{

   if(k==='b20'){

   }
   const pl=zoneList(2),rl=zoneList(3);
   let h=`<p><b>Crushing Pillars</b> (80–130 ft): ${dcc(v.dc)} Dexterity save, ${dd(pilT(),'Pillars bludgeoning')} bludgeoning and prone on a failure; half and not prone on a success.</p><div class="trows">${pl.map(c=>K.trow(c,b('bres',c.id,'Failed','pf','crit')+b('bres',c.id,'Saved','ps','calm'))).join('')||'<p class="muted">Nobody in the pillars’ area.</p>'}</div>`;
   if(!runeOff())h+=`<p style="margin-top:12px"><b>Rune of Fear</b> (130–160 ft): ${dcc(runeDC())} Wisdom save. On a failure the creature is frightened and must immediately use its reaction to move its speed toward the pillars. It can’t move closer to the far end until it uses its action for a ${dcc(runeDC())} Wisdom save (success ends it).</p><div class="trows">${rl.map(c=>K.trow(c,b('bres',c.id,'Failed','rf','crit')+b('bres',c.id,'Saved','rs','calm'))).join('')||'<p class="muted">Nobody at the rune.</p>'}</div>`;
   else h+=`<p class="muted" style="margin-top:12px">The Rune of Fear is disabled.</p>`;
   return K.card(`Round ${S.round} · Initiative 10`,'Crushing Pillars & Rune of Fear',h);

  turn:c=>{
   const v=V(),x=X();let h='';

   if(c.z===3&&!runeOff())h+=`<div class="remind"><span><b>End of turn, within 30 ft of the far end:</b> ${dcc(runeDC())} Wisdom save against the Rune of Fear.</span></div><div class="ch-acts" style="margin-top:8px">${b('bres',c.id,'Failed','rf','crit')}${b('bres',c.id,'Saved','rs','calm')}</div>`;
   if(c.f.fear)h+=`<div class="remind"><span><b>Frightened:</b> it can’t move closer to the far end until it uses its action for a ${dcc(runeDC())} Wisdom save.</span></div><div class="ch-acts" style="margin-top:8px">${b('bres',c.id,'Save succeeded: not frightened','rclear')}</div>`;

  },
  cm:()=>{

    ['Whirling Blades',`<p class="muted">Disabled when the attack bonus is reduced to −8. Each success below reduces it by 2: Investigation ${dcc(v.inv)} (anticipate the blades: mark “Anticipates blades” on the character); ready an attack on a blade (AC ${v.bAC}, ${v.bHP} HP; the blade gains advantage on its attack; destroying it); thieves’ tools ${dcc(v.tt)}.</p>`+K.step('red','Reductions',x.red,need())+`<p class="muted">Base bonus ${v.atk>=0?'+':'−'}${Math.abs(v.atk)}, now ${bladesOff()?'disabled':(bonus()>=0?'+':'−')+Math.abs(bonus())}.</p>`],

   ];

   {k:'inv',h:'Investigation',dc:i.inv,t:'The blades’ rhythm can be read: a pattern in the scrape marks shows where they swing and when.'},
   {k:'arc',h:'Arcana',dc:i.arc,t:'The rune at the far end is an enchantment of fear. Tampering with it makes the whole trap more dangerous.'}];},
  head:()=>({flavor:'Hidden within a buried pyramid that marks the location of the Lost City of Cynidicea is the tomb of King Alexander and Queen Zenobia. The entrance to their tomb is a long hallway riddled with traps, accessible only by cunningly hidden secret doors. The hallway is 20 feet wide and 160 feet long. It is mostly clear. After 80 feet, the floor is broken and cracked, becoming difficult terrain until the 130-foot mark.',
   use:['The Path of Blades includes a set of whirling blades along the first 80 feet of the trap, crushing pillars that slam down from the ceiling in the next 50 feet, and a rune of fear in its final 30 feet.']}),
  ref:()=>{
   const v=V();
   return `<section><h3>Initiative</h3><p>The trap acts on initiative count 20 and initiative count 10, after creatures with the same count.</p></section>
   <section><h3>Active elements</h3><div class="els">
   ${K.el('Whirling Blades','Initiative 20',`The blades attack each creature in the first 80 feet of the hallway, with a ${at(v.atk,'Blades attack')} attack bonus and dealing ${dd(v.bl,'Blades slashing')} slashing damage on a hit.`)}
   ${K.el('Crushing Pillars','Initiative 10',`Each creature in the 50-foot-long area beyond the first 80 feet must make a ${dcc(v.dc)} Dexterity saving throw. On a failure it takes ${dd(v.pil,'Pillars bludgeoning')} bludgeoning damage and is knocked prone. On a success it takes half as much damage and isn’t knocked prone.`)}
   ${K.el('Rune of Fear','Initiative 10',`Each creature in the 30-foot-long area beyond the Crushing Pillars must make a ${dcc(v.dc)} Wisdom saving throw. On a failure it becomes frightened by the rune and must immediately use its reaction to move its speed in the direction of the pillars. The frightened creature can’t move closer to the far end of the hallway until it uses its action to make a ${dcc(v.dc)} Wisdom saving throw, which ends the frightened condition on itself on a success.`)}
   </div></section>
   <section><h3>Constant elements</h3><div class="els">
   ${K.el('Whirling Blades','End of a creature’s turn',`Any creature that ends its turn in the blades’ area is targeted by an attack: ${at(v.atk,'Blades attack')}; ${dd(v.blC,'Blades slashing')} slashing damage on a hit. (This tracker uses the blades’ current attack bonus, so a miss here also accelerates them.)`)}
   ${K.el('Rune of Fear','End of a creature’s turn','Any creature that ends its turn within 30 feet of the far end of the corridor must make a saving throw against the Rune of Fear effect.')}
   </div></section>
   <section><h3>Dynamic elements</h3><div class="els">
   ${K.el('Blades Accelerate','Whenever the blades miss',`The blades move with increasing speed, slowing only when they hit a target. After each miss, the blades’ attack bonus increases by 2 and their damage increases by ${dd(v.acc,'Accelerating damage')}. These benefits apply until the blades hit a target, after which the values return to normal.`)}
   ${K.el('Rune’s Defense','Each success against the rune',`Each successful check on an attempt to disable the rune increases the damage of the blades and the crushing pillars by ${dd(v.rn,'Rune’s Defense')} and increases the rune’s saving throw DC by 1.`)}
   </div></section>
   <section><h3>Countermeasures</h3><div class="els">
   ${K.el('Whirling Blades','Disabled at −8',`The blades are disabled if their attack bonus is reduced to −8 (${need()} reductions at this tier).`,
    K.cm('Intelligence (Investigation)',`${dcc(v.inv)}. As an action, a creature that can see the blades learns how to anticipate their movement, imposing disadvantage on the blades’ attacks against it while it isn’t incapacitated.`)+
    K.cm('Attack',`A creature in the area can ready an attack to strike a blade as it goes by. The blade gains advantage on its attack against the creature, then the creature attacks. Each blade has AC ${v.bAC} and ${v.bHP} hit points. Destroying a blade reduces the attack bonus by 2.`)+
    K.cm('Dexterity (thieves’ tools)',`${dcc(v.tt)}. A creature can use thieves’ tools in the blades’ area to foil their mechanism. A success reduces the attack bonus by 2.`))}
   ${K.el('Crushing Pillars','No countermeasures','The pillars are not susceptible to countermeasures.')}
   ${K.el('Rune of Fear','Three checks',`Three successful Intelligence (Arcana) checks ${dcc(v.arc)}. Each check requires an action. A creature must be at the end of the hallway, and only one creature can work on this at once; no other character can try until the end of that creature’s next turn. Alternatively, three successful castings of <i>dispel magic</i> ${dcc(v.disp)} targeting the rune.`)}
   </div></section>`;
  },
  actions:{
   bres:(id,m)=>K.commit(()=>{
    const c=K.pc(id),x=X();if(!c)return;
    if(m==='hit'){x.acc=0;L(c.name+' is hit by the blades: accelerate resets.');}

    else if(m==='pf'){c.f.prone=true;L(c.name+' fails the Crushing Pillars save: damage and prone.');}
    else if(m==='ps')L(c.name+' saves against the Crushing Pillars: half damage.');
    else if(m==='rf'){c.f.fear=true;L(c.name+' fails the Rune of Fear save: frightened.');}
    else if(m==='rs')L(c.name+' saves against the Rune of Fear.');
    else if(m==='rclear'){c.f.fear=false;L(c.name+' is no longer frightened.');}
   }),
   red:(id,m,el)=>K.commit(()=>{const x=X();x.red=Math.max(0,Math.min(need(),x.red+(+el.dataset.d)));L('Blade attack reductions: '+x.red+'/'+need());}),
   rune:(id,m,el)=>K.commit(()=>{const x=X();x.rune=Math.max(0,Math.min(3,x.rune+(+el.dataset.d)));L('Rune of Fear disable successes: '+x.rune+'/3');})
  }
 };
}));

core.register(KIT.make(K=>{
 const {esc,dcc,dd,at,b}=K;

 const X=()=>K.S.x;
 const V=()=>({dc:20,base:K.D(6,10)[0],inc:K.D(2,10)[0],max:K.D(10,10)[0],one:K.D(1,10)[0],boom:K.D(4,10),

 const SN=['Northwest','Northeast','Southwest','Southeast'],DN=['North door','East door','South door','West door'];
 const TXT=['','Hallucinatory gas','Explosive gas','Weakening gas','Buffeting winds','Smoke','Poison floods the room'];

 const gasBlock=(k,lab)=>{const v=V();return `<p>${lab}: ${dcc(v.dc)} Constitution save, ${dd(gasT(k),'Poison Gas')} poison damage on a failure, half on a success. <span class="muted">(${potency(k)}d10 potency ${cr()?'+'+cr()+' cracked ':''}${bl()?'−'+bl()+' blocked':''})</span></p>${saveRows(room(),'Failed','Saved','gf','gs')}`;};
 const eff=()=>{const r=K.S.res[K.S.round+':tmp'];return r?r.roll:0;};
 return {
  id:'ptp',name:'Poisoned Tempest',eyebrow:'Complex trap · Deadly',tagline:'A yuan-ti trap room that locks its doors and floods with poison gas and chaos.',
  base:3,sev:[22,55,99,132],threat:'Deadly',flat:'Deadly traps use DC 20 and +12 at every tier',zones:['In the room','Outside'],outZone:1,
  conds:[{k:'flame',l:'Holds an open flame',tip:'Triggers the Explosive gas tempest effect'},{k:'prone',l:'Prone'}],
  partyHint:'The room is 60 ft on a side with a door in the middle of each wall. Mark who is inside and who holds an open flame. The trap acts on counts 20 and 10.',

  x:()=>({gas:0,st:['ok','ok','ok','ok'],doors:[0,0,0,0],locked:false}),

  glance:()=>{const v=V();return [
   ['Locked Doors','Init 20 · once only','all four doors slam shut and lock'],
   ['Poison Gas','Init 20 · every round',`${dcc(v.dc)} Con · ${dd(gasT('t20'),'Poison Gas')}`],

   if(r){

   {k:'arc',h:'Arcana',dc:i.arc,t:'The door frames are warded by a sphere of force around each lock. <i>Dispel magic</i> will not work on it.'}];},
  head:()=>({flavor:'This fiendish trap was built to eliminate intruders who infiltrate a yuan-ti temple. The trap is a room, 60 feet on a side, with 5-foot-wide stone doors in the middle of each wall. In each corner of the room stands a 10-foot-tall statue of a great serpent, coiled and ready to strike. The eyes in each statue are rubies worth 200 gp apiece.',
   use:['The trap fills the room with poison and other deadly effects. It acts on initiative count 20 and 10.']}),

   <tr><td class="mono">6</td><td>Poison floods the room, forcing creatures to make saving throws as for the Poison Gas element.</td></tr></tbody></table></div>`;
   return `<section><h3>Active elements</h3><div class="els">

   const wr=[0,1].map(i=>{const w=x.wr[i];return `<div class="item"><h4>${BN[i]} warrior</h4><div class="num"><label for="wd${i}">Damage taken</label><input type="number" inputmode="numeric" id="wd${i}" data-field="wdmg" data-id="${i}" min="0" value="${w.dmg}"><span class="mono">/ ${v.wHP}</span></div><div class="ch-acts"><button type="button" class="btn sm" data-act="wsupp" data-id="${i}">${w.supp>=K.S.round?'Suppressed (clear)':'Suppress for 1 minute'}</button></div></div>`;}).join('');
   return [
    ['Braziers',`<p class="muted">Douse: ${v.douse} points of cold or water damage, or two successful actions smothering (Athletics or Sleight of Hand ${dcc(v.sk)} each); that brazier’s mist stops and its warrior grows furious (+${dd(v.fury,'Fury')} damage). Both doused: one final attack. Sanctify (within 5 ft): Religion, Wisdom, then Persuasion or Performance, each ${dcc(v.sanct)}; the warrior fades.</p>`+br],
    ['Spectral warriors',`<p class="muted">${v.wHP} damage each disperses it (nonmagical damage counts half, rounded down: enter the reduced value). Each ${v.flick} damage taken makes its next attack have disadvantage. <i>Dispel magic</i> ${dcc(v.disp)} or <i>banishment</i> suppresses one for 1 minute; <i>turn undead</i> at disadvantage.</p>`+wr],
    ['Mist',`<p class="muted">One brazier left: lightly obscured and the Vapors DC drops to ${v.vap1}; the mist stops spreading. <i>Gust of wind</i> clears a 10-ft corridor for 1 minute; the mist returns each round while a brazier burns.</p>`+`<div class="ch-acts"><button type="button" class="btn sm" data-act="ant">${x.next?'Anticipated: '+TXT[x.next]:'Anticipate next Mist (Arcana '+v.ant+')'}</button></div>`],
    ['Sarcophagus',`<p class="muted">Reverse the trigger: three successes, each ${dcc(v.app)}: Sleight of Hand; History or Religion; Performance or Persuasion. The trap deactivates.</p>`+K.step('sarc','Successes',x.sarc,3)]
   ];
  },
  ident:()=>{const i=V().id;return [
   {k:'pp',passive:true,h:'Passive Perception',dc:i.pp,t:'Burn marks and scorch patterns on the floor radiating outward from both braziers in overlapping circles: the braziers have activated many times before.'},
   {k:'per',h:'Perception',dc:i.per,t:'Old weapon marks (sword cuts, axe gouges) on the walls and pillars, too high and scattered to have been made during construction. If the check succeeds by 5 or more, the air near the braziers also seems to shimmer slightly, even when the fires burn normally.'},
   {k:'his',h:'History or Investigation',dc:i.his,t:'The braziers are positioned in classic military formation, flanking a central position defensively. Commanders used paired signal fires to coordinate troops.'},
   {k:'arc',h:'Arcana',dc:i.arc,t:'Faint necromantic and illusion magic from the braziers, bound to the ashes within them: the cremated remains of the general’s honor guard.'}];},
  head:()=>({flavor:'The tomb of General Thrace Ironhelm is protected by an ancient military trap. Two bronze braziers flank his stone sarcophagus, and when disturbed, they fill the chamber with a dense, supernatural mist that disorients intruders while spectral warriors emerge to defend their commander’s rest.',
   use:['This trap works best in a military tomb, crypt, or memorial dedicated to a legendary warrior. The general’s devotion to his soldiers in life has bound their spirits to his tomb in death, creating a trap that doesn’t just kill intruders: it captures them in an eternal battle.','The trap can be themed to match different military traditions: legionnaires with shields and short swords, viking warriors with axes, samurai with katanas, or knights with longswords. Adjust the spectral warriors’ appearance to match your campaign setting.','Consider placing valuable military artifacts near the sarcophagus (the general’s sword, banner, or medal of honor) to tempt characters deeper into the chamber before the trap triggers. The braziers themselves might appear ceremonial at first, making characters less likely to suspect their deadly purpose.']}),
  ref:()=>{
   const v=V();
   const tbl=`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>d6</th><th>Effect</th></tr></thead><tbody>${[1,2,3,4,5,6].map(e=>`<tr><td class="mono">${e}</td><td><b>${TXT[e]}.</b> ${effText(e,v,'One')}</td></tr>`).join('')}</tbody></table></div>`;
   return `<section><h3>Constant elements</h3><div class="els">
   ${K.el('Obscuring Mist','Once activated','Both braziers belch thick, grey mist that fills the chamber. It creates a heavily obscured area throughout the entire tomb. Darkvision cannot penetrate it. The mist fills the entire 40-foot by 50-foot chamber and remains 15 feet high (stopping just below the vaulted ceiling).')}
   ${K.el('Disorienting Vapors','Start of turn / first entry',`The mist carries whispers of military commands, war cries and dying screams. Any creature that starts its turn within the mist, or moves into it for the first time on its turn, must make a ${dcc(v.dc)} Wisdom saving throw or become disoriented: disadvantage on attack rolls and Wisdom (Perception) checks until the start of its next turn. Creatures immune to being frightened are immune to this effect.`)}
   ${K.el('Treacherous Footing','Always',`The condensation makes the stone floor slippery. The entire chamber is difficult terrain. Any creature that takes damage while moving through the chamber must succeed on a ${dcc(v.foot)} Dexterity saving throw or fall prone.`)}
   </div></section>
   <section><h3>Active elements</h3><div class="els">
   ${K.el('Braziers Ignite','Initiative 20 · once only',`Both braziers erupt with green-tinged flames that reach 10 feet high. They cast an eerie, dim light that deepens the shadows. Each brazier begins producing mist immediately. Any creature within 5 feet of a brazier when it ignites must make a ${dcc(v.dc)} Dexterity saving throw or take ${dd(v.fire,'Braziers fire')} fire damage, half on a success.`)}
   ${K.el('Spectral Warriors Manifest','Initiative 20 · once only','Two spectral warriors emerge from the mist, one near each brazier. They are not full creatures but trap elements. They are translucent figures in ancient military armor wielding ghostly weapons, and cannot be targeted or damaged until a character interacts with them (by entering their area, attacking, or attempting to disarm the trap near them).')}
   ${K.el('Phantom Blades','Initiative 20 · every round',`Each spectral warrior attacks any creature within 10 feet of its brazier: a melee attack ${at(v.a[0],'Phantom Blade')} against up to two different targets in range. <b>Hit:</b> ${dd(v.dm,'Phantom Blade slashing')} slashing damage. If a warrior has no targets in range, it moves up to 20 feet toward the nearest creature in the chamber.`)}
   ${K.el('Mist Thickens','Initiative 10 · every round','The mist grows denser, carrying more potent vapors. Roll on the table.'+tbl)}
   </div></section>
   <section><h3>Dynamic elements</h3><div class="els">
   ${K.el('Warriors Solidify','Per warrior',`Each time Phantom Blades hits a creature, that warrior becomes more solid. After two hits its attack bonus becomes ${at(v.a[1],'Phantom Blade')} and its damage ${dd(v.dm,'Phantom Blade slashing',v.fl[1])}. After four hits: ${at(v.a[2],'Phantom Blade')} and ${dd(v.dm,'Phantom Blade slashing',v.fl[2])}. Track each warrior separately.`)}
   ${K.el('Spreading Mist','4+ rounds','If the trap remains active for 4 or more rounds, the mist seeps into adjacent corridors and rooms at 10 feet per round beyond the chamber, potentially cutting off escape routes.')}
   ${K.el('General’s Command','From round 3','If both spectral warriors are still active, they fight in coordinated formation. If both target the same creature on the same turn, that creature has disadvantage on any saving throws against trap effects until the start of its next turn.')}
   </div></section>
   <section><h3>Countermeasures</h3><div class="els">
   ${K.el('Braziers Ignite','',`<b>Douse the flames.</b> Each brazier needs ${v.douse} points of cold or water-based damage, or two successful actions smothering it (Athletics or Sleight of Hand ${dcc(v.sk)} per action). A doused brazier stops producing mist. But dousing makes the warrior of that brazier furious: its damage increases by ${dd(v.fury,'Fury')} for the rest of the encounter. If both braziers are extinguished, the trap ends but the warriors make one final attack against all creatures in the chamber before dissipating.`,
    K.cm('Sanctify the flames',`A character with divine magic, within 5 feet of a brazier (in range of the warrior), needs three successes, each ${dcc(v.sanct)}: Religion (funeral rites); Wisdom (connect peacefully with the warrior’s spirit); Persuasion or Performance (honor its service). The brazier dims to a peaceful light and its warrior salutes and fades. The mist from it is reduced as for an extinguished brazier.`))}
   ${K.el('Spectral Warriors','',`<b>Destroy them.</b> Each warrior must take ${v.wHP} points of damage to disperse. Magical damage counts normally; nonmagical weapon damage counts as half, rounded down. Each ${v.flick} points taken makes its next attack have disadvantage. <b>Bind them.</b> <i>Dispel magic</i> ${dcc(v.disp)} or <i>banishment</i> suppresses one for 1 minute. <i>Turn undead</i> has disadvantage (they are magical constructs, not undead); a success drives them back toward their brazier.`)}
   ${K.el('Obscuring Mist','',`<b>Reduce production.</b> For each brazier extinguished or sanctified the mist lessens. With one active, the chamber is lightly obscured and the Disorienting Vapors DC is ${v.vap1}; the mist stops spreading. <b>Disperse.</b> <i>Gust of wind</i> clears a 10-foot-wide corridor for 1 minute; <i>wind wall</i> keeps mist from one side. While the braziers burn, the mist returns at the end of each round.`)}
   ${K.el('Mist Thickens','',`<b>Anticipate.</b> An action studying the braziers and mist plus an Intelligence (Arcana) check ${dcc(v.ant)} predicts the next effect: warn allies (advantage on the save) or reposition.`)}
   ${K.el('Disorienting Vapors','',`<b>Steady your mind.</b> An action grants advantage on saves against the vapors until the start of the next turn. The Help action steadies an adjacent ally (advantage on their next save).`)}
   ${K.el('Treacherous Footing','',`<b>Move carefully.</b> Moving at half speed (minimum 10 feet) makes a creature immune.`)}
   ${K.el('Sarcophagus','',`<b>Reverse the trigger.</b> Restore the sarcophagus without fully disturbing it: three successes, each ${dcc(v.app)}: Sleight of Hand; History or Religion; Performance or Persuasion. The trap deactivates, the warriors bow and fade, the braziers dim.`)}
   </div></section>
   <section><h3>Encounter notes</h3><p><b>Treasure:</b> the sarcophagus contains the general’s personal sword (a +1 longsword), a medal of honor worth 250 gp and a military banner worth 150 gp or more to a collector or order. Ashes collected respectfully from each brazier after the trap is deactivated are a 100 gp material component for necromantic spells.</p><p><b>Aftermath:</b> if the trap is overcome through violence the tomb feels cold and violated. If overcome through respect (sanctifying the braziers, appeasing the spirits), the tomb emanates peace and characters may receive a blessing: advantage on their next death saving throw.</p></section>
   <section><h3>Map</h3><ul><li>40 ft × 50 ft chamber. Two bronze braziers 10 ft in front of and to either side of the sarcophagus.</li><li>Stone sarcophagus in the center of the far wall, on a 2-ft dais. Four stone pillars. Single 5-ft doorway in the center of the near wall. Wall alcoves with decorative weapons and shields.</li><li>The warriors manifest next to their braziers; the mist fills the chamber by the end of round 1.</li></ul></section>`;
  },
  begin:()=>{X().man=true;},
  leave:k=>{if(k==='m20'&&lit()===0)X().final=true;},
  actions:{
   igres:(id,m)=>K.commit(()=>{const c=K.pc(id);if(c)L(c.name+(m==='f'?' fails the ignition save: full fire damage.':' saves against the ignition: half damage.'));}),
   wres:(id,m)=>K.commit(()=>{const c=K.pc(id),i=+m[1],w=X().wr[i];if(!c)return;
    if(m[0]==='h'){w.hits++;L(BN[i]+' warrior hits '+c.name+' ('+w.hits+' hits).');}else L(BN[i]+' warrior misses '+c.name+'.');
    if(w.fl>0)w.fl--;}),
   vres:(id,m)=>K.commit(()=>{const c=K.pc(id);if(!c)return;if(m==='f'&&!c.f.nofear){c.f.dis=true;L(c.name+' fails the Disorienting Vapors save: disoriented.');}else{c.f.dis=false;L(c.name+' resists the vapors.');}}),
   mres:(id,m)=>K.commit(()=>{const c=K.pc(id);if(!c)return;const f=m[0]==='f',e=+m[1];
    if(f){if(e===3)c.f.blind=true;if(e===5)c.f.grap=true;if(e===6)c.f.fright=true;if(e===4)c.f.slow=true;if(e===2)c.f.fe=true;}
    L(c.name+(f?' fails':' passes')+' the '+TXT[e]+' save.');}),
   mist:id=>K.commit(()=>{const S=K.S,x=X();const e=+id||x.next||K.rnd(6);x.next=null;S.res[S.round+':mist']={roll:e,flash:K.rnd(2)===1?'Left':'Right'};L('Mist Thickens: d6 = '+e+' '+TXT[e]);}),
   ant:()=>K.commit(()=>{const x=X();if(!x.next){x.next=K.rnd(6);L('Anticipated: the next Mist Thickens is '+TXT[x.next]+'.');}}),
   bst:(id,m,el)=>K.commit(()=>{setB(+id,el.dataset.v);}),
   bsm:(id,m,el)=>K.commit(()=>{const q=X().br[+id];q.sm=Math.max(0,Math.min(2,q.sm+(+el.dataset.d)));L(BN[+id]+' brazier smothering: '+q.sm+'/2');if(q.sm>=2)setB(+id,'doused');}),
   bsa:(id,m,el)=>K.commit(()=>{const q=X().br[+id];q.sa=Math.max(0,Math.min(3,q.sa+(+el.dataset.d)));L(BN[+id]+' brazier funeral rites: '+q.sa+'/3');if(q.sa>=3)setB(+id,'sanct');}),
   wsupp:id=>K.commit(()=>{const w=X().wr[+id];if(w.supp>=K.S.round){w.supp=0;L(BN[+id]+' warrior is no longer suppressed.');}else{w.supp=K.S.round+9;L(BN[+id]+' warrior suppressed for 1 minute.');}}),
   sarc:(id,m,el)=>K.commit(()=>{const x=X();x.sarc=Math.max(0,Math.min(3,x.sarc+(+el.dataset.d)));L('Sarcophagus appeasement: '+x.sarc+'/3');})
  },
  fields:{
   bcold:(id,v)=>K.commit(()=>{const q=X().br[+id];q.cold=Math.max(0,parseInt(v,10)||0);L(BN[+id]+' brazier: '+q.cold+' cold/water damage.');if(q.cold>=V().douse)setB(+id,'doused');}),
   wdmg:(id,v)=>K.commit(()=>{const w=X().wr[+id],old=w.dmg;w.dmg=Math.max(0,parseInt(v,10)||0);const f=V().flick;w.fl+=Math.max(0,Math.floor(w.dmg/f)-Math.floor(old/f));L(BN[+id]+' warrior has taken '+w.dmg+' damage.'+(w.dmg>=V().wHP?' It disperses.':''));})
  }
 };
}));

/* ───────── Engine for the Complex Traps Vol. 1 book traps (data-driven, on top of KIT) ───────── */
const BK=(function(){
const BVI=[0,1,3,4]; // tracker tier -> book version index (T1, T2, T4, T5)
const parse=s=>{const m=String(s).match(/^(\d+)d(\d+)(?:\+(\d+))?$/);return m?{t:[[+m[1],+m[2]]],f:+(m[3]||0)}:{t:[[0,6]],f:0};};
const strip=h=>String(h).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
function pal(id,h){
 const l=`body[data-trap="${id}"]{--bg:hsl(${h},18%,92%);--surface:hsl(${h},25%,97%);--surface-2:hsl(${h},16%,87%);--line:hsl(${h},14%,76%);--fg:hsl(${h},35%,14%);--muted:hsl(${h},12%,38%);--accent:hsl(${h},55%,34%);--accent-ink:hsl(${h},30%,97%);--accent-soft:hsl(${h},45%,88%);--calm:#2F7A5C;--calm-soft:#D3EADF;--warn:#8A5410;--warn-soft:#F2E2C4;--crit:#A6362F;--crit-soft:#F4D8D4}`;
 const d=`--bg:hsl(${h},22%,8%);--surface:hsl(${h},20%,12%);--surface-2:hsl(${h},18%,16%);--line:hsl(${h},15%,26%);--fg:hsl(${h},25%,92%);--muted:hsl(${h},12%,68%);--accent:hsl(${h},70%,70%);--accent-ink:hsl(${h},22%,8%);--accent-soft:hsl(${h},35%,20%);--calm:#7CCBA3;--calm-soft:#163227;--warn:#EBB05A;--warn-soft:#3A2D14;--crit:#F08A80;--crit-soft:#3E1D1B`;
 const s=document.createElement('style');
 s.textContent=l+`\n:root:not([data-theme="light"]) body[data-trap="${id}"]{${d}}\n:root[data-theme="dark"] body[data-trap="${id}"]{${d}}`;
 document.head.appendChild(s);
}
function make(def){
 pal(def.id,def.hue);
 return KIT.make(K=>{
  const {dcc,dd,at,b,esc}=K;
  const X=()=>K.S.x;
  const P=(...a)=>a[BVI[K.S.tier-1]];
  const H={
   dc:n=>dcc(n),
   D:(s,l)=>{const p=parse(s);return dd(p.t,l,p.f);},
   A:(n,l,adv)=>at(n,l,adv),
   tog:(f,id,l,c,lk)=>K.tog(f,id,l,c,lk),
   btn:(act,l,m)=>K.b(act,0,l,m),
   avg:s=>{const p=parse(s);return K.avgT(p.t)+p.f;},
   tab:k=>{const t=(def.tabs||[]).find(q=>q.k===k),r=X().tab[k];return `<button type="button" class="btn sm" data-act="rtab" data-t="${k}">Roll d${t.n}</button>${r?`<span class="remind"><span><b>${t.l} · ${r}:</b> ${t.rows(V(),H)[r-1]}</span></span>`:''}`;}
  };
  const V=()=>def.v(P,K.S,X(),H);
  const els=def.els||[];
  const byK=k=>els.find(e=>e.k===k);
  const isOff=id=>!!X().off[id]||(def.cms||[]).some(g=>g.dis&&g.dis.includes(id)&&g.trk&&X().t[g.trk]>=g.max(V(),X()));
  const cond=(e,n)=>{const f=e.at[n];return f===true||f(X(),V(),K.S);};
  const actEls=n=>els.filter(e=>e.at&&(n in e.at)&&!isOff(e.k)&&!(e.once&&X().done[e.k])&&cond(e,n));
  const initList=[...new Set(els.filter(e=>e.at).flatMap(e=>Object.keys(e.at).map(Number)))].sort((a,b)=>b-a);
  const nm=e=>typeof e.name==='function'?e.name(V(),X()):e.name;
  const targets=e=>{const l=e.who?e.who(K.S.party,X(),V(),K.S):K.S.party.filter(c=>!def.zones||c.z!==def.outZone);return l;};
  const rowBtns=(e,c)=>{
   const v=V();let h='';
   if(e.rows==='atk')h+=at(e.atk(v,c,X()),nm(e)+': '+c.name,e.adv&&e.adv(c))+K.b('res',c.id,'Hit','h:'+e.k,'crit')+K.b('res',c.id,'Miss','m:'+e.k,'calm');
   else if(e.rows==='save')h+=K.b('res',c.id,'Failed','f:'+e.k,'crit')+K.b('res',c.id,'Saved','s:'+e.k,'calm');
   if(e.dmg)h+=H.D(e.dmg(v,c,X()),nm(e)+' damage: '+c.name);
   return h;
  };
  const elBlock=(e,forChar)=>{
   const v=V(),x=X();
   const lst=e.rows?(forChar?[forChar]:targets(e)):[];
   return `<div class="blk" style="margin-top:12px"><p><b>${nm(e)}</b>${e.tag?` <span class="muted">· ${typeof e.tag==='function'?e.tag(v,x):e.tag}</span>`:''}</p><p>${e.text(v,x,H,K.S,forChar)}</p>${e.rows?`<div class="trows">${lst.map(c=>K.trow(c,rowBtns(e,c))).join('')||'<p class="muted">Nobody in the area.</p>'}</div>`:''}</div>`;
  };
  const stateBlock=()=>{const v=V(),x=X();return (def.tracks||[]).length?`<div class="trackbar" style="margin-top:12px;display:grid;gap:6px">${def.tracks.map(t=>K.step('trk',t.l,x.t[t.k],t.max(v,x),t.k)).join('')}</div>`:'';};
  const sp={
   id:def.id,name:def.name,eyebrow:def.eyebrow,tagline:def.tagline,base:2,sev:[1,1,1,1],threat:def.threat,note:def.note||'Numbers come from the five official versions of Complex Traps Vol. 1 (levels 1–4, 5–8, 9–12, 13–16 and 17–20). Tier 1 uses the levels 1–4 version, tier 2 the levels 5–8 version, tier 3 the levels 13–16 version and tier 4 the levels 17–20 version; the levels 9–12 version is not used. Nothing is rescaled.',
   zones:def.zones,outZone:def.outZone,conds:def.conds||[],
   partyHint:def.partyHint||'Add each character with their initiative. The trap acts on its own initiative counts and loses ties.',
   trigger:def.trigger,
   x:()=>Object.assign({t:Object.fromEntries((def.tracks||[]).map(t=>[t.k,t.init||0]).concat((def.cms||[]).filter(g=>g.trk).map(g=>[g.trk,0]))),off:{},done:{},tab:{}},def.x?def.x():{}),
   steps:initList.map(n=>({k:'i'+n,v:n,label:'Initiative '+n})),
   on:k=>actEls(+k.slice(1)).length>0,
   over:()=>def.over?def.over(V(),X(),K.S):false,
   overText:()=>def.overText||'',
   stats:()=>def.stats?def.stats(V(),X(),K.S,H):[],
   glance:()=>{const v=V(),x=X();return els.map(e=>[nm(e),(e.at?'Init '+Object.keys(e.at).join(' & '):'Constant')+(isOff(e.k)?' · disabled':''),e.sum?e.sum(v,x,H,K.S):''])},
   step:k=>{
    const n=+k.slice(1),list=actEls(n);
    return K.card(`Round ${K.S.round} · Initiative ${n}`,list.map(nm).join(' · '),list.map(e=>elBlock(e)).join('')+stateBlock());
   },
   leave:k=>{
    const n=+k.slice(1),list=actEls(n),x=X(),v=V();
    list.forEach(e=>{if(e.once)x.done[e.k]=true;if(e.act)e.act(x,v,K.S,K.L);});
   },
   turn:c=>{
    const list=els.filter(e=>!e.at&&!isOff(e.k)&&(!e.app||e.app(c,X(),V(),K.S)));
    return (list.map(e=>elBlock(e,c)).join('')||'<p class="muted" style="margin-top:8px">No constant element threatens this creature on its turn.</p>')+stateBlock();
   },
   cm:()=>{
    const v=V(),x=X(),out=[];
    if((def.tracks||[]).length)out.push(['Trap state',def.tracks.map(t=>K.step('trk',t.l,x.t[t.k],t.max(v,x),t.k)).join('')+(def.stateNote?`<p class="muted">${def.stateNote(v,x,K.S)}</p>`:'')]);
    if(def.setup)out.unshift(def.setup(v,x,H));
    (def.cms||[]).forEach(g=>{
     const dis=(g.dis||[]).some(isOff);
     out.push([g.h,`<div>${g.items(v,x,H).map(([a,t])=>K.cm(a,t)).join('')}</div>`+(g.trk?K.step('trk',g.l||'Progress',x.t[g.trk],g.max(v,x),g.trk):'')+((g.dis||[]).map(id=>K.tog('eoff',id,'Disabled: '+nm(byK(id)),isOff(id),!x.off[id]&&isOff(id))).join(''))+(dis?`<span class="chip ok">disabled</span>`:'')]);
    });
    return out;
   },
   ident:()=>def.id_(V(),P),
   head:()=>({flavor:def.flavor,use:def.use}),
   ref:()=>{
    const v=V(),x=X();
    const sec=(h,a)=>a.length?`<section><h3>${h}</h3><div class="els">${a.join('')}</div></section>`:'';
    const act=els.filter(e=>e.at).map(e=>K.el(nm(e),'Initiative '+Object.keys(e.at).join(' & ')+(e.once?' · once only':''),e.text(v,x,H,K.S)));

    const cms=(def.cms||[]).map(g=>K.el(g.h,g.tag||'Countermeasures','',g.items(v,x,H).map(([a,t])=>K.cm(a,t)).join('')));
    const tabs=(def.tabs||[]).map(t=>`<section><h3>${t.l}</h3><div class="els"><article class="el"><header><h3>d${t.n}</h3><span class="tag">${H.tab(t.k)}</span></header>${t.rows(v,H).map((r,i)=>K.cm(i+1,r)).join('')}</article></div></section>`);
    return `<section><h3>Initiative</h3><p>${def.init}</p></section>`+sec('Active elements',act)+sec('Constant elements',con)+sec('Dynamic elements',dyn)+sec('Countermeasures',cms)+(def.refExtra?def.refExtra(v,x,H):'')+tabs.join('');
   },

    res:(id,m)=>K.commit(()=>{
     const c=K.pc(id),x=X(),[kind,ek]=m.split(':'),e=byK(ek);if(!c||!e)return;

     K.L(c.name+' '+({f:'fails the',s:'passes the',h:'is hit by the',m:'is missed by the'})[kind]+' '+(typeof e.name==='function'?e.name(V(),x):e.name)+(e.rows==='atk'?' attack':' save')+'.');
     if(bad&&e.fail)e.fail(c,x,V(),K.S,K.L);
     if(!bad&&e.pass)e.pass(c,x,V(),K.S,K.L);
    }),
    ...Object.fromEntries(Object.keys(def.actions||{}).map(k=>[k,(id,m,el)=>K.commit(()=>{def.actions[k](id,m,el,X(),V(),K.L,K.S,K.pc);})])),
    rtab:(id,m,el)=>K.commit(()=>{
     const t=def.tabs.find(q=>q.k===el.dataset.t),r=K.rnd(t.n),x=X();x.tab[t.k]=r;const tx=strip(t.rows(V(),H)[r-1]);
     K.S.last={label:t.l,formula:'d'+t.n+' ('+r+')',total:r};K.L(t.l+': d'+t.n+' = '+r+' → '+tx);
     if(t.on)t.on(r,x,V(),K.S,K.L);
    })
   },
   fields:Object.assign({eoff:(id,v,el)=>K.commit(()=>{X().off[id]=el.checked;K.L((el.checked?'Disabled: ':'Re-enabled: ')+strip(nm(byK(id))));})},Object.fromEntries(Object.keys(def.fields||{}).map(k=>[k,(id,v,el)=>K.commit(()=>{def.fields[k](id,v,el,X(),V(),K.L,K.S);})]))),
   newRound:()=>{if(def.newRound)def.newRound(X(),V(),K.S,K.L);},
   begin:()=>{if(def.begin)def.begin(X(),V(),K.S,K.L);}
  };
  sp.init=def.init;
  return sp;
 });
}
